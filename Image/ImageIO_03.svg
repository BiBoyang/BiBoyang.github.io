<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', sans-serif">
  <defs>
    <marker id="ar-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="ar-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#16a34a"/>
    </marker>
    <marker id="ar-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/>
    </marker>
    <marker id="ar-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#f59e0b"/>
    </marker>
    <marker id="ar-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="560" fill="#fafafa" rx="12"/>

  <!-- Title -->
  <text x="430" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">解码策略决策流程</text>

  <!-- Start node -->
  <rect x="330" y="60" width="200" height="44" fill="#1e293b" rx="22"/>
  <text x="430" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">图像解码请求</text>

  <!-- Arrow down -->
  <line x1="430" y1="104" x2="430" y2="128" stroke="#64748b" stroke-width="2" marker-end="url(#ar-s)"/>

  <!-- Decision: image type -->
  <polygon points="430,130 570,185 430,240 290,185" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="430" y="180" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">图像类型？</text>
  <text x="430" y="198" text-anchor="middle" font-size="10" fill="#64748b">static / animated</text>

  <!-- ====== Left branch: Static ====== -->
  <line x1="290" y1="185" x2="160" y2="185" stroke="#16a34a" stroke-width="2" marker-end="url(#ar-g)"/>
  <text x="220" y="178" text-anchor="middle" font-size="11" font-weight="600" fill="#16a34a">静态图</text>

  <rect x="40" y="160" width="120" height="50" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" rx="8"/>
  <text x="100" y="183" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">lazy decode</text>
  <text x="100" y="199" text-anchor="middle" font-size="10" fill="#16a34a">默认策略 ✓</text>

  <line x1="100" y1="210" x2="100" y2="235" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ar-g)"/>

  <!-- Benefits -->
  <rect x="25" y="240" width="150" height="80" fill="#f0fdf4" stroke="#16a34a" stroke-width="1" rx="6"/>
  <text x="100" y="260" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">收益</text>
  <text x="100" y="278" text-anchor="middle" font-size="10" fill="#475569">• 延迟解码</text>
  <text x="100" y="293" text-anchor="middle" font-size="10" fill="#475569">• 节省内存</text>
  <text x="100" y="308" text-anchor="middle" font-size="10" fill="#475569">• 控制解码时机</text>

  <!-- Arrow to rendering -->
  <line x1="100" y1="320" x2="100" y2="400" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="110" y="365" font-size="10" fill="#64748b">主线程使用时</text>
  <line x1="100" y1="400" x2="350" y2="400" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar-s)"/>

  <!-- ====== Right branch: Animated ====== -->
  <line x1="570" y1="185" x2="700" y2="185" stroke="#dc2626" stroke-width="2" marker-end="url(#ar-r)"/>
  <text x="640" y="178" text-anchor="middle" font-size="11" font-weight="600" fill="#dc2626">动图</text>

  <rect x="700" y="160" width="120" height="50" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="8"/>
  <text x="760" y="183" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">non-lazy decode</text>
  <text x="760" y="199" text-anchor="middle" font-size="10" fill="#dc2626">默认策略 ✓</text>

  <line x1="760" y1="210" x2="760" y2="235" stroke="#dc2626" stroke-width="1.5" marker-end="url(#ar-r)"/>

  <!-- Reason -->
  <rect x="685" y="240" width="150" height="80" fill="#fef2f2" stroke="#dc2626" stroke-width="1" rx="6"/>
  <text x="760" y="260" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">风险规避</text>
  <text x="760" y="278" text-anchor="middle" font-size="10" fill="#475569">• 播放线程安全</text>
  <text x="760" y="293" text-anchor="middle" font-size="10" fill="#475569">• 避免 source 耦合</text>
  <text x="760" y="308" text-anchor="middle" font-size="10" fill="#475569">• 帧缓存可控</text>

  <!-- Arrow to rendering -->
  <line x1="760" y1="320" x2="760" y2="400" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="690" y="365" font-size="10" fill="#64748b">稳定性优先</text>
  <line x1="760" y1="400" x2="510" y2="400" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar-s)"/>

  <!-- ====== Center: force decode decision ====== -->
  <rect x="350" y="375" width="160" height="50" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" rx="8"/>
  <text x="430" y="395" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">force decode</text>
  <text x="430" y="412" text-anchor="middle" font-size="10" fill="#92400e">提前展开位图</text>

  <line x1="430" y1="425" x2="430" y2="450" stroke="#f59e0b" stroke-width="2" marker-end="url(#ar-o)"/>

  <!-- Force decode value -->
  <rect x="270" y="455" width="320" height="85" fill="#fffbeb" stroke="#f59e0b" stroke-width="1" rx="8"/>
  <text x="430" y="475" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">force decode 不只是性能优化</text>
  <line x1="310" y1="483" x2="550" y2="483" stroke="#f59e0b" stroke-width="0.5" stroke-dasharray="3,3"/>
  <text x="430" y="500" text-anchor="middle" font-size="10" fill="#92400e">① 提前消除 lazy wrapper</text>
  <text x="430" y="516" text-anchor="middle" font-size="10" fill="#92400e">② 规避渲染路径异常</text>
  <text x="430" y="532" text-anchor="middle" font-size="10" fill="#92400e">③ 显式确定渲染前状态</text>
  <text x="430" y="550" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">→ 首先是稳定性工具</text>

</svg>