<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 580" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif">
  <defs>
    <marker id="arr4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569"/>
    </marker>
    <marker id="arr4bi" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569" opacity="0.5"/>
    </marker>
    <filter id="sh4" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="920" height="580" fill="#0e1a1a" rx="14"/>

  <!-- User input -->
  <rect x="30" y="240" width="110" height="50" rx="14" fill="rgba(167,139,250,0.07)" stroke="rgba(167,139,250,0.22)" stroke-width="1.5" filter="url(#sh4)"/>
  <text x="85" y="262" text-anchor="middle" font-size="13" fill="#a78bfa" font-weight="700">用户输入</text>
  <text x="85" y="280" text-anchor="middle" font-size="12" fill="#a78bfa">+ 任务目标</text>
  <line x1="140" y1="265" x2="174" y2="265" stroke="#475569" stroke-width="2" marker-end="url(#arr4)"/>

  <!-- ============ Layer 1: 约束安全层 ============ -->
  <rect x="180" y="60" width="520" height="85" rx="14" fill="rgba(52,211,153,0.07)" stroke="rgba(52,211,153,0.22)" stroke-width="2" filter="url(#sh4)"/>
  <rect x="195" y="48" width="130" height="24" rx="12" fill="#34d399"/>
  <text x="260" y="65" text-anchor="middle" font-size="13" fill="#0e1a1a" font-weight="700">约束安全层</text>
  <text x="210" y="92" font-size="13" fill="#34d399" font-weight="600">全程兜底 · 防范饱和与冲突</text>
  <line x1="210" y1="100" x2="670" y2="100" stroke="rgba(52,211,153,0.15)" stroke-width="1"/>
  <text x="210" y="118" font-size="13" fill="#6ee7b7">▸ 资源预算限制</text>
  <text x="360" y="118" font-size="13" fill="#6ee7b7">▸ 调用配额上限</text>
  <text x="510" y="118" font-size="13" fill="#6ee7b7">▸ 安全策略规范</text>
  <text x="210" y="135" font-size="13" fill="#6ee7b7">▸ 规则冲突处理</text>
  <text x="360" y="135" font-size="13" fill="#6ee7b7">▸ 降级适配</text>
  <text x="510" y="135" font-size="13" fill="#6ee7b7">▸ 熔断兜底</text>

  <!-- bidirectional arrow 1 <-> 2 -->
  <line x1="440" y1="145" x2="440" y2="173" stroke="#475569" stroke-width="1.5" marker-start="url(#arr4bi)" marker-end="url(#arr4)"/>

  <!-- ============ Layer 2: 控制决策层 ============ -->
  <rect x="180" y="175" width="520" height="85" rx="14" fill="rgba(45,212,191,0.07)" stroke="rgba(45,212,191,0.22)" stroke-width="2" filter="url(#sh4)"/>
  <rect x="195" y="163" width="130" height="24" rx="12" fill="#2dd4bf"/>
  <text x="260" y="180" text-anchor="middle" font-size="13" fill="#0e1a1a" font-weight="700">控制决策层</text>
  <text x="210" y="207" font-size="13" fill="#2dd4bf" font-weight="600">确定性骨架 + 生成式补偿</text>
  <line x1="210" y1="215" x2="670" y2="215" stroke="rgba(45,212,191,0.15)" stroke-width="1"/>
  <text x="210" y="233" font-size="13" fill="#5eead4">▸ 策略编排</text>
  <text x="330" y="233" font-size="13" fill="#5eead4">▸ 任务规划器</text>
  <text x="460" y="233" font-size="13" fill="#5eead4">▸ 提示模板体系</text>
  <text x="580" y="233" font-size="13" fill="#5eead4">▸ 规则引擎</text>
  <text x="210" y="250" font-size="12" fill="#2dd4bf" font-style="italic">避免 LLM 过载：骨架确定性流程 + LLM 补充生成</text>

  <!-- bidirectional arrow 2 <-> 3 -->
  <line x1="440" y1="260" x2="440" y2="288" stroke="#475569" stroke-width="1.5" marker-start="url(#arr4bi)" marker-end="url(#arr4)"/>

  <!-- ============ Layer 3: 执行反馈层 ============ -->
  <rect x="180" y="290" width="520" height="85" rx="14" fill="rgba(251,191,36,0.07)" stroke="rgba(251,191,36,0.22)" stroke-width="2" filter="url(#sh4)"/>
  <rect x="195" y="278" width="130" height="24" rx="12" fill="#fbbf24"/>
  <text x="260" y="295" text-anchor="middle" font-size="13" fill="#0e1a1a" font-weight="700">执行反馈层</text>
  <text x="210" y="322" font-size="13" fill="#fbbf24" font-weight="600">三重校验 · 高效纠偏</text>
  <line x1="210" y1="330" x2="670" y2="330" stroke="rgba(251,191,36,0.15)" stroke-width="1"/>
  <text x="210" y="348" font-size="13" fill="#fcd34d">▸ 结构校验</text>
  <text x="330" y="348" font-size="13" fill="#fcd34d">▸ 语义校验</text>
  <text x="460" y="348" font-size="13" fill="#fcd34d">▸ 事实校验</text>
  <text x="580" y="348" font-size="13" fill="#fcd34d">▸ 重试回滚</text>
  <text x="210" y="365" font-size="12" fill="#fbbf24" font-style="italic">可验证 · 可纠错 · 可回滚</text>

  <!-- bidirectional arrow 3 <-> 4 -->
  <line x1="440" y1="375" x2="440" y2="403" stroke="#475569" stroke-width="1.5" marker-start="url(#arr4bi)" marker-end="url(#arr4)"/>

  <!-- ============ Layer 4: 状态估计层 ============ -->
  <rect x="180" y="405" width="520" height="85" rx="14" fill="rgba(96,165,250,0.07)" stroke="rgba(96,165,250,0.22)" stroke-width="2" filter="url(#sh4)"/>
  <rect x="195" y="393" width="130" height="24" rx="12" fill="#60a5fa"/>
  <text x="260" y="410" text-anchor="middle" font-size="13" fill="#0e1a1a" font-weight="700">状态估计层</text>
  <text x="210" y="437" font-size="13" fill="#60a5fa" font-weight="600">精准重构四类核心状态</text>
  <line x1="210" y1="445" x2="670" y2="445" stroke="rgba(96,165,250,0.15)" stroke-width="1"/>
  <text x="230" y="463" font-size="13" fill="#93c5fd">▸ 任务状态</text>
  <text x="360" y="463" font-size="13" fill="#93c5fd">▸ 证据状态</text>
  <text x="490" y="463" font-size="13" fill="#93c5fd">▸ 资源状态</text>
  <text x="610" y="463" font-size="13" fill="#93c5fd">▸ 风险状态</text>
  <text x="210" y="480" font-size="12" fill="#60a5fa" font-style="italic">过滤观测噪声 · 弥补不可直接获取的隐含状态</text>

  <!-- LLM external box -->
  <rect x="730" y="165" width="120" height="60" rx="14" fill="rgba(100,116,139,0.05)" stroke="rgba(148,163,184,0.15)" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#sh4)"/>
  <text x="790" y="190" text-anchor="middle" font-size="13" fill="#94a3b8" font-weight="600">LLM</text>
  <text x="790" y="208" text-anchor="middle" font-size="12" fill="#64748b">生成式补偿</text>
  <text x="790" y="220" text-anchor="middle" font-size="12" fill="#64748b" font-style="italic">外部黑箱</text>

  <!-- arrow layers <-> LLM -->
  <line x1="700" y1="195" x2="728" y2="195" stroke="#475569" stroke-width="1.5" marker-start="url(#arr4bi)" marker-end="url(#arr4)"/>

  <!-- arrow to output -->
  <line x1="700" y1="265" x2="768" y2="265" stroke="#475569" stroke-width="2" marker-end="url(#arr4)"/>
  <rect x="770" y="240" width="90" height="50" rx="14" fill="rgba(251,191,36,0.07)" stroke="rgba(251,191,36,0.22)" stroke-width="1.5" filter="url(#sh4)"/>
  <text x="815" y="262" text-anchor="middle" font-size="13" fill="#fbbf24" font-weight="700">输出</text>
  <text x="815" y="280" text-anchor="middle" font-size="12" fill="#fcd34d">任务结果</text>

  <!-- title -->
  <text x="460" y="535" text-anchor="middle" font-size="16" fill="#e2e8f0" font-weight="600">Harness Engineering 四层架构</text>
  <text x="460" y="555" text-anchor="middle" font-size="13" fill="#64748b">状态估计 → 控制决策 → 执行反馈 → 约束兜底，全链路闭环</text>
</svg>
