<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 580" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif">
  <defs>
    <marker id="arr1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569"/>
    </marker>
    <marker id="arr1f" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#fbbf24"/>
    </marker>
    <filter id="sh1" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="920" height="580" fill="#0e1a1a" rx="14"/>

  <!-- Constraints outer frame -->
  <rect x="25" y="50" width="870" height="485" rx="16" fill="none" stroke="rgba(45,212,191,0.12)" stroke-width="2" stroke-dasharray="8 5"/>
  <rect x="45" y="38" width="140" height="28" rx="14" fill="#162626" stroke="rgba(45,212,191,0.2)" stroke-width="1"/>
  <text x="115" y="57" text-anchor="middle" font-size="14" fill="#2dd4bf" font-weight="600">约束 Constraints</text>
  <text x="640" y="57" text-anchor="middle" font-size="13" fill="#64748b">安全策略 / 资源预算 / 时延要求 / 调用配额</text>

  <!-- Goal input -->
  <rect x="55" y="108" width="120" height="56" rx="14" fill="rgba(167,139,250,0.07)" stroke="rgba(167,139,250,0.22)" stroke-width="1.5" filter="url(#sh1)"/>
  <text x="115" y="132" text-anchor="middle" font-size="15" fill="#a78bfa" font-weight="700">目标输入</text>
  <text x="115" y="152" text-anchor="middle" font-size="13" fill="#a78bfa">Goal / 任务目标</text>

  <!-- arrow goal -> controller -->
  <line x1="175" y1="136" x2="207" y2="136" stroke="#475569" stroke-width="2" marker-end="url(#arr1)"/>

  <!-- Controller -->
  <rect x="210" y="85" width="195" height="110" rx="14" fill="rgba(45,212,191,0.07)" stroke="rgba(45,212,191,0.22)" stroke-width="1.5" filter="url(#sh1)"/>
  <text x="307" y="113" text-anchor="middle" font-size="16" fill="#2dd4bf" font-weight="700">控制器 Controller</text>
  <text x="307" y="136" text-anchor="middle" font-size="13" fill="#5eead4">策略编排 / 提示模板</text>
  <text x="307" y="155" text-anchor="middle" font-size="13" fill="#5eead4">规则引擎 / 任务规划器</text>
  <text x="307" y="180" text-anchor="middle" font-size="12" fill="#2dd4bf" font-style="italic">决策「怎么纠偏」</text>

  <!-- arrow controller -> plant -->
  <line x1="405" y1="136" x2="427" y2="136" stroke="#475569" stroke-width="2" marker-end="url(#arr1)"/>

  <!-- Plant / Agent -->
  <rect x="430" y="85" width="195" height="110" rx="14" fill="rgba(52,211,153,0.07)" stroke="rgba(52,211,153,0.22)" stroke-width="1.5" filter="url(#sh1)"/>
  <text x="527" y="113" text-anchor="middle" font-size="16" fill="#34d399" font-weight="700">被控对象 Plant</text>
  <text x="527" y="136" text-anchor="middle" font-size="13" fill="#6ee7b7">LLM + Agent 运行时</text>
  <text x="527" y="155" text-anchor="middle" font-size="13" fill="#6ee7b7">推理 / 工具调用 / 生成</text>
  <text x="527" y="180" text-anchor="middle" font-size="12" fill="#34d399" font-style="italic">黑箱 / 非线性 / 随机性</text>

  <!-- arrow plant -> output -->
  <line x1="625" y1="136" x2="647" y2="136" stroke="#475569" stroke-width="2" marker-end="url(#arr1)"/>

  <!-- Output -->
  <rect x="650" y="108" width="125" height="56" rx="14" fill="rgba(251,191,36,0.07)" stroke="rgba(251,191,36,0.22)" stroke-width="1.5" filter="url(#sh1)"/>
  <text x="712" y="132" text-anchor="middle" font-size="15" fill="#fbbf24" font-weight="700">输出</text>
  <text x="712" y="152" text-anchor="middle" font-size="13" fill="#fcd34d">任务结果 / 响应</text>

  <!-- Disturbance text -->
  <text x="527" y="77" text-anchor="middle" font-size="12" fill="#f87171" font-weight="600">↓ 扰动: 幻觉 / 超时 / 模糊输入</text>

  <!-- arrow output -> observation (down then left) -->
  <path d="M712 164 V210 H600 V243" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr1)"/>

  <!-- Observation -->
  <rect x="430" y="245" width="360" height="90" rx="14" fill="rgba(96,165,250,0.07)" stroke="rgba(96,165,250,0.22)" stroke-width="1.5" filter="url(#sh1)"/>
  <text x="610" y="272" text-anchor="middle" font-size="16" fill="#60a5fa" font-weight="700">观测 Observation</text>
  <text x="610" y="294" text-anchor="middle" font-size="13" fill="#93c5fd">用户输入 / 工具返回结果 / 系统日志信号</text>
  <text x="610" y="318" text-anchor="middle" font-size="12" fill="#60a5fa" font-style="italic">过滤噪声 · 弥补不可观测状态</text>

  <!-- arrow observation -> feedback (left) -->
  <line x1="430" y1="290" x2="403" y2="290" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arr1f)"/>

  <!-- Feedback -->
  <rect x="210" y="245" width="190" height="90" rx="14" fill="rgba(251,191,36,0.07)" stroke="rgba(251,191,36,0.22)" stroke-width="1.5" filter="url(#sh1)"/>
  <text x="305" y="272" text-anchor="middle" font-size="16" fill="#fbbf24" font-weight="700">反馈 Feedback</text>
  <text x="305" y="294" text-anchor="middle" font-size="13" fill="#fcd34d">自检机制 / 重试逻辑</text>
  <text x="305" y="316" text-anchor="middle" font-size="13" fill="#fcd34d">结果验证器 / 人工审核</text>

  <!-- arrow feedback -> controller (up) -->
  <path d="M305 245 L305 197" stroke="#fbbf24" stroke-width="2.5" fill="none" marker-end="url(#arr1f)"/>

  <!-- State -->
  <rect x="270" y="385" width="380" height="85" rx="14" fill="rgba(100,116,139,0.05)" stroke="rgba(148,163,184,0.15)" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#sh1)"/>
  <text x="460" y="412" text-anchor="middle" font-size="16" fill="#e2e8f0" font-weight="700">状态 State</text>
  <text x="460" y="434" text-anchor="middle" font-size="13" fill="#94a3b8">会话上下文 / 任务进度 / 记忆摘要 / 工具运行状态</text>
  <text x="460" y="456" text-anchor="middle" font-size="12" fill="#64748b" font-style="italic">控制器与观测共同维护的核心信息</text>

  <!-- dashed lines state -> controller / observation -->
  <line x1="350" y1="385" x2="325" y2="197" stroke="rgba(148,163,184,0.15)" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="570" y1="385" x2="610" y2="335" stroke="rgba(148,163,184,0.15)" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- title -->
  <text x="460" y="505" text-anchor="middle" font-size="16" fill="#e2e8f0" font-weight="600">控制论六大核心模块 → Agent 工程对标</text>
  <text x="460" y="527" text-anchor="middle" font-size="13" fill="#64748b">闭环逻辑：观测 → 决策 → 执行 → 反馈，约束兜底，状态贯穿</text>
</svg>
