<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', sans-serif">
  <defs>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="540" fill="#fafafa" rx="12"/>

  <!-- Title -->
  <text x="430" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">SDWebImage 两代解决方案演进</text>

  <!-- ====== Left: Gen 1 ====== -->
  <rect x="30" y="60" width="380" height="460" fill="#fff3cd" stroke="#f59e0b" stroke-width="1.5" rx="10"/>
  <rect x="30" y="60" width="380" height="40" fill="#f59e0b" rx="10"/>
  <rect x="30" y="85" width="380" height="15" fill="#f59e0b"/>
  <text x="220" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">第一代：先止血</text>

  <text x="220" y="124" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">PR #3387 · 应急修复</text>

  <!-- Flow: Source -->
  <rect x="110" y="145" width="220" height="40" fill="#fff" stroke="#64748b" stroke-width="1.5" rx="8"/>
  <text x="220" y="170" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">CGImageSourceRef</text>

  <line x1="220" y1="185" x2="220" y2="205" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <text x="235" y="200" font-size="10" fill="#64748b">create</text>

  <!-- Flow: lazy CGImage -->
  <rect x="110" y="210" width="220" height="40" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="8"/>
  <text x="220" y="228" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">lazy CGImageRef</text>
  <text x="220" y="243" text-anchor="middle" font-size="10" fill="#dc2626">⚠ 隐式持有 source</text>

  <line x1="220" y1="250" x2="220" y2="270" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr-o)"/>
  <text x="280" y="265" font-size="10" font-weight="600" fill="#92400e">force decode</text>

  <!-- Flow: bitmap -->
  <rect x="110" y="275" width="220" height="40" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" rx="8"/>
  <text x="220" y="293" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">已展开的位图</text>
  <text x="220" y="308" text-anchor="middle" font-size="10" fill="#16a34a">✓ 与 source 脱钩</text>

  <line x1="220" y1="315" x2="220" y2="335" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- Flow: safe -->
  <rect x="110" y="340" width="220" height="34" fill="#f0fdf4" stroke="#16a34a" stroke-width="1" rx="8"/>
  <text x="220" y="362" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">可安全跨线程使用 ✓</text>

  <!-- Pros/Cons -->
  <line x1="50" y1="392" x2="390" y2="392" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="50" y="412" font-size="11" font-weight="600" fill="#16a34a">优点</text>
  <text x="50" y="430" font-size="11" fill="#475569">• 有效降低 crash 风险</text>
  <text x="50" y="448" font-size="11" fill="#475569">• 实现简单，快速止血</text>

  <text x="50" y="472" font-size="11" font-weight="600" fill="#dc2626">代价</text>
  <text x="50" y="490" font-size="11" fill="#475569">• CPU 消耗上升</text>
  <text x="50" y="508" font-size="11" fill="#475569">• 内存占用增加</text>

  <!-- ====== Right: Gen 2 ====== -->
  <rect x="450" y="60" width="380" height="460" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="10"/>
  <rect x="450" y="60" width="380" height="40" fill="#2563eb" rx="10"/>
  <rect x="450" y="85" width="380" height="15" fill="#2563eb"/>
  <text x="640" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">第二代：工程化落地</text>

  <text x="640" y="124" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">PR #3425 · SDWebImage 5.14.0</text>

  <!-- Branch -->
  <rect x="530" y="145" width="220" height="40" fill="#fff" stroke="#64748b" stroke-width="1.5" rx="8"/>
  <text x="640" y="170" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">图像类型分流</text>

  <!-- Split lines -->
  <line x1="640" y1="185" x2="560" y2="210" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-b)"/>
  <line x1="640" y1="185" x2="720" y2="210" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-b)"/>

  <!-- Static branch -->
  <rect x="470" y="215" width="150" height="55" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" rx="8"/>
  <text x="545" y="235" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">静态图</text>
  <text x="545" y="253" text-anchor="middle" font-size="10" fill="#16a34a">lazy decode ✓</text>
  <text x="545" y="265" text-anchor="middle" font-size="9" fill="#64748b">节省内存</text>

  <!-- Animated branch -->
  <rect x="665" y="215" width="150" height="55" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="8"/>
  <text x="740" y="235" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">动图</text>
  <text x="740" y="253" text-anchor="middle" font-size="10" fill="#dc2626">non-lazy decode</text>
  <text x="740" y="265" text-anchor="middle" font-size="9" fill="#64748b">优先稳定</text>

  <!-- Animated: two sub-strategies -->
  <line x1="740" y1="270" x2="740" y2="290" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="690" y1="290" x2="790" y2="290" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="690" y1="290" x2="690" y2="305" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-b)"/>
  <line x1="790" y1="290" x2="790" y2="305" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-b)"/>

  <!-- Force decode option -->
  <rect x="615" y="308" width="120" height="50" fill="#fffbeb" stroke="#f59e0b" stroke-width="1" rx="6"/>
  <text x="675" y="326" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">force decode</text>
  <text x="675" y="342" text-anchor="middle" font-size="9" fill="#92400e">展开位图</text>
  <text x="675" y="354" text-anchor="middle" font-size="9" fill="#64748b">性能换稳定</text>

  <!-- SDCGImageCreateCopy option -->
  <rect x="745" y="308" width="80" height="50" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="6"/>
  <text x="785" y="326" text-anchor="middle" font-size="9" font-weight="600" fill="#1e40af">SDCGImage</text>
  <text x="785" y="340" text-anchor="middle" font-size="9" font-weight="600" fill="#1e40af">CreateCopy</text>
  <text x="785" y="354" text-anchor="middle" font-size="9" fill="#64748b">剥离耦合</text>

  <!-- Divider -->
  <line x1="470" y1="375" x2="810" y2="375" stroke="#2563eb" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Key insight -->
  <rect x="470" y="385" width="340" height="70" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
  <text x="640" y="406" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">核心价值</text>
  <text x="640" y="424" text-anchor="middle" font-size="11" fill="#1e40af">保留 lazy decode 收益</text>
  <text x="640" y="442" text-anchor="middle" font-size="11" fill="#1e40af">同时避免生命周期耦合的 crash 风险</text>

  <!-- Pros -->
  <text x="470" y="476" font-size="11" font-weight="600" fill="#16a34a">优点</text>
  <text x="470" y="494" font-size="11" fill="#475569">• 稳定性与性能兼顾</text>
  <text x="470" y="512" font-size="11" fill="#475569">• 可按场景配置，灵活度高</text>
</svg>