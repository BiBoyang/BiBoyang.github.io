<text x="40" y="592" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">交错排布让同一阵漂移同时打湿 A 和 B；顺序排布则把漂移全部记进其中一臂。</text>
