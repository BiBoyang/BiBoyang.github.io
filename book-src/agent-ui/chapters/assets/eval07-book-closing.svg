<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500"><defs><marker id="mk-3fb950" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#3fb950"/></marker><marker id="mk-8b949e" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#8b949e"/></marker></defs><rect x="0" y="0" width="960" height="500" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="28" y="38" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">全书收口：把裁判也变成可断言的</text><line x1="28" y1="52" x2="932" y2="52" stroke="#30363d" stroke-width="1"/><rect x="30" y="64" width="300" height="42" rx="21" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="6 5"/><text x="180" y="90" font-size="11.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">「没报错，就代表输出没问题吗？」</text><line x1="176" y1="106" x2="154" y2="186" stroke="#8b949e" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#mk-8b949e)"/><circle cx="150" cy="264" r="72" fill="#58a6ff" fill-opacity="0.08" stroke="#58a6ff" stroke-width="1.6"/><text x="150" y="258" font-size="16" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">界面</text><text x="150" y="282" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">把渲染变成</text><text x="150" y="299" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">可断言的</text><circle cx="360" cy="264" r="72" fill="#d29922" fill-opacity="0.08" stroke="#d29922" stroke-width="1.6"/><text x="360" y="258" font-size="16" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">胶水层</text><text x="360" y="282" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">把协议变成</text><text x="360" y="299" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">可断言的</text><circle cx="570" cy="264" r="72" fill="#bc8cff" fill-opacity="0.08" stroke="#bc8cff" stroke-width="1.6"/><text x="570" y="258" font-size="16" fill="#bc8cff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">基建</text><text x="570" y="282" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">让承诺可信</text><circle cx="780" cy="264" r="72" fill="#3fb950" fill-opacity="0.08" stroke="#3fb950" stroke-width="1.6"/><text x="780" y="258" font-size="16" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">评测</text><text x="780" y="282" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">把裁判也变成</text><text x="780" y="299" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">可断言的</text><line x1="226" y1="264" x2="282" y2="264" stroke="#8b949e" stroke-width="1.6" marker-end="url(#mk-8b949e)"/><line x1="436" y1="264" x2="492" y2="264" stroke="#8b949e" stroke-width="1.6" marker-end="url(#mk-8b949e)"/><line x1="646" y1="264" x2="702" y2="264" stroke="#8b949e" stroke-width="1.6" marker-end="url(#mk-8b949e)"/><text x="255" y="250" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">进而</text><text x="465" y="250" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">进而</text><text x="675" y="250" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">收口</text><line x1="780" y1="338" x2="780" y2="398" stroke="#3fb950" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#mk-3fb950)"/><rect x="626" y="402" width="308" height="44" rx="22" fill="#3fb950" fill-opacity="0.08" stroke="#3fb950" stroke-width="1.4"/><text x="780" y="429" font-size="12" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">检查也会说谎，所以裁判也要被校准</text><text x="480" y="478" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">四环递进：界面 → 胶水层 → 基建 → 评测；开篇之问在最后一环得到回答。</text></svg>
