<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470"><defs></defs><rect x="0.0" y="0.0" width="900.0" height="470.0" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="28.0" y="38.0" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">截断不可见：断掉的流，完美的渲染</text><line x1="28" y1="52" x2="872" y2="52" stroke="#30363d" stroke-width="1"/><rect x="28.0" y="92.0" width="420.0" height="322.0" rx="10" fill="none" stroke="#f85149" stroke-width="1.2" stroke-dasharray="6 5"/><text x="46.0" y="120.0" font-size="12" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">SSE chunk 流（传输层事实）</text><text x="46.0" y="150.0" font-size="11" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">data: {&quot;choices&quot;:[{&quot;delta&quot;:</text><text x="46.0" y="172.0" font-size="11" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">  {&quot;content&quot;:&quot;## 结&quot;}}]}</text><text x="46.0" y="194.0" font-size="11" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">data: {&quot;choices&quot;:[{&quot;delta&quot;:</text><text x="46.0" y="216.0" font-size="11" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">  {&quot;content&quot;:&quot;论\n\n好的&quot;}}]}</text><path d="M46,252 l14,-14 l12,20 l14,-16 l12,18" fill="none" stroke="#f85149" stroke-width="2.2"/><line x1="119.0" y1="241.0" x2="137.0" y2="259.0" stroke="#f85149" stroke-width="2.6"/><line x1="119.0" y1="259.0" x2="137.0" y2="241.0" stroke="#f85149" stroke-width="2.6"/><text x="146.0" y="255.0" font-size="12.5" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">连接中断</text><text x="46.0" y="300.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">token 流停在半句——</text><text x="46.0" y="320.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">没有 end marker，没有 finish_reason</text><text x="46.0" y="340.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">但传输层的事实，不进入渲染后的视野</text><rect x="476.0" y="92.0" width="396.0" height="150.0" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.4"/><rect x="492.0" y="103.0" width="134.4" height="20.0" rx="10" fill="#3fb950" opacity="0.14"/><rect x="492.0" y="103.0" width="134.4" height="20.0" rx="10" fill="none" stroke="#3fb950" stroke-width="1"/><text x="500.0" y="114.0" font-size="10.5" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">Markdown 渲染（表象）</text><path d="M828.0,130.0 L837.0,139.0 L852.0,121.6" fill="none" stroke="#3fb950" stroke-width="3"/><text x="492.0" y="168.0" font-size="19" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">## 结论</text><line x1="492.0" y1="180.0" x2="580.0" y2="180.0" stroke="#30363d" stroke-width="1"/><text x="492.0" y="214.0" font-size="13" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">好的</text><rect x="476.0" y="264.0" width="396.0" height="150.0" rx="10" fill="#161b22" stroke="#8b949e" stroke-width="1.2" stroke-dasharray="6 5"/><text x="494.0" y="296.0" font-size="14" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">缺失的后半篇</text><text x="494.0" y="318.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">（该有的一半内容）</text><line x1="786.0" y1="310.0" x2="838.0" y2="362.0" stroke="#f85149" stroke-width="4"/><line x1="786.0" y1="362.0" x2="838.0" y2="310.0" stroke="#f85149" stroke-width="4"/><text x="450.0" y="454.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">Markdown 格式后置——截断的回答渲染出来毫无破绽，「看起来完整」不能作为判据。</text></svg>