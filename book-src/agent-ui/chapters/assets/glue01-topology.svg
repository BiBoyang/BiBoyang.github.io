<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560">
  <defs>
    <marker id="mk-green" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#3fb950"/></marker>
    <marker id="mk-purple" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#bc8cff"/></marker>
    <marker id="mk-blue" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#58a6ff"/></marker>
    <marker id="mk-amber" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#d29922"/></marker>
  </defs>
  <rect x="0" y="0" width="940" height="560" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="28" y="38" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">一个引擎，三种到达方式——和一处静默的降级</text>
  <line x1="28" y1="52" x2="912" y2="52" stroke="#30363d" stroke-width="1"/>

  <rect x="28" y="100" width="210" height="320" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.6"/>
  <text x="133" y="126" font-size="12.5" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">客户端（全是 client）</text>
  <text x="133" y="154" font-size="10" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle">TUI</text>
  <text x="133" y="176" font-size="10" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle">桌面端</text>
  <text x="133" y="198" font-size="10" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle">IDE</text>
  <text x="133" y="220" font-size="10" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">codex exec（无 UI）</text>
  <text x="133" y="242" font-size="10" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle">手机（remote_control）</text>
  <text x="133" y="272" font-size="8.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle">五种形态，同一套协议</text>

  <rect x="702" y="100" width="210" height="320" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.6"/>
  <text x="807" y="126" font-size="12.5" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">引擎（server）</text>
  <text x="807" y="154" font-size="10" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">app-server</text>
  <text x="807" y="176" font-size="10" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">core</text>
  <text x="807" y="198" font-size="10" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">rollout（事实源）</text>
  <text x="807" y="220" font-size="10" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">state_db（线程索引）</text>
  <text x="807" y="250" font-size="8.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle">历史归引擎持久</text>

  <text x="467" y="148" font-size="9.5" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle">① 嵌入式：同进程拉起，仍走 JSON-RPC envelope</text>
  <line x1="238" y1="160" x2="694" y2="160" stroke="#3fb950" stroke-width="1.8" marker-end="url(#mk-green)"/>

  <text x="467" y="248" font-size="9.5" fill="#bc8cff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle">② 本地 daemon：Unix socket，常驻实例，多 client 共享</text>
  <line x1="238" y1="260" x2="694" y2="260" stroke="#bc8cff" stroke-width="1.8" marker-end="url(#mk-purple)"/>

  <text x="467" y="348" font-size="9.5" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle">③ 远端：WebSocket / relay（remote_control）</text>
  <line x1="238" y1="360" x2="694" y2="360" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#mk-blue)"/>

  <path d="M640,256 C672,232 672,196 640,168" fill="none" stroke="#d29922" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#mk-amber)"/>
  <text x="640" y="290" font-size="9.5" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle">daemon 连不上</text>
  <text x="640" y="304" font-size="9.5" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle">→ 静默退回嵌入式</text>

  <rect x="238" y="436" width="464" height="66" rx="8" fill="#d29922" opacity="0.10"/>
  <rect x="238" y="436" width="464" height="66" rx="8" fill="none" stroke="#d29922" stroke-width="1.4"/>
  <text x="254" y="458" font-size="9.5" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">静默点（tui/src/lib.rs:518-521）：仅一行 debug 日志 + state_db 重初始化</text>
  <text x="254" y="476" font-size="9" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">拓扑已换、存储已换，界面一切正常——“线程列表完整”的承诺在此被撕毁</text>
  <text x="254" y="493" font-size="8.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">对照：远端连接失败直接报错上抛，只有本地 daemon 这一档降级</text>

  <rect x="28" y="514" width="884" height="34" rx="8" fill="#d29922" opacity="0.12"/>
  <rect x="28" y="514" width="884" height="34" rx="8" fill="none" stroke="#d29922" stroke-width="1.4"/>
  <text x="470" y="536" font-size="12" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">降级的代价不在降级本身，在降级是静默的。</text>
</svg>
