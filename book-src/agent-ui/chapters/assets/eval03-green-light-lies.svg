<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560"><defs><marker id="mk-f85149" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#f85149"/></marker></defs><rect x="0" y="0" width="940" height="560" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="28" y="38" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">两种谎言，踩进同一个危险格子</text><line x1="28" y1="52" x2="912" y2="52" stroke="#30363d" stroke-width="1"/><rect x="40" y="110" width="300" height="104" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><rect x="56" y="124" width="26" height="20" rx="10.0" fill="#161b22" stroke="#f85149" stroke-width="1.2"/><text x="69.0" y="137.6" font-size="10" fill="#f85149" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="700">A</text><text x="94" y="140" font-size="12.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">检查问错了问题</text><text x="56" y="168" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">问「文件在不在」，不问「目录能不能信」</text><text x="56" y="188" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">——平时全对，只在分叉日暴露</text><rect x="40" y="260" width="300" height="104" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><rect x="56" y="274" width="26" height="20" rx="10.0" fill="#161b22" stroke="#f85149" stroke-width="1.2"/><text x="69.0" y="287.6" font-size="10" fill="#f85149" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="700">B</text><text x="94" y="290" font-size="12.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">被测的事根本没发生</text><text x="56" y="318" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">绕行、静默降级</text><text x="56" y="338" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">——检查全对，但世界是坏的</text><text x="590" y="106" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">真实状态 →</text><text x="342" y="108" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">检查结果 ↓</text><text x="510.0" y="124" font-size="12" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">好</text><text x="670.0" y="124" font-size="12" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">坏</text><text x="416" y="184.0" font-size="12" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="700">绿</text><text x="416" y="284.0" font-size="12" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="700">红</text><rect x="430" y="130" width="160" height="100" rx="6" fill="#3fb950" fill-opacity="0.08" stroke="#30363d" stroke-width="1"/><text x="510.0" y="176" font-size="11.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">正常放行</text><text x="510.0" y="196" font-size="9.5" fill="#6e7681" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">世界好 · 灯绿</text><rect x="590" y="130" width="160" height="100" rx="6" fill="#f85149" fill-opacity="0.12" stroke="#f85149" stroke-width="2"/><text x="670.0" y="172" font-size="12.5" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">危险格：盲区</text><text x="670.0" y="194" font-size="10" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">状态坏 × 检查绿</text><rect x="430" y="230" width="160" height="100" rx="6" fill="#d29922" fill-opacity="0.08" stroke="#30363d" stroke-width="1"/><text x="510.0" y="276" font-size="11.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">误报</text><text x="510.0" y="296" font-size="9.5" fill="#6e7681" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">世界好 · 灯红</text><rect x="590" y="230" width="160" height="100" rx="6" fill="#58a6ff" fill-opacity="0.08" stroke="#30363d" stroke-width="1"/><text x="670.0" y="276" font-size="11.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">正常告警</text><text x="670.0" y="296" font-size="9.5" fill="#6e7681" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">世界坏 · 灯红</text><path d="M 342,162 C 400,150 420,160 584,168" fill="none" stroke="#f85149" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#mk-f85149)"/><path d="M 342,312 C 420,300 430,240 584,196" fill="none" stroke="#f85149" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#mk-f85149)"/><text x="470" y="430" font-size="13.5" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">当两个不同的世界产出同一个绿灯，你的观测对它们的差异就是盲的。</text><text x="470" y="462" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">谎言 A 与谎言 B 互不相似，却共享同一格。</text></svg>