/><text x="481.0" y="152.0" font-size="13" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">完整聊天 UI</text><text x="481.0" y="174.0" font-size="10.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">消息列表、流式动画、</text><text x="481.0" y="190.0" font-size="10.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">工具调用展示</text><line x1="481.0" y1="232.0" x2="657.0" y2="232.0" stroke="#30363d" stroke-width="1"/><text x="481.0" y="248.0" font-size="9.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">TUI：RenderLoop +</text><text x="481.0" y="261.0" font-size="9.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">commit/live 分区</text><rect x="680.0" y="128.0" width="200.0" height="144.0" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1"/><text x="692.0" y="152.0" font-size="13" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="700">ListViewKit</text><text x="692.0" y="174.0" font-size="10.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">diffable data source、</text><text x="692.0" y="190.0" font-size="10.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">cell 复用、</text><text x="692.0" y="206.0" font-size="10.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">动态高度缓存</text