<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620">
<defs>
<marker id="mk-58a6ff" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#58a6ff"/></marker>
<marker id="mk-f85149" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#f85149"/></marker>
</defs>
<rect x="0" y="0" width="960" height="620" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<text x="28" y="38" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">代理链断在哪一环，离线奖牌就贬值到哪一环</text>
<line x1="28" y1="52" x2="932" y2="52" stroke="#30363d" stroke-width="1"/>

<!-- 离线奖牌（挂在断裂上方，打问号） -->
<line x1="480" y1="160" x2="480" y2="232" stroke="#d29922" stroke-width="1.2" stroke-dasharray="4 4"/>
<circle cx="480" cy="128" r="30" fill="#d29922" fill-opacity="0.14" stroke="#d29922" stroke-width="1.6"/>
<path d="M468,104 l-8,-14 h9 l6,10 z" fill="#d29922" fill-opacity="0.5"/>
<path d="M492,104 l8,-14 h-9 l-6,10 z" fill="#d29922" fill-opacity="0.5"/>
<text x="480" y="126" font-size="11" fill="#d29922" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="700">15:1</text>
<text x="480" y="141" font-size="9" fill="#d29922" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="400">p=0.0005</text>
<text x="524" y="120" font-size="20" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">？</text>
<text x="400" y="80" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">离线指标大胜，但只在代理链成立时作数</text>

<!-- 五环代理链 -->
<rect x="40" y="290" width="150" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="115" y="328" font-size="12" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">金标排第一</text>
<rect x="220" y="290" width="150" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="295" y="328" font-size="12" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">结果被注入</text>
<rect x="400" y="290" width="150" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="475" y="328" font-size="12" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">模型打开第一条</text>
<rect x="580" y="290" width="150" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="655" y="328" font-size="12" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">核实到金标</text>
<rect x="760" y="290" width="150" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="835" y="328" font-size="12" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">最终答对</text>

<!-- 箭头与消费假设 -->
<line x1="192" y1="325" x2="216" y2="325" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#mk-58a6ff)"/>
<text x="205" y="312" font-size="9" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">排第一</text>
<text x="205" y="352" font-size="9" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">就会被注入</text>

<!-- 断裂的一环 -->
<line x1="372" y1="318" x2="384" y2="330" stroke="#f85149" stroke-width="1.4" stroke-dasharray="4 3"/>
<line x1="396" y1="330" x2="384" y2="342" stroke="#f85149" stroke-width="1.4" stroke-dasharray="4 3"/>
<path d="M372,330 q10,26 12,44" fill="none" stroke="#f85149" stroke-width="1.4" stroke-dasharray="4 3"/>
<path d="M396,330 q-10,26 -12,44" fill="none" stroke="#f85149" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#mk-f85149)"/>
<text x="385" y="312" font-size="9" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">排第一 ≠ 被打开</text>
<rect x="296" y="382" width="180" height="30" rx="15" fill="#f85149" fill-opacity="0.12" stroke="#f85149" stroke-width="1.2"/>
<text x="386" y="402" font-size="10.5" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">断点：模型不按顺序读</text>

<line x1="552" y1="325" x2="576" y2="325" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#mk-58a6ff)"/>
<text x="565" y="312" font-size="9" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">打开</text>
<text x="565" y="352" font-size="9" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">就会核实</text>
<line x1="732" y1="325" x2="756" y2="325" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#mk-58a6ff)"/>
<text x="745" y="312" font-size="9" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">核实</text>
<text x="745" y="352" font-size="9" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">就会答对</text>

<!-- 端到端结果标签 -->
<line x1="835" y1="360" x2="835" y2="392" stroke="#f85149" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="740" y="392" width="190" height="52" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.2"/>
<text x="835" y="413" font-size="10.5" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="400">端到端 53→56，p=0.72</text>
<text x="835" y="432" font-size="10.5" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">→ 决策面退役</text>

<text x="40" y="592" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">离线指标只是代理：链条每一环都藏一个消费假设，任何一环断裂，奖牌就只剩纪念意义。</text>
</svg>
