<svg xmlns="http://www.w3.org/2000/svg" width="900" height="424" viewBox="0 0 900 424"><defs></defs><rect x="0.0" y="0.0" width="900.0" height="424.0" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="28.0" y="38.0" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">一个贯穿六站的不对称</text><line x1="28" y1="52" x2="872" y2="52" stroke="#30363d" stroke-width="1"/><text x="40.0" y="136.0" font-size="15" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">毫秒级</text><rect x="190.0" y="108.0" width="132.0" height="46.0" rx="8" fill="#3fb950" opacity="0.85"/><text x="204.0" y="137.0" font-size="11.5" fill="#0d1117" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="700">10⁰–10² ms</text><text x="190.0" y="172.0" font-size="9.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">用户的输入（打 200 字、点发送）</text><text x="40.0" y="242.0" font-size="15" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">秒级</text><rect x="190.0" y="214.0" width="346.0" height="46.0" rx="8" fill="#d29922" opacity="0.85"/><text x="204.0" y="243.0" font-size="11.5" fill="#0d1117" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="700">10¹–10² s</text><text x="190.0" y="278.0" font-size="9.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">iOS 退后台宽限（几十秒后进程挂起；挂起和杀死都可能不给回调）</text><text x="40.0" y="348.0" font-size="15" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">分钟级</text><rect x="190.0" y="320.0" width="560.0" height="46.0" rx="8" fill="#f85149" opacity="0.85"/><text x="204.0" y="349.0" font-size="11.5" fill="#0d1117" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="700">10⁰–10² min</text><text x="190.0" y="384.0" font-size="9.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">一场 agent 回复（一个任务可能跑 20 分钟）</text><text x="95.0" y="181.0" font-size="9" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">↕ 差两个数量级</text><text x="95.0" y="287.0" font-size="9" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">↕ 差两个数量级</text><text x="450.0" y="408.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">「会话不断」永远不能靠「连接不断」兑现，只能靠「断了能接」兑现。</text></svg>