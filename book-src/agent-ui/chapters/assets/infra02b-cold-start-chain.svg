<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500"><defs><marker id="mk1" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#8b949e"/></marker></defs><rect x="0.0" y="0.0" width="940.0" height="500.0" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="28.0" y="38.0" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">这四秒用户在替谁等待？</text><line x1="28" y1="52" x2="912" y2="52" stroke="#30363d" stroke-width="1"/><rect x="380.0" y="92.0" width="180.0" height="40.0" rx="20" fill="#d29922" opacity="0.15"/><circle cx="414.0" cy="112.0" r="10.0" fill="none" stroke="#d29922" stroke-width="1.8"/><line x1="414.0" y1="112.0" x2="414.0" y2="105.0" stroke="#d29922" stroke-width="1.6"/><line x1="414.0" y1="112.0" x2="419.0" y2="114.0" stroke="#d29922" stroke-width="1.6"/><text x="470.0" y="118.0" font-size="15" fill="#d29922" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="700">4 秒</text><rect x="30.0" y="168.0" width="116.0" height="64.0" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.2"/><text x="88.0" y="194.0" font-size="11" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">点推送</text><text x="88.0" y="212.0" font-size="8" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">Agent 请求批</text><text x="88.0" y="224.0" font-size="8" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">准安装依赖</text><line x1="147.0" y1="200.0" x2="159.0" y2="200.0" stroke="#8b949e" stroke-width="1.6" marker-end="url(#mk1)"/><rect x="160.0" y="168.0" width="116.0" height="64.0" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.2"/><text x="218.0" y="194.0" font-size="11" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">进程冷启动</text><line x1="277.0" y1="200.0" x2="289.0" y2="200.0" stroke="#8b949e" stroke-width="1.6" marker-end="url(#mk1)"/><rect x="290.0" y="168.0" width="116.0" height="64.0" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.2"/><text x="348.0" y="194.0" font-size="11" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">认证</text><text x="348.0" y="212.0" font-size="8" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">token 过期就</text><text x="348.0" y="224.0" font-size="8" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">再等等</text><line x1="407.0" y1="200.0" x2="419.0" y2="200.0" stroke="#8b949e" stroke-width="1.6" marker-end="url(#mk1)"/><rect x="420.0" y="168.0" width="116.0" height="64.0" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.2"/><text x="478.0" y="194.0" font-size="11" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">建连</text><line x1="537.0" y1="200.0" x2="549.0" y2="200.0" stroke="#8b949e" stroke-width="1.6" marker-end="url(#mk1)"/><rect x="550.0" y="168.0" width="116.0" height="64.0" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.2"/><text x="608.0" y="194.0" font-size="11" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">追平事件</text><line x1="667.0" y1="200.0" x2="679.0" y2="200.0" stroke="#8b949e" stroke-width="1.6" marker-end="url(#mk1)"/><rect x="680.0" y="168.0" width="116.0" height="64.0" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.2"/><text x="738.0" y="194.0" font-size="11" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">渲染会话</text><line x1="797.0" y1="200.0" x2="809.0" y2="200.0" stroke="#8b949e" stroke-width="1.6" marker-end="url(#mk1)"/><rect x="810.0" y="168.0" width="116.0" height="64.0" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/><text x="868.0" y="194.0" font-size="11" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">审批卡片</text><text x="868.0" y="212.0" font-size="8" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">终于有上下文可挂</text><rect x="30.0" y="256.0" width="880.0" height="64.0" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.3"/><text x="50.0" y="282.0" font-size="10" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">审批是硬实时交互流——agent 停在那里等，token 在烧。</text><text x="50.0" y="302.0" font-size="10" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">白屏 + logo + 转圈的四秒不是性能问题，是架构问题。</text><rect x="30.0" y="336.0" width="282.0" height="92.0" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.4"/><text x="46.0" y="364.0" font-size="11" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">专项工程 · 深链直达会话</text><text x="46.0" y="390.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">推送携带会话游标，</text><text x="46.0" y="408.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">跳过首页与中间跳转</text><rect x="328.0" y="336.0" width="282.0" height="92.0" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.4"/><text x="344.0" y="364.0" font-size="11" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">专项工程 · token 预刷新</text><text x="344.0" y="390.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">推送到达时服务端顺带</text><text x="344.0" y="408.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">检查并预刷新过期 token</text><rect x="626.0" y="336.0" width="282.0" height="92.0" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.4"/><text x="642.0" y="364.0" font-size="11" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">专项工程 · 追平时优先渲染审批事件</text><text x="642.0" y="390.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">先画审批卡片后补历史，</text><text x="642.0" y="408.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">交互先于完整重建</text><text x="470.0" y="484.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">推送承诺了一个交互，而兑现它要穿过整条冷启动链。</text></svg>