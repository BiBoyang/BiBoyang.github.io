<text x="395" y="158" font-size="9.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">判官照咨询</text>
<line x1="490" y1="144" x2="560" y2="144" stroke="#58a6ff" stroke-width="1.6"/>
<rect x="560" y="120" width="110" height="48" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="615" y="141" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">判断只记账</text>
<text x="615" y="157" font-size="9" fill="#6e7681" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">不进输出</text>

