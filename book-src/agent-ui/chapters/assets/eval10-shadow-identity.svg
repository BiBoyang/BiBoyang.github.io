<text x="824" y="332" font-size="14" fill="#3fb950" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="700">diff = ∅</text>
<text x="824" y="212" font-size="10" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">通过才允许进入 advisory 轨</text>
<line x1="924" y1="286" x2="944" y2="286" stroke="#3fb950" stroke-width="1.6" stroke-dasharray="4 3"/>

<!-- 故障旁路 -->
<path d="M395,168 L395,200 C395,470 560,470 740,470 L740,360" fill="none" stroke="#f85149" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#mk-f85149)"/>
<rect x="430" y="492" width="380" height="44" rx="8" fill="#f85149" fill-opacity="0.08" stroke="#f85149" stroke-width="1" stroke-opacity="0.6"/>
<text x="620" y="510" font-size="10.5" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">判官超时 / 故障 / 返回「都行」→ 走旁路</text>
<text x="620" y="528" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">输出保持原始顺序，不许半生效</text>

<text x="40" y="592" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">判官接入地址默认导出为关闭态，需要的臂再显式换回。</text>
</svg>
