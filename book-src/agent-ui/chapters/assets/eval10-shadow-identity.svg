<text x="395" y="422" font-size="9.5" fill="#6e7681" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">什么都不做</text>

<!-- 汇入闸门 -->
<path d="M670,144 C720,144 700,220 730,238" fill="none" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#mk-58a6ff)"/>
