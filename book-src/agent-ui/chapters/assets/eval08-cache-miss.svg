<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620">
<defs>
<marker id="mk-f85149" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#f85149"/></marker>
</defs>
<rect x="0" y="0" width="960" height="620" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<text x="28" y="38" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">一次 tool_choice 改动，打穿全场最贵的缓存</text>
<line x1="28" y1="52" x2="932" y2="52" stroke="#30363d" stroke-width="1"/>

<!-- 刻度尺 -->
<line x1="100" y1="112" x2="860" y2="112" stroke="#30363d" stroke-width="1"/>
<line x1="100" y1="106" x2="100" y2="118" stroke="#30363d" stroke-width="1"/>
<line x1="480" y1="106" x2="480" y2="118" stroke="#30363d" stroke-width="1"/>
<line x1="860" y1="106" x2="860" y2="118" stroke="#30363d" stroke-width="1"/>
<text x="100" y="100" font-size="10" fill="#6e7681" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="400">400K</text>
<text x="480" y="100" font-size="10" fill="#6e7681" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="400">~600K</text>
<text x="860" y="100" font-size="10" fill="#6e7681" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="400">850K token</text>

<!-- 改动前：缓存命中 -->
<text x="100" y="148" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">改动前：前缀不变</text>
<rect x="100" y="158" width="600" height="52" rx="6" fill="#3fb950" fill-opacity="0.16" stroke="#3fb950" stroke-width="1.2"/>
<text x="400" y="188" font-size="12" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">缓存命中（折扣价）</text>
<rect x="700" y="158" width="160" height="52" rx="6" fill="#58a6ff" fill-opacity="0.14" stroke="#58a6ff" stroke-width="1.2"/>
<text x="780" y="182" font-size="11" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">新输出</text>
<text x="780" y="198" font-size="9.5" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">仅此段全价</text>

<!-- 剪刀与动作 -->
<circle cx="540" cy="258" r="5" fill="none" stroke="#d29922" stroke-width="1.8"/>
<circle cx="556" cy="258" r="5" fill="none" stroke="#d29922" stroke-width="1.8"/>
<line x1="543" y1="254" x2="566" y2="234" stroke="#d29922" stroke-width="1.8"/>
<line x1="553" y1="254" x2="530" y2="234" stroke="#d29922" stroke-width="1.8"/>
<text x="580" y="252" font-size="11" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">剪断动作：改 tool_choice</text>
<line x1="548" y1="264" x2="548" y2="330" stroke="#f85149" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#mk-f85149)"/>

<!-- 改动后：全段重算 -->
<text x="100" y="332" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">改动后：前缀哈希变了</text>
<rect x="100" y="342" width="600" height="52" rx="6" fill="#f85149" fill-opacity="0.14" stroke="#f85149" stroke-width="1.2"/>
<text x="400" y="372" font-size="12" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">cache creation：剪断点之后整条全价重算</text>
<rect x="700" y="342" width="160" height="52" rx="6" fill="#58a6ff" fill-opacity="0.14" stroke="#58a6ff" stroke-width="1.2"/>
<text x="780" y="372" font-size="11" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">新输出</text>

<!-- 否决结论 -->
<rect x="100" y="448" width="760" height="58" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.2"/>
<text x="480" y="473" font-size="12" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">为发一个 76% 概率被无视的信号，打穿全场最贵的缓存</text>
<text x="480" y="494" font-size="12" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">→ 否决</text>

<text x="40" y="592" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">KV 缓存按前缀计费：前缀任何一处改动，其后整段都要按 cache creation 全价重写。</text>
</svg>
