<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520">
<defs>
<marker id="mk-6e7681" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#6e7681"/></marker><marker id="mk-8b949e" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#8b949e"/></marker>
</defs>
<rect x="0" y="0" width="960" height="520" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<text x="28" y="38" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">结构隔离：被测物够不着评分资产</text>
<line x1="28" y1="52" x2="932" y2="52" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="80" width="250" height="190" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1"/>
<text x="46" y="106" font-size="13.5" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">agent 容器</text>
<text x="46" y="136" font-size="11.5" fill="#c9d1d9" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 工作区、agent 日志</text>
<text x="46" y="158" font-size="11.5" fill="#c9d1d9" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 对文件系统的改动不继承</text>
<text x="46" y="180" font-size="11.5" fill="#c9d1d9" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 看不到测试与真值</text>
<text x="46" y="250" font-size="11" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">只交出声明为产物的路径</text>
<line x1="278" y1="175" x2="344" y2="175" stroke="#8b949e" stroke-width="1.6" marker-end="url(#mk-8b949e)"/>
<rect x="348" y="80" width="270" height="190" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
<text x="366" y="106" font-size="13.5" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">产物净化</text>
<text x="366" y="136" font-size="11.5" fill="#c9d1d9" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 清掉 setuid / setgid 位</text>
<text x="366" y="158" font-size="11.5" fill="#c9d1d9" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 跳过指向外部的符号链接</text>
<text x="366" y="180" font-size="11.5" fill="#c9d1d9" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 跳过 FIFO 与设备文件</text>
<text x="366" y="202" font-size="11.5" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 净化之后仍是不可信输入</text>
<line x1="618" y1="175" x2="684" y2="175" stroke="#8b949e" stroke-width="1.6" marker-end="url(#mk-8b949e)"/>
<rect x="688" y="80" width="244" height="190" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
<text x="706" y="106" font-size="13.5" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">评分容器（全新）</text>
<text x="706" y="136" font-size="11.5" fill="#c9d1d9" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 测试与真值烘进镜像</text>
<text x="706" y="158" font-size="11.5" fill="#c9d1d9" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 从不进入 agent 容器</text>
<text x="706" y="180" font-size="11.5" fill="#c9d1d9" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 只读到净化后的产物</text>
<line x1="60" y1="322" x2="900" y2="322" stroke="#6e7681" stroke-width="1.4" marker-end="url(#mk-6e7681)"/>
<circle cx="160" cy="322" r="6" fill="#d29922" fill-opacity="0.5" stroke="#d29922" stroke-width="1.6"/>
<text x="160" y="346" font-size="11" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">agent 运行</text>
<circle cx="480" cy="322" r="6" fill="#f85149" fill-opacity="0.5" stroke="#f85149" stroke-width="1.6"/>
<text x="480" y="346" font-size="11" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">agent 容器销毁</text>
<circle cx="800" cy="322" r="6" fill="#3fb950" fill-opacity="0.5" stroke="#3fb950" stroke-width="1.6"/>
<text x="800" y="346" font-size="11" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">评分容器才启动</text>
<text x="905" y="312" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="400">时间</text>
<rect x="28" y="378" width="904" height="104" rx="6" fill="#bc8cff" fill-opacity="0.06" stroke="#bc8cff" stroke-width="1" stroke-dasharray="5 4"/>
<text x="46" y="404" font-size="13" fill="#bc8cff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">评分时必须执行 agent 写的代码：当成不可信的用户</text>
<text x="46" y="432" font-size="11.5" fill="#c9d1d9" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 每次换全新、无账户的 UID</text>
<text x="342" y="432" font-size="11.5" fill="#c9d1d9" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 读不到测试目录，写不了评分日志</text>
<text x="638" y="432" font-size="11.5" fill="#c9d1d9" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 返回前杀掉它启动的所有进程</text>
<text x="46" y="458" font-size="11.5" fill="#c9d1d9" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 超时按失败计</text>
<text x="342" y="458" font-size="11.5" fill="#c9d1d9" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 隔离搭不起来：直接抛异常，一个分数都不写</text>
<text x="28" y="506" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">据 Harbor 文档 /tasks/separate-verifier、/rewardkit/quick-start（2026-10-31 读取）</text>
</svg>
