<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430"><defs></defs><rect x="0.0" y="0.0" width="900.0" height="430.0" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="28.0" y="38.0" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">显示 3%，实际已压缩</text><line x1="28" y1="52" x2="872" y2="52" stroke="#30363d" stroke-width="1"/><rect x="40.0" y="100.0" width="360.0" height="210.0" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/><text x="220.0" y="130.0" font-size="13" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">上下文计量条</text><text x="220.0" y="150.0" font-size="9.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">仪表读数：估算口径的用量</text><rect x="70.0" y="176.0" width="300.0" height="34.0" rx="6" fill="#0d1117" stroke="#58a6ff" stroke-width="1"/><rect x="70.0" y="176.0" width="291.0" height="34.0" rx="6" fill="#58a6ff" opacity="0.75"/><line x1="70.0" y1="210.0" x2="70.0" y2="215.0" stroke="#8b949e" stroke-width="1"/><line x1="145.0" y1="210.0" x2="145.0" y2="215.0" stroke="#8b949e" stroke-width="1"/><line x1="220.0" y1="210.0" x2="220.0" y2="215.0" stroke="#8b949e" stroke-width="1"/><line x1="295.0" y1="210.0" x2="295.0" y2="215.0" stroke="#8b949e" stroke-width="1"/><line x1="370.0" y1="210.0" x2="370.0" y2="215.0" stroke="#8b949e" stroke-width="1"/><text x="357.0" y="229.0" font-size="10" fill="#58a6ff" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="end" font-weight="700">97%</text><text x="374.0" y="198.0" font-size="10" fill="#3fb950" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">3%</text><text x="70.0" y="262.0" font-size="9.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">用户在状态栏看到的数字</text><text x="70.0" y="278.0" font-size="9.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">按这个口径，窗口还很空</text><rect x="500.0" y="100.0" width="360.0" height="210.0" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/><text x="680.0" y="130.0" font-size="13" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">压缩触发器</text><text x="680.0" y="150.0" font-size="9.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">熔断器读数：窗口判定 − 33K 缓冲区</text><rect x="530.0" y="176.0" width="300.0" height="34.0" rx="6" fill="#0d1117" stroke="#f85149" stroke-width="1"/><rect x="530.0" y="176.0" width="210.0" height="34.0" rx="6" fill="#f85149" opacity="0.55"/><rect x="722.0" y="176.0" width="33.0" height="34.0" rx="3" fill="#f85149" opacity="0.9"/><line x1="530.0" y1="210.0" x2="530.0" y2="215.0" stroke="#8b949e" stroke-width="1"/><line x1="605.0" y1="210.0" x2="605.0" y2="215.0" stroke="#8b949e" stroke-width="1"/><line x1="680.0" y1="210.0" x2="680.0" y2="215.0" stroke="#8b949e" stroke-width="1"/><line x1="755.0" y1="210.0" x2="755.0" y2="215.0" stroke="#8b949e" stroke-width="1"/><line x1="830.0" y1="210.0" x2="830.0" y2="215.0" stroke="#8b949e" stroke-width="1"/><line x1="800.0" y1="171.0" x2="800.0" y2="215.0" stroke="#8b949e" stroke-width="1.2" stroke-dasharray="3 3"/><text x="738.5" y="168.0" font-size="9" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">触发点 64–75%</text><text x="800.0" y="229.0" font-size="8.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">历史以为 90%+</text><text x="530.0" y="262.0" font-size="9.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">另一个口径：窗口判定减去 33K 缓冲区</text><text x="530.0" y="278.0" font-size="9.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">触发点显著早于历史记录</text><path d="M448,176 L432,200 L452,200 L436,224 M448,228 L432,252 L452,252 L436,276" fill="none" stroke="#d29922" stroke-width="2.4"/><text x="450.0" y="296.0" font-size="10" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">两个口径</text><text x="450.0" y="312.0" font-size="10" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">从不承诺一致</text><rect x="40.0" y="336.0" width="820.0" height="52.0" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="220.0" y="358.0" font-size="9.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">状态栏闪过一行灰字</text><text x="220.0" y="376.0" font-size="9.5" fill="#8b949e" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="400">context low</text><text x="640.0" y="367.0" font-size="9.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">对话继续，一切如常——只是从某个时刻起，</text><text x="640.0" y="383.0" font-size="9.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">Agent 对三小时前那个关键约定的回答开始含糊。</text><text x="450.0" y="414.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">「显示 3% 实际已压缩」不是 UI bug，是两本账各记各的必然症状——投影完整性 ≠ 状态完整性。</text></svg>