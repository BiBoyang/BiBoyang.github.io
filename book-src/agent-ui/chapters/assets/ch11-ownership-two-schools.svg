<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470"><defs></defs><rect x="0.0" y="0.0" width="940.0" height="470.0" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="28.0" y="38.0" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">一个 block 完成之后，谁继续为它记账？</text><line x1="28" y1="52" x2="912" y2="52" stroke="#30363d" stroke-width="1"/><text x="470.0" y="82.0" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">两派的 live 区同构（增量 diff、双缓冲、erase-rewrite 大家都做）——分歧只有一句：block 完成后，谁继续为它记账？</text><rect x="40.0" y="100.0" width="420.0" height="300.0" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/><rect x="56.0" y="111.0" width="73.8" height="20.0" rx="10" fill="#3fb950" opacity="0.14"/><rect x="56.0" y="111.0" width="73.8" height="20.0" rx="10" fill="none" stroke="#3fb950" stroke-width="1"/><text x="64.0" y="122.0" font-size="11" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">全屏自管派</text><rect x="48.0" y="138.0" width="404.0" height="46.0" rx="5" fill="#8b949e" opacity="0.12"/><text x="60.0" y="158.0" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">scrollback 区（滚出屏幕才归终端）</text><rect x="48.0" y="188.0" width="404.0" height="204.0" rx="5" fill="#3fb950" opacity="0.1"/><rect x="60.0" y="204.0" width="320.0" height="6.0" rx="2" fill="#3fb950" opacity="0.35"/><rect x="60.0" y="223.0" width="340.0" height="6.0" rx="2" fill="#3fb950" opacity="0.35"/><rect x="60.0" y="242.0" width="360.0" height="6.0" rx="2" fill="#3fb950" opacity="0.35"/><rect x="60.0" y="261.0" width="320.0" height="6.0" rx="2" fill="#3fb950" opacity="0.35"/><rect x="60.0" y="280.0" width="340.0" height="6.0" rx="2" fill="#3fb950" opacity="0.35"/><rect x="60.0" y="299.0" width="360.0" height="6.0" rx="2" fill="#3fb950" opacity="0.35"/><rect x="60.0" y="318.0" width="320.0" height="6.0" rx="2" fill="#3fb950" opacity="0.35"/><rect x="60.0" y="337.0" width="340.0" height="6.0" rx="2" fill="#3fb950" opacity="0.35"/><rect x="60.0" y="356.0" width="360.0" height="6.0" rx="2" fill="#3fb950" opacity="0.35"/><text x="250.0" y="250.0" font-size="13" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">屏幕上每一行都归引擎管</text><text x="250.0" y="300.0" font-size="10.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">历史虽「只追加」，仍持续参与</text><text x="250.0" y="320.0" font-size="10.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">每帧 diff 与 resize 重算</text><rect x="480.0" y="100.0" width="420.0" height="300.0" rx="8" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/><rect x="496.0" y="111.0" width="111.1" height="20.0" rx="10" fill="#58a6ff" opacity="0.14"/><rect x="496.0" y="111.0" width="111.1" height="20.0" rx="10" fill="none" stroke="#58a6ff" stroke-width="1"/><text x="504.0" y="122.0" font-size="11" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">inline viewport 派</text><rect x="488.0" y="138.0" width="404.0" height="206.0" rx="5" fill="#58a6ff" opacity="0.1"/><rect x="500.0" y="154.0" width="330.0" height="6.0" rx="2" fill="#58a6ff" opacity="0.35"/><rect x="500.0" y="173.0" width="314.0" height="6.0" rx="2" fill="#58a6ff" opacity="0.35"/><rect x="500.0" y="192.0" width="298.0" height="6.0" rx="2" fill="#58a6ff" opacity="0.35"/><rect x="500.0" y="211.0" width="330.0" height="6.0" rx="2" fill="#58a6ff" opacity="0.35"/><rect x="500.0" y="230.0" width="314.0" height="6.0" rx="2" fill="#58a6ff" opacity="0.35"/><rect x="500.0" y="249.0" width="298.0" height="6.0" rx="2" fill="#58a6ff" opacity="0.35"/><rect x="500.0" y="268.0" width="330.0" height="6.0" rx="2" fill="#58a6ff" opacity="0.35"/><rect x="500.0" y="287.0" width="314.0" height="6.0" rx="2" fill="#58a6ff" opacity="0.35"/><text x="690.0" y="196.0" font-size="13" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">定型即归终端</text><text x="690.0" y="246.0" font-size="10.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">从此不可触碰——</text><text x="690.0" y="266.0" font-size="10.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">滚动 / 搜索 / 复制是终端的事</text><rect x="488.0" y="348.0" width="404.0" height="44.0" rx="5" fill="#3fb950" opacity="0.14"/><rect x="488.0" y="348.0" width="404.0" height="44.0" rx="5" fill="none" stroke="#3fb950" stroke-width="1.2"/><text x="690.0" y="376.0" font-size="11" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">引擎只管这里：双缓冲 diff 重绘</text><text x="470.0" y="454.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">全屏自管派为「可改写性」持续纳税；inline 派一次性买断「不可改写」。</text></svg>