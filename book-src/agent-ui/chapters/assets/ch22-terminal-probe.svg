<svg xmlns="http://www.w3.org/2000/svg" width="940" height="480" viewBox="0 0 940 480"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#8b949e"/></marker></defs><rect x="0" y="0" width="940" height="480" fill="#0d1117" rx="12" stroke="#30363d" stroke-width="1"/><text x="28" y="38" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="700">启动探测的四种姿态</text><line x1="28" y1="52" x2="912" y2="52" stroke="#30363d" stroke-width="1"/><rect x="40" y="84" width="860" height="76" fill="#161b22" rx="10" stroke="#58a6ff" stroke-width="1"/><text x="64" y="114" font-size="13" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">Codex</text><text x="290" y="114" font-size="12" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start">100ms 预算 + DA 哨兵提前判定</text><text x="290" y="138" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">DA 到了而键盘标志没到 → 立即判不支持；探测字节回放，不吞用户输入</text><rect x="40" y="176" width="860" height="76" fill="#161b22" rx="10" stroke="#d2a8ff" stroke-width="1"/><text x="64" y="206" font-size="13" fill="#d2a8ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">Claude Code</text><text x="290" y="206" font-size="12" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start">DA1 哨兵为唯一机制，无超时</text><text x="290" y="230" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">响应先于 DA1 到 = 支持；后到 = 不支持；顺序代替计时</text><rect x="40" y="268" width="860" height="76" fill="#161b22" rx="10" stroke="#ffa657" stroke-width="1"/><text x="64" y="298" font-size="13" fill="#ffa657" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">Kimi Code</text><text x="290" y="298" font-size="12" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start">协商序列 + 150ms 分片超时</text><text x="290" y="322" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">推 flags、查当前、问设备属性，一次发出</text><rect x="40" y="360" width="860" height="76" fill="#161b22" rx="10" stroke="#3fb950" stroke-width="1"/><text x="64" y="390" font-size="13" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">ForgeLoopTUI</text><text x="290" y="390" font-size="12" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start">不探测，乐观推送</text><text x="290" y="414" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">不支持的终端静默吸收未知序列（注释明写的赌注）</text><text x="470" y="462" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle">$TERM 会撒谎：查询走 pty 才穿透 SSH——能力只能实况探测，不能读环境</text></svg>