<svg xmlns="http://www.w3.org/2000/svg" width="900" height="468" viewBox="0 0 900 468"><defs><marker id="mk1" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#bc8cff"/></marker><marker id="mk2" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#3fb950"/></marker></defs><rect x="0.0" y="0.0" width="900.0" height="468.0" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="28.0" y="38.0" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">同一种东西，两条协议给出相反的归属</text><line x1="28" y1="52" x2="872" y2="52" stroke="#30363d" stroke-width="1"/><rect x="28.0" y="100.0" width="380.0" height="270.0" rx="10" fill="none" stroke="#bc8cff" stroke-width="1.2" stroke-dasharray="6 5"/><text x="40.0" y="120.0" font-size="12" fill="#bc8cff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">MCP（紫）</text><rect x="180.0" y="200.0" width="200.0" height="120.0" rx="8" fill="#0d1117" stroke="#bc8cff" stroke-width="1.6"/><text x="280.0" y="226.0" font-size="11.5" fill="#bc8cff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">服务端「工具库」</text><rect x="200.0" y="240.0" width="70.0" height="16.0" rx="4" fill="#bc8cff" opacity="0.18"/><rect x="200.0" y="240.0" width="70.0" height="16.0" rx="4" fill="none" stroke="#bc8cff" stroke-width="1"/><text x="235.0" y="252.0" font-size="8" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="400">tool_1</text><rect x="200.0" y="264.0" width="70.0" height="16.0" rx="4" fill="#bc8cff" opacity="0.18"/><rect x="200.0" y="264.0" width="70.0" height="16.0" rx="4" fill="none" stroke="#bc8cff" stroke-width="1"/><text x="235.0" y="276.0" font-size="8" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="400">tool_2</text><rect x="200.0" y="288.0" width="70.0" height="16.0" rx="4" fill="#bc8cff" opacity="0.18"/><rect x="200.0" y="288.0" width="70.0" height="16.0" rx="4" fill="none" stroke="#bc8cff" stroke-width="1"/><text x="235.0" y="300.0" font-size="8" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="400">tool_3</text><text x="290.0" y="252.0" font-size="9" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">等着被发现</text><text x="290.0" y="276.0" font-size="9" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">能力发现 +</text><text x="290.0" y="292.0" font-size="9" fill="#8b949e" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">结构化 IO</text><circle cx="100.0" cy="260.0" r="22.0" fill="#0d1117" stroke="#e6edf3" stroke-width="1.6"/><text x="100.0" y="265.0" font-size="9" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="700">agent</text><line x1="126.0" y1="260.0" x2="172.0" y2="260.0" stroke="#bc8cff" stroke-width="1.8" marker-end="url(#mk1)"/><text x="100.0" y="310.0" font-size="9" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">从左侧走来「发现」工具</text><text x="280.0" y="344.0" font-size="9.5" fill="#bc8cff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">工具在服务端等着被 agent 发现</text><rect x="492.0" y="100.0" width="380.0" height="270.0" rx="10" fill="none" stroke="#3fb950" stroke-width="1.2" stroke-dasharray="6 5"/><text x="504.0" y="120.0" font-size="12" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">AG-UI（绿）</text><rect x="512.0" y="200.0" width="150.0" height="120.0" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="1.6"/><text x="587.0" y="226.0" font-size="11.5" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">浏览器前端</text><rect x="528.0" y="240.0" width="118.0" height="16.0" rx="4" fill="#3fb950" opacity="0.18"/><rect x="528.0" y="240.0" width="118.0" height="16.0" rx="4" fill="none" stroke="#3fb950" stroke-width="1"/><text x="587.0" y="252.0" font-size="8" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="400">tool def #1</text><rect x="528.0" y="264.0" width="118.0" height="16.0" rx="4" fill="#3fb950" opacity="0.18"/><rect x="528.0" y="264.0" width="118.0" height="16.0" rx="4" fill="none" stroke="#3fb950" stroke-width="1"/><text x="587.0" y="276.0" font-size="8" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="400">tool def #2</text><rect x="528.0" y="288.0" width="118.0" height="16.0" rx="4" fill="#3fb950" opacity="0.18"/><rect x="528.0" y="288.0" width="118.0" height="16.0" rx="4" fill="none" stroke="#3fb950" stroke-width="1"/><text x="587.0" y="300.0" font-size="8" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="400">tool def #3</text><circle cx="800.0" cy="260.0" r="22.0" fill="#0d1117" stroke="#e6edf3" stroke-width="1.6"/><text x="800.0" y="265.0" font-size="9" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="700">agent</text><line x1="668.0" y1="260.0" x2="772.0" y2="260.0" stroke="#3fb950" stroke-width="1.8" marker-end="url(#mk2)"/><text x="800.0" y="310.0" font-size="9" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">运行时递给 agent 执行</text><text x="682.0" y="344.0" font-size="9.5" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">工具定义放在前端，运行时递给 agent</text><text x="450.0" y="176.0" font-size="13" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">方</text><text x="450.0" y="196.0" font-size="13" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">向</text><text x="450.0" y="216.0" font-size="13" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">完</text><text x="450.0" y="236.0" font-size="13" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">全</text><text x="450.0" y="256.0" font-size="13" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">相</text><text x="450.0" y="276.0" font-size="13" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">反</text><rect x="28.0" y="384.0" width="844.0" height="40.0" rx="8" fill="#0d1117" stroke="#8b949e" stroke-width="1" stroke-dasharray="4 3"/><text x="450.0" y="409.0" font-size="9.5" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">前端拥有工具定义 = 让界面的作者（而不是 agent 的作者）决定 agent 能碰到什么——权限模型从 agent 侧移到界面侧。</text><text x="450.0" y="452.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">它们站在不同的边界上，替不同的主语说话。</text></svg>