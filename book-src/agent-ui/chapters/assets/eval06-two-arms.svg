<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><defs><marker id="mk-3fb950" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#3fb950"/></marker><marker id="mk-58a6ff" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#58a6ff"/></marker><marker id="mk-8b949e" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#8b949e"/></marker><marker id="mk-f85149" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#f85149"/></marker></defs><rect x="0" y="0" width="960" height="600" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="28" y="38" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">归因靠对照，不靠证据强度</text><line x1="28" y1="52" x2="932" y2="52" stroke="#30363d" stroke-width="1"/><text x="40" y="86" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">正面示范：同一组用例，分叉两臂</text><rect x="60" y="150" width="140" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="130.0" y="183.0" font-size="12.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">同一组用例</text><text x="130.0" y="201.0" font-size="9.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">同一批 prompt · 同一环境</text><path d="M 202,172 C 260,160 290,140 336,136" fill="none" stroke="#58a6ff" stroke-width="1.4" marker-end="url(#mk-58a6ff)"/><path d="M 202,198 C 260,210 290,230 336,234" fill="none" stroke="#3fb950" stroke-width="1.4" marker-end="url(#mk-3fb950)"/><rect x="340" y="106" width="190" height="60" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/><text x="435.0" y="134.0" font-size="12.5" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">with 臂</text><text x="435.0" y="152.0" font-size="9.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">带插件 / skill</text><rect x="340" y="220" width="190" height="60" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/><text x="435.0" y="248.0" font-size="12.5" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">without 臂</text><text x="435.0" y="266.0" font-size="9.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">裸基线</text><line x1="532" y1="136" x2="586" y2="136" stroke="#58a6ff" stroke-width="1.4" marker-end="url(#mk-58a6ff)"/><line x1="532" y1="250" x2="586" y2="250" stroke="#3fb950" stroke-width="1.4" marker-end="url(#mk-3fb950)"/><rect x="590" y="112" width="120" height="48" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="650.0" y="140.32" font-size="12" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">分数 s₁</text><rect x="590" y="226" width="120" height="48" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="650.0" y="254.32" font-size="12" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">分数 s₀</text><path d="M 712,136 C 740,140 742,160 754,168" fill="none" stroke="#8b949e" stroke-width="1.2" marker-end="url(#mk-8b949e)"/><path d="M 712,250 C 740,246 742,226 754,218" fill="none" stroke="#8b949e" stroke-width="1.2" marker-end="url(#mk-8b949e)"/><text x="736" y="150" font-size="9.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">相减</text><text x="736" y="240" font-size="9.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">相减</text><rect x="758" y="146" width="150" height="94" rx="10" fill="#d29922" fill-opacity="0.1" stroke="#d29922" stroke-width="1.8"/><text x="833" y="182" font-size="14" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">Δ = 真贡献</text><text x="833" y="208" font-size="10.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">Δ 进报告首页</text><line x1="40" y1="318" x2="920" y2="318" stroke="#30363d" stroke-width="1" stroke-dasharray="7 5"/><text x="40" y="308" font-size="10.5" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">⚠ 反例区：对照组被污染的三种形态</text><rect x="60" y="340" width="240" height="64" rx="8" fill="none" stroke="#f85149" stroke-width="1.2" stroke-dasharray="6 5"/><text x="180" y="376" font-size="11.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">拿老 profile 当对照</text><line x1="180" y1="406" x2="180" y2="448" stroke="#f85149" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#mk-f85149)"/><rect x="360" y="340" width="240" height="64" rx="8" fill="none" stroke="#f85149" stroke-width="1.2" stroke-dasharray="6 5"/><text x="480" y="376" font-size="11.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">对照组靠默认值「自动出现」</text><line x1="480" y1="406" x2="480" y2="448" stroke="#f85149" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#mk-f85149)"/><rect x="660" y="340" width="240" height="64" rx="8" fill="none" stroke="#f85149" stroke-width="1.2" stroke-dasharray="6 5"/><text x="780" y="376" font-size="11.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">无裸基线，直接报分</text><line x1="780" y1="406" x2="780" y2="448" stroke="#f85149" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#mk-f85149)"/><rect x="60" y="452" width="840" height="58" rx="10" fill="#f85149" fill-opacity="0.08" stroke="#f85149" stroke-width="1.5"/><text x="480" y="488" font-size="13" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">没有裸基线时，「全绿」和「没测到」长得一模一样</text><text x="480" y="556" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">对照组选错，比没有对照组更危险——它给假结论披上了实验的外衣。</text></svg>