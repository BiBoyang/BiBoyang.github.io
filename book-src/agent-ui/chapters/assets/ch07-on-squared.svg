ht="400">每 tick 一根柱：柱高 = 当次 parse + build + layout 的输入长度</text><text x="14.0" y="120.0" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">输入长度</text><text x="14.0" y="136.0" font-size="10" fill="#8b949e" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">50 → 3000 字</text><rect x="712.0" y="108.0" width="160.0" height="120.0" rx="8" fill="#161b22"/><text x="726.0" y="136.0" font-size="11.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">降频砍的是</text><text x="726.0" y="155.0" font-size="11.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">常数因子，</text><text x="726.0" y="174.0" font-size="11.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">复杂度阶不变</text><rect x="712.0" y="244.0" width="160.0" height="136.0" rx="8" fill="#161b22"/><text x="726.0" y="272.0" font-size="11" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">收益集中在</text><text x="726.0" y="289.0" font-size="11" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">中等长度</text><text x="726.0" y="306.0" font-size="11" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">（1000–5000 字）；</text><text x="726.0" y="323.0" font-size="11" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400"></text><text x="726.0" y="340.0" font-size="11" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">触底 3Hz 后</text><text x="726.0" y="357.0" font-size="11" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">回归 N²</text><text x="450.0" y="454.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">宁可视觉上慢一点，也不能让 UI 掉帧——但阶没变。</text></svg>