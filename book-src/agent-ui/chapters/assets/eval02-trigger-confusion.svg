<svg xmlns="http://www.w3.org/2000/svg" width="940" height="540" viewBox="0 0 940 540"><rect x="0" y="0" width="940" height="540" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="28" y="38" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">触发层双向口径：混淆矩阵 + 影子信号侧袋</text><line x1="28" y1="52" x2="912" y2="52" stroke="#30363d" stroke-width="1"/><text x="330" y="104" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">实际触发 →</text><text x="60" y="110" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">报告触发 ↓</text><text x="255.0" y="124" font-size="12" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">是</text><text x="405.0" y="124" font-size="12" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">否</text><text x="166" y="184.0" font-size="12" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="700">是</text><text x="166" y="284.0" font-size="12" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="700">否</text><rect x="180" y="130" width="150" height="100" rx="6" fill="#3fb950" fill-opacity="0.12" stroke="#3fb950" stroke-width="1.4"/><text x="255.0" y="172" font-size="13" fill="#3fb950" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="700">TP</text><text x="255.0" y="196" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">报了，也确实触发</text><rect x="330" y="130" width="150" height="100" rx="6" fill="#d29922" fill-opacity="0.12" stroke="#d29922" stroke-width="1.4"/><text x="405.0" y="172" font-size="13" fill="#d29922" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="700">FP</text><text x="405.0" y="196" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">报了，但没触发</text><rect x="180" y="230" width="150" height="100" rx="6" fill="#f85149" fill-opacity="0.12" stroke="#f85149" stroke-width="1.4"/><text x="255.0" y="272" font-size="13" fill="#f85149" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="700">FN</text><text x="255.0" y="296" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">触发了，却没报</text><rect x="330" y="230" width="150" height="100" rx="6" fill="none" stroke="#30363d" stroke-width="1"/><text x="405.0" y="272" font-size="13" fill="#6e7681" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="700">TN</text><text x="405.0" y="296" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">没报，也没触发</text><text x="190" y="370" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">漏报（FN）是唯一吞掉 recall 的格子：</text><text x="190" y="392" font-size="11.5" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">recall = TP / (TP + FN)</text><rect x="560" y="110" width="340" height="252" rx="10" fill="none" stroke="#bc8cff" stroke-width="1.2" stroke-dasharray="7 5"/><text x="580" y="140" font-size="12.5" fill="#bc8cff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">影子信号侧袋</text><text x="580" y="172" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">agent 绕过 Skill 工具，</text><text x="580" y="194" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">直接 Read 了文件——</text><text x="580" y="216" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">行为 substantive，</text><text x="580" y="238" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">但不进触发矩阵。</text><line x1="580" y1="268" x2="880" y2="268" stroke="#bc8cff" stroke-width="1" stroke-dasharray="4 4"/><text x="580" y="296" font-size="11.5" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">影子信号不作 recall 减免</text><text x="580" y="320" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">进了侧袋的，不许偷偷加回分子。</text><text x="470" y="470" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">口径先于数字：先定义「算不算触发」，再谈 TP / FN。</text></svg>