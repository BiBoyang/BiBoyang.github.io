mily="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start">no popup</text><text x="320" y="394" font-size="10.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">在 → 吞掉或放行</text><text x="520" y="240" font-size="12.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">优先级 = 代码书写顺序</text><text x="520" y="264" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">不靠注册表，不靠配置</text><text x="520" y="284" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">最显式、最不可能被改坏的形式</text><text x="470" y="458" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle">InputResult：Submitted / Command / CommandWithArgs —— “这段输入是什么”在 composer 内部裁决</text></svg>