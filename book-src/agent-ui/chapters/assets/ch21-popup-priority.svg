<svg xmlns="http://www.w3.org/2000/svg" width="940" height="480" viewBox="0 0 940 480"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#8b949e"/></marker></defs><rect x="0" y="0" width="940" height="480" fill="#0d1117" rx="12" stroke="#30363d" stroke-width="1"/><text x="28" y="38" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="700">按键的旅程：弹窗优先级链（Codex chat_composer.rs）</text><line x1="28" y1="52" x2="912" y2="52" stroke="#30363d" stroke-width="1"/><text x="40" y="92" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">键盘事件到达 composer 后，逐级问询；每级返回 (InputResult, 是否已消费)</text><rect x="40" y="118" width="250" height="56" fill="#161b22" rx="10" stroke="#58a6ff" stroke-width="1"/><text x="60" y="144" font-size="12.5" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">① 文件弹窗</text><text x="60" y="163" font-size="10.5" fill="#8b949e" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start">file popup</text><path d="M165,174 L165,198" fill="none" stroke="#8b949e" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/><text x="180" y="190" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">弹窗不在或放行</text><text x="320" y="148" font-size="10.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">在 → 吞掉或放行</text><rect x="40" y="200" width="250" height="56" fill="#161b22" rx="10" stroke="#d2a8ff" stroke-width="1"/><text x="60" y="226" font-size="12.5" fill="#d2a8ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB