<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470"><defs><marker id="mk1" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#58a6ff"/></marker><marker id="mk2" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#bc8cff"/></marker></defs><rect x="0.0" y="0.0" width="920.0" height="470.0" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="28.0" y="38.0" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">checklist 是人机共享的状态机</text><line x1="28" y1="52" x2="892" y2="52" stroke="#30363d" stroke-width="1"/><rect x="330.0" y="130.0" width="260.0" height="120.0" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.8"/><text x="460.0" y="160.0" font-size="11" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">todos 活在 agent 级 tool store</text><text x="460.0" y="182.0" font-size="10" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="400">写入走 tools.update_store</text><line x1="350.0" y1="194.0" x2="570.0" y2="194.0" stroke="#30363d" stroke-width="1"/><text x="460.0" y="216.0" font-size="9.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">每次变更都是 wire 事件流上的一条记录</text><text x="460.0" y="234.0" font-size="9.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">重放可见 · 多端可投影</text><rect x="30.0" y="140.0" width="240.0" height="100.0" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/><text x="150.0" y="168.0" font-size="12.5" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">人读投影</text><text x="150.0" y="190.0" font-size="10.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">勾选框 UI</text><text x="150.0" y="212.0" font-size="9.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">进度确认（我看到了）</text><line x1="272.0" y1="190.0" x2="326.0" y2="190.0" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#mk1)"/><rect x="650.0" y="140.0" width="240.0" height="100.0" rx="8" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/><text x="770.0" y="168.0" font-size="12.5" fill="#bc8cff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">模型读注入</text><text x="770.0" y="190.0" font-size="10" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="400">TodoListReminderInjector</text><text x="770.0" y="212.0" font-size="9" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">连续 10 轮没碰清单就注入提醒</text><line x1="592.0" y1="190.0" x2="646.0" y2="190.0" stroke="#bc8cff" stroke-width="1.6" marker-end="url(#mk2)"/><rect x="650.0" y="252.0" width="240.0" height="52.0" rx="8" fill="#0d1117" stroke="#bc8cff" stroke-width="1"/><text x="770.0" y="274.0" font-size="9" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">纪律：完成一项立刻勾掉，</text><text x="770.0" y="292.0" font-size="9" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">任何时刻只保留一个 in_progress</text><rect x="30.0" y="326.0" width="270.0" height="100.0" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.4"/><text x="46.0" y="354.0" font-size="12" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">谁能勾？</text><text x="46.0" y="378.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">人勾 = 进度确认</text><text x="46.0" y="394.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">模型勾 = 完成声明</text><text x="46.0" y="410.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">语义完全不同</text><rect x="320.0" y="326.0" width="270.0" height="100.0" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.4"/><text x="336.0" y="354.0" font-size="12" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">勾了算什么？</text><text x="336.0" y="378.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">声明 ≠ 证据</text><rect x="610.0" y="326.0" width="270.0" height="100.0" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.4"/><text x="626.0" y="354.0" font-size="12" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">偏了怎么办？</text><text x="626.0" y="378.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">计划的全部价值在于</text><text x="626.0" y="394.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">提供偏离的参照系</text><text x="460.0" y="454.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">给用户看的进度 UI + 给模型看的自持上下文——多端投影在「计划」上的最小实例。</text></svg>