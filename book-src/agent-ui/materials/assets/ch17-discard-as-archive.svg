<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430"><defs><marker id="mk1" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#8b949e"/></marker></defs><rect x="0.0" y="0.0" width="880.0" height="430.0" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="28.0" y="38.0" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">被压缩掉的原文没有蒸发</text><line x1="28" y1="52" x2="852" y2="52" stroke="#30363d" stroke-width="1"/><rect x="28.0" y="92.0" width="420.0" height="300.0" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.4"/><text x="48.0" y="120.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">会话目录（grok）</text><text x="52.0" y="146.0" font-size="11" fill="#58a6ff" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="700">compaction/</text><text x="66.0" y="168.0" font-size="11" fill="#d29922" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">├── INDEX.md</text><text x="66.0" y="190.0" font-size="11" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">├── segment_0001.md</text><text x="66.0" y="212.0" font-size="11" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">├── segment_0002.md</text><text x="66.0" y="234.0" font-size="11" fill="#bc8cff" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">├── segment_0003.md</text><text x="66.0" y="256.0" font-size="11" fill="#8b949e" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">├── …</text><text x="230.0" y="158.0" font-size="8.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">← 索引</text><text x="330.0" y="202.0" font-size="8.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">← 单文件上限 512KB</text><rect x="52.0" y="288.0" width="372.0" height="88.0" rx="6" fill="#0d1117" stroke="#bc8cff" stroke-width="1.3"/><text x="66.0" y="310.0" font-size="9" fill="#bc8cff" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">segment_0003.md（打开一角）</text><line x1="66.0" y1="318.0" x2="410.0" y2="318.0" stroke="#30363d" stroke-width="1"/><text x="66.0" y="338.0" font-size="9" fill="#d29922" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">[... TRUNCATED at {limit} bytes,</text><text x="66.0" y="356.0" font-size="9" fill="#d29922" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">       {omitted} turns omitted ...]</text><rect x="464.0" y="92.0" width="388.0" height="138.0" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.4"/><text x="484.0" y="120.0" font-size="13" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">窗口里</text><text x="484.0" y="146.0" font-size="10" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">只装摘要——压缩叙事替换历史，</text><text x="484.0" y="164.0" font-size="10" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">喂给模型的上下文从此只有二手记录</text><text x="484.0" y="182.0" font-size="10" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">（原文对模型不可见）</text><line x1="658.0" y1="230.0" x2="658.0" y2="254.0" stroke="#8b949e" stroke-width="1.8" marker-end="url(#mk1)"/><text x="676.0" y="246.0" font-size="9" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">但原文另有去处</text><rect x="464.0" y="256.0" width="388.0" height="136.0" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.4"/><text x="484.0" y="284.0" font-size="13" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">磁盘上</text><text x="484.0" y="310.0" font-size="10" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">存全文：可浏览、可检索、带索引</text><text x="484.0" y="328.0" font-size="10" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">需要时人可以回去翻原始对话</text><text x="484.0" y="346.0" font-size="10" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">知道自己忘了什么（know what you forgot）</text><text x="440.0" y="414.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">「丢弃」其实是「归档」——know what you forgot 的物理形态已经有人做出来了。</text></svg>