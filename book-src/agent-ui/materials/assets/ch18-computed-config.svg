50" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="700">DevTools · Computed Styles</text><line x1="540.0" y1="130.0" x2="890.0" y2="130.0" stroke="#30363d" stroke-width="1"/><text x="544.0" y="152.0" font-size="10" fill="#58a6ff" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">color</text><text x="640.0" y="152.0" font-size="10" fill="#d29922" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">#e6edf3</text><text x="740.0" y="152.0" font-size="8.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">（最终生效值）</text><line x1="540.0" y1="164.0" x2="890.0" y2="164.0" stroke="#30363d" stroke-width="0.6"/><text x="544.0" y="186.0" font-size="10" fill="#58a6ff" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">margin</text><text x="640.0" y="186.0" font-size="10" fill="#d29922" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">8px 12px</text><text x="740.0" y="186.0" font-size="8.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">（层叠后唯一一条）</text><line x1="540.0" y1="198.0" x2="890.0" y2="198.0" stroke="#30363d" stroke-width="0.6"/><text x="544.0" y="220.0" font-size="10" fill="#58a6ff" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">font-size</text><text x="640.0" y="220.0" font-size="10" fill="#d29922" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">14px</text><text x="740.0" y="220.0" font-size="8.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">（覆盖了上层默认）</text><line x1="540.0" y1="232.0" x2="890.0" y2="232.0" stroke="#30363d" stroke-width="0.6"/><text x="544.0" y="254.0" font-size="10" fill="#58a6ff" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">display</text><text x="640.0" y="254.0" font-size="10" fill="#d29922" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">flex</text><text x="740.0" y="254.0" font-size="8.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400"></text><text x="540.0" y="306.0" font-size="9.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">CSS 也是多层级联叠加——浏览器给了面板：</text><text x="540.0" y="324.0" font-size="9.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">不管多少层怎么打架，告诉你最终生效的每一条。</text><rect x="520.0" y="356.0" width="390.0" height="98.0" rx="8" fill="#161b22" stroke="#bc8cff" stroke-width="1.4"/><text x="540.0" y="382.0" font-size="11" fill="#bc8cff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">agent 版面第一版要回答的三问：</text><text x="540.0" y="404.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">① 加载了哪些规则源（路径 + 各占多少上下文预算）？</text><text x="540.0" y="421.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">② 记忆注入了什么（条目 + 出处）？</text><text x="540.0" y="438.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">③ 冲突时谁赢了？</text><text x="470.0" y="470.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">文件派有审计没有合成，托管派有列表没有出处——这块界面是行为可审计性的最后一厘米。</text></svg>