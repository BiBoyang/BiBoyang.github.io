rosoft YaHei',sans-serif" text-anchor="middle" font-weight="400">git push 出去的历史</text><text x="352.0" y="232.0" font-size="11" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">↓</text><rect x="472.0" y="236.0" width="208.0" height="44.0" rx="8" fill="#0d1117" stroke="#f85149" stroke-width="1.2"/><text x="576.0" y="263.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">子 agent 的改动</text><text x="576.0" y="232.0" font-size="11" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">↓</text><rect x="696.0" y="236.0" width="208.0" height="44.0" rx="8" fill="#0d1117" stroke="#f85149" stroke-width="1.2"/><text x="800.0" y="263.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">已发出的邮件和消息</text><text x="800.0" y="232.0" font-size="11" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">↓</text><rect x="24.0" y="298.0" width="208.0" height="44.0" rx="8" fill="#0d1117" stroke="#f85149" stroke-width="1.2"/><text x="128.0" y="325.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">已合并的 PR</text><text x="128.0" y="294.0" font-size="11" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">↓</text><rect x="248.0" y="298.0" width="208.0" height="44.0" rx="8" fill="#0d1117" stroke="#f85149" stroke-width="1.2"/><text x="352.0" y="325.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">云上创建/删除的资源</text><text x="352.0" y="294.0" font-size="11" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">↓</text><rect x="472.0" y="298.0" width="208.0" height="44.0" rx="8" fill="#0d1117" stroke="#f85149" stroke-width="1.2"/><text x="576.0" y="325.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">已扣费的 API 调用</text><text x="576.0" y="294.0" font-size="11" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">↓</text><rect x="696.0" y="298.0" width="208.0" height="44.0" rx="8" fill="#0d1117" stroke="#f85149" stroke-width="1.2"/><text x="800.0" y="325.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">MCP 对第三方系统的写入</text><text x="800.0" y="294.0" font-size="11" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">↓</text><rect x="24.0" y="368.0" width="872.0" height="36.0" rx="8" fill="#0d1117" stroke="#d29922" stroke-width="1" stroke-dasharray="4 3"/><text x="460.0" y="391.0" font-size="10" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">这些操作和文件编辑共享同一颗「允许」按钮、共享同一种被保护的错觉。</text><rect x="24.0" y="416.0" width="872.0" height="40.0" rx="8" fill="#f85149" opacity="0.12"/><rect x="24.0" y="416.0" width="872.0" height="40.0" rx="8" fill="none" stroke="#f85149" stroke-width="1.4"/><text x="460.0" y="441.0" font-size="12.5" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">用户以为「错了能回来」，实际是「文件错了能回来」。</text><text x="460.0" y="470.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">checkpoint 的最大风险不是失效，是它让别的保护显得不需要——用户以为「错了能回来」，实际是「文件错了能回来」。</text></svg>