<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620">
<defs>
<marker id="mk-8b949e" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#8b949e"/></marker>
</defs>
<rect x="0" y="0" width="960" height="620" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<text x="28" y="38" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">召回–排序分层：BM25 地板之上，判官只在 band 内工作</text>
<line x1="28" y1="52" x2="932" y2="52" stroke="#30363d" stroke-width="1"/>

<!-- band 工作区 -->
<rect x="130" y="96" width="640" height="196" rx="6" fill="#d29922" fill-opacity="0.07" stroke="#d29922" stroke-width="1" stroke-dasharray="5 4"/>
<text x="760" y="114" font-size="10" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="700">band：判官工作区</text>
<!-- 低分阴影区 -->
<rect x="130" y="312" width="640" height="122" rx="6" fill="#f85149" fill-opacity="0.06" stroke="#f85149" stroke-width="1" stroke-dasharray="5 4"/>
<text x="770" y="330" font-size="10" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="700">低于阈值 → 判缺席，不咨询判官</text>
<text x="770" y="422" font-size="9.5" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="400" opacity="0.85">v1 误杀区：480 字节窗口把迂回措辞整片枪毙</text>
<!-- 阈值线 -->
<line x1="96" y1="300" x2="780" y2="300" stroke="#f85149" stroke-width="1.2" stroke-dasharray="7 4" opacity="0.8"/>
<text x="92" y="296" font-size="9.5" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">阈值</text>

<!-- BM25 轨道 -->
<line x1="112" y1="88" x2="112" y2="440" stroke="#58a6ff" stroke-width="2"/>
<line x1="104" y1="88" x2="120" y2="88" stroke="#58a6ff" stroke-width="2"/>
<line x1="104" y1="440" x2="120" y2="440" stroke="#58a6ff" stroke-width="2"/>
<text x="88" y="264" font-size="10.5" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700" transform="rotate(-90 88 264)">BM25 读全文</text>

