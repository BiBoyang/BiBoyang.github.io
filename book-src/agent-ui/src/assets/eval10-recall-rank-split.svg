<rect x="130" y="382" width="84" height="22" rx="4" fill="#6e7681" fill-opacity="0.16" stroke="#6e7681" stroke-width="1"/>
<text x="138" y="82" font-size="9.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">候选记忆条目（按词法分降序）</text>

<!-- 判官图标（只在带内） -->
<path d="M800,96 v196" fill="none" stroke="#3fb950" stroke-width="1.4"/>
<path d="M800,96 h-10 M800,292 h-10" stroke="#3fb950" stroke-width="1.4"/>
<circle cx="838" cy="194" r="24" fill="#161b22" stroke="#3fb950" stroke-width="1.6"/>
<text x="838" y="201" font-size="15" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">判</text>
<text x="838" y="238" font-size="9.5" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">只在带内工作</text>
<text x="838" y="270" font-size="9.5" fill="#8b949e" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="400">相关概率</text>
<text x="838" y="284" font-size="9.5" fill="#8b949e" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="400">+ 0.5 × 归一化 BM25</text>

<!-- 底部对照小图：左 -->
<rect x="60" y="466" width="400" height="84" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<polyline points="80,478 120,478 160,482 200,514 240,534 280,538" fill="none" stroke="#58a6ff" stroke-width="1.6"/>
<rect x="80" y="474" width="80" height="14" fill="#d29922" fill-opacity="0.18" stroke="none"/>
<text x="90" y="546" font-size="9.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">分数陡（程序性记忆）→ band 收没，退回基线</text>
<!-- 底部对照小图：右 -->
<rect x="500" y="466" width="400" height="84" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<polyline points="520,480 560,484 600,488 640,492 680,496 720,500" fill="none" stroke="#58a6ff" stroke-width="1.6"/>
<rect x="520" y="476" width="200" height="28" fill="#d29922" fill-opacity="0.18" stroke="none"/>
<text x="530" y="546" font-size="9.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">分数平（事实型）→ band 全盖，判官发挥</text>

<text x="40" y="592" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">band 的宽度跟着分数分布走：分布越平，判官的舞台越大；阈值之下一律按缺席处理。</text>
</svg>
