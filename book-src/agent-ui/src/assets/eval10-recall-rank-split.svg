<rect x="130" y="196" width="430" height="22" rx="4" fill="#58a6ff" fill-opacity="0.16" stroke="#58a6ff" stroke-width="1"/>
<rect x="130" y="228" width="352" height="22" rx="4" fill="#58a6ff" fill-opacity="0.15" stroke="#58a6ff" stroke-width="1"/>
<rect x="130" y="260" width="262" height="22" rx="4" fill="#58a6ff" fill-opacity="0.14" stroke="#58a6ff" stroke-width="1"/>
<rect x="130" y="318" width="176" height="22" rx="4" fill="#6e7681" fill-opacity="0.16" stroke="#6e7681" stroke-width="1"/>
