<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520"><defs><marker id="mk1" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#8b949e"/></marker></defs><rect x="0.0" y="0.0" width="880.0" height="520.0" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="28.0" y="38.0" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">发射即定型：emit_to_scrollback</text><line x1="28" y1="52" x2="852" y2="52" stroke="#30363d" stroke-width="1"/><rect x="40.0" y="92.0" width="150.0" height="56.0" rx="6" fill="#0d1117" stroke="#8b949e" stroke-width="1"/><rect x="50.0" y="104.0" width="67.5" height="5.0" rx="2" fill="#30363d"/><rect x="50.0" y="117.0" width="82.5" height="5.0" rx="2" fill="#30363d"/><rect x="50.0" y="130.0" width="67.5" height="5.0" rx="2" fill="#30363d"/><rect x="50.0" y="143.0" width="82.5" height="5.0" rx="2" fill="#30363d"/><rect x="46.0" y="126.0" width="138.0" height="18.0" rx="4" fill="#3fb950" opacity="0.18"/><circle cx="64.0" cy="120.0" r="12.0" fill="#58a6ff"/><text x="64.0" y="124.0" font-size="11" fill="#0d1117" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">1</text><text x="210.0" y="114.0" font-size="12" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">光标移到 viewport 顶，从此往下全擦掉</text><text x="210.0" y="136.0" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">发射前先擦干净自己的活区</text><line x1="115.0" y1="152.0" x2="115.0" y2="166.0" stroke="#8b949e" stroke-width="1.3" marker-end="url(#mk1)"/><rect x="40.0" y="170.0" width="150.0" height="56.0" rx="6" fill="#0d1117" stroke="#8b949e" stroke-width="1"/><rect x="50.0" y="182.0" width="67.5" height="5.0" rx="2" fill="#30363d"/><rect x="50.0" y="195.0" width="82.5" height="5.0" rx="2" fill="#30363d"/><rect x="50.0" y="208.0" width="67.5" height="5.0" rx="2" fill="#30363d"/><rect x="50.0" y="221.0" width="82.5" height="5.0" rx="2" fill="#30363d"/><rect x="46.0" y="204.0" width="138.0" height="18.0" rx="4" fill="#3fb950" opacity="0.18"/><circle cx="64.0" cy="198.0" r="12.0" fill="#58a6ff"/><text x="64.0" y="202.0" font-size="11" fill="#0d1117" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">2</text><text x="210.0" y="192.0" font-size="12" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">把内容打印在擦出来的区域</text><text x="210.0" y="214.0" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">长行不算换行——wrapping 是终端的工作</text><line x1="115.0" y1="230.0" x2="115.0" y2="244.0" stroke="#8b949e" stroke-width="1.3" marker-end="url(#mk1)"/><rect x="40.0" y="248.0" width="150.0" height="56.0" rx="6" fill="#0d1117" stroke="#8b949e" stroke-width="1"/><rect x="50.0" y="260.0" width="67.5" height="5.0" rx="2" fill="#30363d"/><rect x="50.0" y="273.0" width="82.5" height="5.0" rx="2" fill="#30363d"/><rect x="50.0" y="286.0" width="67.5" height="5.0" rx="2" fill="#30363d"/><rect x="50.0" y="299.0" width="82.5" height="5.0" rx="2" fill="#30363d"/><rect x="46.0" y="282.0" width="138.0" height="18.0" rx="4" fill="#3fb950" opacity="0.18"/><circle cx="64.0" cy="276.0" r="12.0" fill="#58a6ff"/><text x="64.0" y="280.0" font-size="11" fill="#0d1117" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">3</text><text x="210.0" y="270.0" font-size="12" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">打印 viewport.height 个空行</text><text x="210.0" y="292.0" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">在内容下方顶出一块空白</text><line x1="115.0" y1="308.0" x2="115.0" y2="322.0" stroke="#8b949e" stroke-width="1.3" marker-end="url(#mk1)"/><rect x="40.0" y="326.0" width="150.0" height="56.0" rx="6" fill="#0d1117" stroke="#8b949e" stroke-width="1"/><rect x="50.0" y="338.0" width="67.5" height="5.0" rx="2" fill="#30363d"/><rect x="50.0" y="351.0" width="82.5" height="5.0" rx="2" fill="#30363d"/><rect x="50.0" y="364.0" width="67.5" height="5.0" rx="2" fill="#30363d"/><rect x="50.0" y="377.0" width="82.5" height="5.0" rx="2" fill="#30363d"/><rect x="46.0" y="360.0" width="138.0" height="18.0" rx="4" fill="#3fb950" opacity="0.18"/><circle cx="64.0" cy="354.0" r="12.0" fill="#58a6ff"/><text x="64.0" y="358.0" font-size="11" fill="#0d1117" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">4</text><text x="210.0" y="348.0" font-size="12" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">光标移到新 viewport 位置，再擦一次</text><line x1="115.0" y1="386.0" x2="115.0" y2="400.0" stroke="#8b949e" stroke-width="1.3" marker-end="url(#mk1)"/><rect x="40.0" y="404.0" width="150.0" height="56.0" rx="6" fill="#0d1117" stroke="#8b949e" stroke-width="1"/><rect x="50.0" y="416.0" width="67.5" height="5.0" rx="2" fill="#30363d"/><rect x="50.0" y="429.0" width="82.5" height="5.0" rx="2" fill="#30363d"/><rect x="50.0" y="442.0" width="67.5" height="5.0" rx="2" fill="#30363d"/><rect x="50.0" y="455.0" width="82.5" height="5.0" rx="2" fill="#30363d"/><rect x="46.0" y="438.0" width="138.0" height="18.0" rx="4" fill="#3fb950" opacity="0.18"/><circle cx="64.0" cy="432.0" r="12.0" fill="#58a6ff"/><text x="64.0" y="436.0" font-size="11" fill="#0d1117" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">5</text><text x="210.0" y="426.0" font-size="12" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">双缓冲作废，viewport 全量重画</text><text x="210.0" y="448.0" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">记账只有一个 Rect</text><rect x="520.0" y="130.0" width="320.0" height="150.0" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/><text x="680.0" y="180.0" font-size="14" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">viewport 是可擦除的墨水</text><text x="680.0" y="220.0" font-size="14" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">scrollback 是泼出去的水</text><text x="680.0" y="258.0" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">定型即发射，发射不可收回</text><text x="440.0" y="504.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">从终端视角看，这个程序只做两件事——往下打印、在底部反复涂改一小块。</text></svg>