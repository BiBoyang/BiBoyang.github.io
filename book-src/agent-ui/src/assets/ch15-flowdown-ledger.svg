<svg xmlns="http://www.w3.org/2000/svg" width="920" height="450" viewBox="0 0 920 450"><defs><marker id="mk1" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#8b949e"/></marker></defs><rect x="0.0" y="0.0" width="920.0" height="450.0" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="28.0" y="38.0" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">FlowDown 的历史管理：入库、窗口化、结算</text><line x1="28" y1="52" x2="892" y2="52" stroke="#30363d" stroke-width="1"/><rect x="30.0" y="92.0" width="272.0" height="308.0" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/><text x="46.0" y="124.0" font-size="14" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">① 入库</text><text x="46.0" y="146.0" font-size="10" fill="#8b949e" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">Storage 框架 + WCDB</text><line x1="46.0" y1="156.0" x2="286.0" y2="156.0" stroke="#30363d" stroke-width="1"/><text x="46.0" y="178.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">Conversation / Message / Attachment 三张表</text><text x="46.0" y="197.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">Message 字段亮点：</text><text x="46.0" y="216.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· document 原文</text><text x="46.0" y="235.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· documentNodes（Markdown 节点树直接入库）</text><text x="46.0" y="254.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· reasoningContent + thinkingDuration</text><text x="46.0" y="273.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· removed 软删除 · deviceId 多设备同步</text><text x="46.0" y="292.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">连渲染管线的中间产物也持久化</text><line x1="304.0" y1="246.0" x2="323.0" y2="246.0" stroke="#8b949e" stroke-width="1.8" marker-end="url(#mk1)"/><rect x="325.0" y="92.0" width="272.0" height="308.0" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/><text x="341.0" y="124.0" font-size="14" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">② 窗口化</text><text x="341.0" y="146.0" font-size="10" fill="#8b949e" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">ListViewKit</text><line x1="341.0" y1="156.0" x2="581.0" y2="156.0" stroke="#30363d" stroke-width="1"/><text x="341.0" y="178.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">diffable data source 增量更新</text><text x="341.0" y="197.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">屏幕之外没有像素——</text><text x="341.0" y="216.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">滚出视野的行，数据在库里，</text><text x="341.0" y="235.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">cell 进复用池</text><text x="341.0" y="254.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400"></text><text x="341.0" y="273.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">像素只租给可见的十几行</text><line x1="599.0" y1="246.0" x2="618.0" y2="246.0" stroke="#8b949e" stroke-width="1.8" marker-end="url(#mk1)"/><rect x="620.0" y="92.0" width="272.0" height="308.0" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.5"/><text x="636.0" y="124.0" font-size="14" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">③ 结算</text><text x="636.0" y="146.0" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">生命周期节点统一 save()</text><line x1="636.0" y1="156.0" x2="876.0" y2="156.0" stroke="#30363d" stroke-width="1"/><text x="636.0" y="178.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">流式热路径：只更新内存 + 刷新 UI</text><text x="636.0" y="197.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">流结束后的修补序列才是落盘点：</text><text x="636.0" y="216.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 网页引用回填</text><text x="636.0" y="235.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 空回复丢弃</text><text x="636.0" y="254.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 工具参数修复</text><text x="460.0" y="434.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">「什么时候算定型」从几何问题变成生命周期问题——终端管像素何时发射，GUI 管记录何时落盘。</text></svg>