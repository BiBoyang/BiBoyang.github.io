<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420"><defs><marker id="mk1" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#8b949e"/></marker></defs><rect x="0.0" y="0.0" width="920.0" height="420.0" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="28.0" y="38.0" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">生前归自己，死后归终端</text><line x1="28" y1="52" x2="892" y2="52" stroke="#30363d" stroke-width="1"/><rect x="40.0" y="110.0" width="268.0" height="220.0" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.6"/><text x="174.0" y="146.0" font-size="14" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">会话期间</text><line x1="60.0" y1="160.0" x2="288.0" y2="160.0" stroke="#30363d" stroke-width="1"/><text x="60.0" y="190.0" font-size="10.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">历史归引擎</text><text x="60.0" y="214.0" font-size="10.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">可滚动 · 可搜索 · 可选择复制</text><text x="60.0" y="238.0" font-size="10.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">resize 平价：O(屏高)，无 I/O 爆发</text><rect x="326.0" y="110.0" width="268.0" height="220.0" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.6"/><text x="460.0" y="146.0" font-size="14" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">退出时刻</text><line x1="346.0" y1="160.0" x2="574.0" y2="160.0" stroke="#30363d" stroke-width="1"/><text x="346.0" y="190.0" font-size="10.5" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">afterTerminalStop</text><text x="346.0" y="214.0" font-size="10.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">把整个文档重新打印回主屏</text><text x="346.0" y="238.0" font-size="10.5" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">逐行 \r + 清行 + 内容</text><text x="346.0" y="262.0" font-size="10.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">缴一次「全量重印」的税</text><rect x="612.0" y="110.0" width="268.0" height="220.0" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.6"/><text x="746.0" y="146.0" font-size="14" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">退出之后</text><line x1="632.0" y1="160.0" x2="860.0" y2="160.0" stroke="#30363d" stroke-width="1"/><text x="632.0" y="190.0" font-size="10.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">历史落进终端原生 scrollback</text><text x="632.0" y="214.0" font-size="10.5" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">照常上翻 · Cmd+F</text><text x="632.0" y="238.0" font-size="10.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">终端自己的选择复制</text><line x1="310.0" y1="220.0" x2="324.0" y2="220.0" stroke="#8b949e" stroke-width="1.8" marker-end="url(#mk1)"/><line x1="596.0" y1="220.0" x2="610.0" y2="220.0" stroke="#8b949e" stroke-width="1.8" marker-end="url(#mk1)"/><rect x="120.0" y="352.0" width="680.0" height="30.0" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="460.0" y="372.0" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">inline 派会话中无法提供可交互的历史；全屏派退出后把历史带走——串行混合让两派的优点各取一段</text><text x="460.0" y="404.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">所有权从一道单选题，变成一份随生命周期转移的调度表。</text></svg>