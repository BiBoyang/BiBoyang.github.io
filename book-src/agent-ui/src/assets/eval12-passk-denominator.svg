<text x="28" y="458" font-size="11.5" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">若基础设施错误与任务难度相关（长任务更容易断连），剔除带来的偏差有方向：系统性偏高。</text>
