<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620">
<defs>
<marker id="mk-58a6ff" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#58a6ff"/></marker>
<marker id="mk-f85149" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#f85149"/></marker>
</defs>
<rect x="0" y="0" width="960" height="620" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<text x="28" y="38" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">三层闸门：写入 → 检索 → 采信，端到端失败逐层反推</text>
<line x1="28" y1="52" x2="932" y2="52" stroke="#30363d" stroke-width="1"/>

<!-- 闸门 ① 写入 -->
<polygon points="70,150 300,150 300,330 70,330" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<polygon points="300,150 340,190 340,290 300,330" fill="#161b22" stroke="#58a6ff" stroke-width="1.4"/>
<text x="185" y="212" font-size="13" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">① 写入</text>
<text x="185" y="238" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">该记的沉淀了吗</text>
<text x="185" y="260" font-size="10" fill="#8b949e" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="400">覆盖率 / 关系判定</text>
<rect x="90" y="92" width="190" height="30" rx="15" fill="#0d1117" stroke="#d29922" stroke-width="1.1"/>
<text x="185" y="112" font-size="9.5" fill="#d29922" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="400">咨询 55 次，0 次越阈（未测）</text>
<line x1="185" y1="122" x2="185" y2="148" stroke="#d29922" stroke-width="1" stroke-dasharray="3 3"/>

<!-- 闸门 ② 检索 -->
<polygon points="380,170 580,170 580,310 380,310" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<polygon points="580,170 616,206 616,274 580,310" fill="#161b22" stroke="#58a6ff" stroke-width="1.4"/>
<line x1="344" y1="240" x2="376" y2="240" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#mk-58a6ff)"/>
<text x="480" y="222" font-size="13" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">② 检索</text>
<text x="480" y="246" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">金标在第几名</text>
<text x="480" y="268" font-size="10" fill="#8b949e" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="400">gold-at-1 / top-3 / MRR</text>
<rect x="380" y="92" width="200" height="30" rx="15" fill="#0d1117" stroke="#58a6ff" stroke-width="1.1"/>
<text x="480" y="112" font-size="9.5" fill="#58a6ff" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="400">MRR 0.620→0.495，p=0.001</text>
<line x1="480" y1="122" x2="480" y2="168" stroke="#58a6ff" stroke-width="1" stroke-dasharray="3 3"/>

<!-- 闸门 ③ 采信 -->
<polygon points="660,190 830,190 830,290 660,290" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<polygon points="830,190 862,222 862,258 830,290" fill="#161b22" stroke="#58a6ff" stroke-width="1.4"/>
<line x1="620" y1="240" x2="656" y2="240" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#mk-58a6ff)"/>
<text x="745" y="230" font-size="13" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">③ 采信</text>
<text x="745" y="254" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">打开 · 核实 · 答对</text>
<rect x="640" y="92" width="210" height="30" rx="15" fill="#0d1117" stroke="#3fb950" stroke-width="1.1"/>
<text x="745" y="112" font-size="9.5" fill="#3fb950" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="400">注释臂 34/60 vs 静默臂 42/60</text>
<line x1="745" y1="122" x2="745" y2="188" stroke="#3fb950" stroke-width="1" stroke-dasharray="3 3"/>

<!-- 反向折返归因箭头 -->
<path d="M745,340 L745,420 L185,420 L185,352" fill="none" stroke="#f85149" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#mk-f85149)"/>
<circle cx="745" cy="336" r="4" fill="#f85149"/>
<text x="465" y="408" font-size="11" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">端到端没答对 → 从采信层往回反推，断在哪层补哪层</text>
<circle cx="480" cy="420" r="3.5" fill="#f85149" opacity="0.7"/>
<circle cx="745" cy="420" r="3.5" fill="#f85149" opacity="0.7"/>

<!-- 层间注释 -->
<rect x="120" y="470" width="720" height="52" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="480" y="492" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">三个闸门各有独立指标：写入面未测（0 次越阈说明从未触发）、检索面显著退化、采信面有臂间差异——</text>
<text x="480" y="510" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">端到端的一个「没答对」，要被拆成三个可分别修复的问题。</text>

<text x="40" y="592" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">漏斗收窄不是数据流失，是每过一道闸门都要重新证明自己的资格。</text>
</svg>
