<svg xmlns="http://www.w3.org/2000/svg" width="940" height="460" viewBox="0 0 940 460"><defs><marker id="mk1" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#f85149"/></marker></defs><rect x="0.0" y="0.0" width="940.0" height="460.0" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="28.0" y="38.0" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">终端的 XSS：一次确认框劫持的解剖</text><line x1="28" y1="52" x2="912" y2="52" stroke="#30363d" stroke-width="1"/><rect x="30.0" y="92.0" width="150.0" height="56.0" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.3"/><circle cx="50.0" cy="120.0" r="10.0" fill="#f85149"/><text x="50.0" y="123.6" font-size="10" fill="#0d1117" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">①</text><text x="68.0" y="124.0" font-size="10" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">恶意 MCP 服务器</text><line x1="182.0" y1="120.0" x2="206.0" y2="120.0" stroke="#f85149" stroke-width="1.5" marker-end="url(#mk1)"/><rect x="208.0" y="92.0" width="150.0" height="56.0" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.3"/><circle cx="228.0" cy="120.0" r="10.0" fill="#f85149"/><text x="228.0" y="123.6" font-size="10" fill="#0d1117" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">②</text><text x="246.0" y="124.0" font-size="10" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">返回文本埋光标码</text><line x1="360.0" y1="120.0" x2="384.0" y2="120.0" stroke="#f85149" stroke-width="1.5" marker-end="url(#mk1)"/><rect x="386.0" y="92.0" width="150.0" height="56.0" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.3"/><circle cx="406.0" cy="120.0" r="10.0" fill="#f85149"/><text x="406.0" y="123.6" font-size="10" fill="#0d1117" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">③</text><text x="424.0" y="124.0" font-size="10" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">确认时刻命令已擦换</text><line x1="538.0" y1="120.0" x2="562.0" y2="120.0" stroke="#f85149" stroke-width="1.5" marker-end="url(#mk1)"/><rect x="564.0" y="92.0" width="150.0" height="56.0" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.3"/><circle cx="584.0" cy="120.0" r="10.0" fill="#f85149"/><text x="584.0" y="123.6" font-size="10" fill="#0d1117" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">④</text><text x="602.0" y="124.0" font-size="10" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">用户核对「无误」</text><line x1="716.0" y1="120.0" x2="740.0" y2="120.0" stroke="#f85149" stroke-width="1.5" marker-end="url(#mk1)"/><rect x="742.0" y="92.0" width="150.0" height="56.0" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.3"/><circle cx="762.0" cy="120.0" r="10.0" fill="#f85149"/><text x="762.0" y="123.6" font-size="10" fill="#0d1117" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">⑤</text><text x="780.0" y="124.0" font-size="10" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">按下回车</text><rect x="208.0" y="168.0" width="150.0" height="110.0" rx="8" fill="#0d1117" stroke="#f85149" stroke-width="1" stroke-dasharray="4 3"/><text x="218.0" y="190.0" font-size="9.5" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">三个零件：</text><text x="218.0" y="210.0" font-size="8.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">ESC[A + ESC[2K</text><text x="218.0" y="227.0" font-size="8.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">改写已输出内容</text><text x="218.0" y="244.0" font-size="8.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">OSC 52 写剪贴板</text><text x="218.0" y="261.0" font-size="8.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">OSC 8 假链接</text><rect x="386.0" y="168.0" width="326.0" height="110.0" rx="8" fill="#0d1117" stroke="#f85149" stroke-width="1.4"/><text x="402.0" y="192.0" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">工具将执行：</text><text x="402.0" y="214.0" font-size="10.5" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">rm -rf ./tmp</text><text x="530.0" y="214.0" font-size="10.5" fill="#f85149" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">rm -rf ~/.ssh</text><rect x="528" y="200" width="104" height="18" fill="none" rx="3" stroke="#f85149" stroke-width="1.4"/><text x="402.0" y="238.0" font-size="9" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">显示 github.com/foo，指向别处</text><text x="402.0" y="262.0" font-size="9.5" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">良性描述一半真一半假</text><rect x="30.0" y="300.0" width="880.0" height="56.0" rx="8" fill="#f85149" opacity="0.12"/><rect x="30.0" y="300.0" width="880.0" height="56.0" rx="8" fill="none" stroke="#f85149" stroke-width="1.4"/><text x="470.0" y="324.0" font-size="12" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">权限 UX 的全部隐含假设——用户看到的等于将要执行的——</text><text x="470.0" y="346.0" font-size="12" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">在字符网格上可以用一串字节伪造</text><text x="470.0" y="388.0" font-size="9.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">GUI 里内容原地消失是异常；终端里滚动、清屏、重绘每分钟都在发生——用户对「字符消失」已脱敏，这是介质给攻击者免租金提供的掩护</text><text x="470.0" y="444.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">human-in-the-loop 的完整拼写不是 approve what you see，是 see what you approve。</text></svg>