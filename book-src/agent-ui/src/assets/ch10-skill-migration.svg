<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450"><defs><marker id="mk1" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#8b949e"/></marker><marker id="mk2" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#3fb950"/></marker></defs><rect x="0.0" y="0.0" width="900.0" height="450.0" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="28.0" y="38.0" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">一个全栈开发者的经验怎么迁移</text><line x1="28" y1="52" x2="872" y2="52" stroke="#30363d" stroke-width="1"/><rect x="30.0" y="96.0" width="110.0" height="48.0" rx="8" fill="#161b22"/><text x="85.0" y="126.0" font-size="12.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">移动端</text><rect x="300.0" y="92.0" width="250.0" height="56.0" rx="8" fill="#161b22"/><text x="314.0" y="114.0" font-size="11.5" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">权限和通知 UX</text><text x="314.0" y="134.0" font-size="9" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">授权粒度、授权疲劳、推送平衡</text><line x1="142.0" y1="120.0" x2="296.0" y2="120.0" stroke="#8b949e" stroke-width="1.3" marker-end="url(#mk1)"/><line x1="552.0" y1="120.0" x2="620.0" y2="250.0" stroke="#3fb950" stroke-width="1.1" marker-end="url(#mk2)"/><rect x="30.0" y="158.0" width="110.0" height="48.0" rx="8" fill="#161b22"/><text x="85.0" y="188.0" font-size="12.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">桌面端</text><rect x="300.0" y="154.0" width="250.0" height="56.0" rx="8" fill="#161b22"/><text x="314.0" y="176.0" font-size="11.5" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">本地集成和系统交互</text><text x="314.0" y="196.0" font-size="9" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">文件权限、shell 继承、签名更新</text><line x1="142.0" y1="182.0" x2="296.0" y2="182.0" stroke="#8b949e" stroke-width="1.3" marker-end="url(#mk1)"/><line x1="552.0" y1="182.0" x2="620.0" y2="250.0" stroke="#3fb950" stroke-width="1.1" marker-end="url(#mk2)"/><rect x="30.0" y="220.0" width="110.0" height="48.0" rx="8" fill="#161b22"/><text x="85.0" y="250.0" font-size="12.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">TUI</text><rect x="300.0" y="216.0" width="250.0" height="56.0" rx="8" fill="#161b22"/><text x="314.0" y="238.0" font-size="11.5" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">高密度文本信息架构</text><text x="314.0" y="258.0" font-size="9" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">信息优先级：committed/live 分区、通知上限</text><line x1="142.0" y1="244.0" x2="296.0" y2="244.0" stroke="#8b949e" stroke-width="1.3" marker-end="url(#mk1)"/><line x1="552.0" y1="244.0" x2="620.0" y2="250.0" stroke="#3fb950" stroke-width="1.1" marker-end="url(#mk2)"/><rect x="30.0" y="282.0" width="110.0" height="48.0" rx="8" fill="#161b22"/><text x="85.0" y="312.0" font-size="12.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">全栈</text><rect x="300.0" y="278.0" width="250.0" height="56.0" rx="8" fill="#161b22"/><text x="314.0" y="300.0" font-size="11.5" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">Runtime 和持久化设计</text><text x="314.0" y="320.0" font-size="9" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">append-only event log、信任规则持久化</text><line x1="142.0" y1="306.0" x2="296.0" y2="306.0" stroke="#8b949e" stroke-width="1.3" marker-end="url(#mk1)"/><line x1="552.0" y1="306.0" x2="620.0" y2="250.0" stroke="#3fb950" stroke-width="1.1" marker-end="url(#mk2)"/><rect x="30.0" y="344.0" width="110.0" height="48.0" rx="8" fill="#161b22"/><text x="85.0" y="374.0" font-size="12.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">大前端</text><rect x="300.0" y="340.0" width="250.0" height="56.0" rx="8" fill="#161b22"/><text x="314.0" y="362.0" font-size="11.5" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">复杂交互状态管理</text><text x="314.0" y="382.0" font-size="9" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">异步事件并发、用户中途介入——同构于 Agent 事件处理</text><line x1="142.0" y1="368.0" x2="296.0" y2="368.0" stroke="#8b949e" stroke-width="1.3" marker-end="url(#mk1)"/><line x1="552.0" y1="368.0" x2="620.0" y2="250.0" stroke="#3fb950" stroke-width="1.1" marker-end="url(#mk2)"/><rect x="624.0" y="196.0" width="248.0" height="108.0" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.8"/><text x="748.0" y="244.0" font-size="15" fill="#3fb950" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="700">Agent Workflow</text><text x="748.0" y="268.0" font-size="15" fill="#3fb950" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="700">Engineer</text><text x="748.0" y="292.0" font-size="9.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">旧经验 × 新介质</text><text x="450.0" y="434.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">他们写的是 Agent 的界面，但做的不是传统意义上的「前端」。</text></svg>