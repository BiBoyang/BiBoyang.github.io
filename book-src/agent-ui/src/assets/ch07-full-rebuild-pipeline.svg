<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470"><defs><marker id="mk1" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#8b949e"/></marker></defs><rect x="0.0" y="0.0" width="940.0" height="470.0" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="28.0" y="38.0" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">打字机效果 ≠ 增量渲染：每一帧都是全量管线</text><line x1="28" y1="52" x2="912" y2="52" stroke="#30363d" stroke-width="1"/><text x="28.0" y="80.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">数据层是增量的（BalancedEmitter 逐字吐出），渲染层不是</text><rect x="28.0" y="106.0" width="96.0" height="84.0" rx="8" fill="#161b22"/><text x="76.0" y="140.0" font-size="13" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">LLM</text><text x="76.0" y="160.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">token 流</text><text x="76.0" y="178.0" font-size="10" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">逐字</text><rect x="140.0" y="106.0" width="118.0" height="84.0" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.3"/><text x="152.0" y="132.0" font-size="12.5" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">① 传输</text><text x="152.0" y="152.0" font-size="9.5" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">SSE chunk</text><line x1="124.0" y1="148.0" x2="138.0" y2="148.0" stroke="#8b949e" stroke-width="1.4" marker-end="url(#mk1)"/><rect x="270.0" y="106.0" width="118.0" height="84.0" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.3"/><text x="282.0" y="132.0" font-size="12.5" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">② 拼接</text><text x="282.0" y="152.0" font-size="9.5" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">字符串 + 节流</text><line x1="259.0" y1="148.0" x2="269.0" y2="148.0" stroke="#8b949e" stroke-width="1.4" marker-end="url(#mk1)"/><rect x="400.0" y="106.0" width="118.0" height="84.0" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.3"/><text x="412.0" y="132.0" font-size="12.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">③ 检测</text><text x="412.0" y="152.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">是否可解析</text><rect x="410.0" y="165.0" width="105.8" height="20.0" rx="10" fill="#8b949e" opacity="0.14"/><rect x="410.0" y="165.0" width="105.8" height="20.0" rx="10" fill="none" stroke="#8b949e" stroke-width="1"/><text x="418.0" y="176.0" font-size="9.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">大部分实现没有这层</text><line x1="389.0" y1="148.0" x2="399.0" y2="148.0" stroke="#8b949e" stroke-width="1.4" marker-end="url(#mk1)"/><rect x="530.0" y="106.0" width="118.0" height="84.0" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.3"/><text x="542.0" y="132.0" font-size="12.5" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">④ 解析</text><text x="542.0" y="152.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">Markdown → AST</text><rect x="540.0" y="165.0" width="61.2" height="20.0" rx="10" fill="#f85149" opacity="0.14"/><rect x="540.0" y="165.0" width="61.2" height="20.0" rx="10" fill="none" stroke="#f85149" stroke-width="1"/><text x="548.0" y="176.0" font-size="9.5" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">全量 O(n)</text><line x1="519.0" y1="148.0" x2="529.0" y2="148.0" stroke="#8b949e" stroke-width="1.4" marker-end="url(#mk1)"/><rect x="660.0" y="106.0" width="118.0" height="84.0" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.3"/><text x="672.0" y="132.0" font-size="12.5" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">⑤ 构建</text><text x="672.0" y="152.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">AST →</text><text x="672.0" y="166.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">NSAttributedString</text><rect x="670.0" y="165.0" width="61.2" height="20.0" rx="10" fill="#d29922" opacity="0.14"/><rect x="670.0" y="165.0" width="61.2" height="20.0" rx="10" fill="none" stroke="#d29922" stroke-width="1"/><text x="678.0" y="176.0" font-size="9.5" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">全量 O(n)</text><line x1="649.0" y1="148.0" x2="659.0" y2="148.0" stroke="#8b949e" stroke-width="1.4" marker-end="url(#mk1)"/><rect x="790.0" y="106.0" width="118.0" height="84.0" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.3"/><text x="802.0" y="132.0" font-size="12.5" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">⑥ 布局</text><text x="802.0" y="152.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">→ 像素</text><rect x="800.0" y="165.0" width="61.2" height="20.0" rx="10" fill="#d29922" opacity="0.14"/><rect x="800.0" y="165.0" width="61.2" height="20.0" rx="10" fill="none" stroke="#d29922" stroke-width="1"/><text x="808.0" y="176.0" font-size="9.5" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">全量 O(n)</text><line x1="779.0" y1="148.0" x2="789.0" y2="148.0" stroke="#8b949e" stroke-width="1.4" marker-end="url(#mk1)"/><text x="28.0" y="232.0" font-size="12" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">单帧耗时占比（3000 字）</text><rect x="28.0" y="248.0" width="88.0" height="34.0" rx="4" fill="#f85149" opacity="0.85"/><text x="72.0" y="270.0" font-size="11" fill="#0d1117" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">解析 ~5%</text><rect x="116.0" y="248.0" width="132.0" height="34.0" rx="4" fill="#d29922" opacity="0.85"/><text x="182.0" y="270.0" font-size="11" fill="#0d1117" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">构建 ~15%</text><rect x="248.0" y="248.0" width="664.0" height="34.0" rx="4" fill="#58a6ff" opacity="0.85"/><text x="580.0" y="270.0" font-size="11" fill="#0d1117" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">布局 ~80%</text><text x="28.0" y="312.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">布局：CoreText 全量 invalidate，20–60ms / 3000 字</text><text x="28.0" y="334.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">④⑤⑥ 每帧对「当前全部文本」重跑一遍——长度越长，单帧越贵</text><text x="470.0" y="454.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">3000 字时每秒 9 次全量管线，CPU ~60%——真凶是属性异构度 × 高频触发。</text></svg>