<svg xmlns="http://www.w3.org/2000/svg" width="920" height="486" viewBox="0 0 920 486"><defs></defs><rect x="0.0" y="0.0" width="920.0" height="486.0" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="28.0" y="38.0" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">两家都叫 rewind，回滚的根本不是同一个世界</text><line x1="28" y1="52" x2="892" y2="52" stroke="#30363d" stroke-width="1"/><rect x="28.0" y="96.0" width="420.0" height="190.0" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/><text x="48.0" y="124.0" font-size="13" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">kwwk：会话级 rewind</text><text x="48.0" y="152.0" font-size="10" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">SessionStore 的 .rewind 持久化操作</text><text x="48.0" y="170.0" font-size="10" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">+ .streamRewind 事件</text><text x="48.0" y="188.0" font-size="10" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400"></text><text x="48.0" y="206.0" font-size="10" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">回滚的是对话本身：</text><text x="48.0" y="224.0" font-size="10" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">分支退回某个节点，</text><text x="48.0" y="242.0" font-size="10" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">transcript 整体重建</text><rect x="472.0" y="96.0" width="420.0" height="190.0" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/><text x="492.0" y="124.0" font-size="13" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">Claude Code：文件级 rewind</text><text x="492.0" y="150.0" font-size="10" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">每个 prompt 一个 checkpoint，三向菜单：</text><rect x="492.0" y="164.0" width="122.0" height="34.0" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="1"/><text x="553.0" y="185.0" font-size="9" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">代码和对话一起回</text><rect x="622.0" y="164.0" width="122.0" height="34.0" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="1"/><text x="683.0" y="185.0" font-size="9" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">只回对话</text><rect x="752.0" y="164.0" width="122.0" height="34.0" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="1"/><text x="813.0" y="185.0" font-size="9" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">只回代码</text><text x="492.0" y="226.0" font-size="10" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">对话可以继续走，代码回到过去。</text><text x="492.0" y="252.0" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">两种 rewind 不可通约。</text><rect x="28.0" y="304.0" width="864.0" height="130.0" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.4" stroke-dasharray="6 4"/><text x="48.0" y="332.0" font-size="11.5" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">理想中的「时间旅行」：三者对齐回到同一时间点</text><rect x="48.0" y="350.0" width="248.0" height="62.0" rx="8" fill="#0d1117" stroke="#58a6ff" stroke-width="1.3"/><text x="172.0" y="378.0" font-size="12" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">会话分支</text><text x="172.0" y="400.0" font-size="9" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">有快照可回</text><rect x="320.0" y="350.0" width="248.0" height="62.0" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="1.3"/><text x="444.0" y="378.0" font-size="12" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">文件快照</text><text x="444.0" y="400.0" font-size="9" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">有快照可回</text><rect x="592.0" y="350.0" width="248.0" height="62.0" rx="8" fill="#0d1117" stroke="#8b949e" stroke-width="1.3" stroke-dasharray="3 3"/><text x="716.0" y="378.0" font-size="12" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">外部世界状态</text><text x="716.0" y="396.0" font-size="8.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">没有任何人碰得到：</text><text x="716.0" y="408.0" font-size="8.5" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">根本没有快照可回</text><text x="460.0" y="470.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">为可逆性显式建一份账——渲染层建了（appendFrame 唯一通道），文件层建了（checkpoint 快照），唯独外部副作用那层还没有人建账。</text></svg>