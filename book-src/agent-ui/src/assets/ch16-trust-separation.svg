<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460"><defs><marker id="mk1" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#3fb950"/></marker><marker id="mk2" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#d29922"/></marker><marker id="mk3" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#f85149"/></marker></defs><rect x="0.0" y="0.0" width="920.0" height="460.0" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="28.0" y="38.0" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">Agent UI 需要自己的同源策略</text><line x1="28" y1="52" x2="892" y2="52" stroke="#30363d" stroke-width="1"/><rect x="28.0" y="92.0" width="360.0" height="318.0" rx="10" fill="none" stroke="#f85149" stroke-width="1.2" stroke-dasharray="6 5"/><text x="40.0" y="112.0" font-size="12" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">现状：混在一条流里</text><rect x="48.0" y="140.0" width="130.0" height="44.0" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.2"/><text x="113.0" y="160.0" font-size="10.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">用户指令</text><text x="113.0" y="177.0" font-size="8.5" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">可信</text><line x1="180.0" y1="162.0" x2="246.0" y2="280.0" stroke="#3fb950" stroke-width="1.1" marker-end="url(#mk1)"/><rect x="48.0" y="202.0" width="130.0" height="44.0" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.2"/><text x="113.0" y="222.0" font-size="10.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">模型输出</text><text x="113.0" y="239.0" font-size="8.5" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">半可信</text><line x1="180.0" y1="224.0" x2="246.0" y2="280.0" stroke="#d29922" stroke-width="1.1" marker-end="url(#mk2)"/><rect x="48.0" y="264.0" width="130.0" height="44.0" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.2"/><text x="113.0" y="284.0" font-size="10.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">工具输出</text><text x="113.0" y="301.0" font-size="8.5" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">不可信</text><line x1="180.0" y1="286.0" x2="246.0" y2="280.0" stroke="#f85149" stroke-width="1.1" marker-end="url(#mk3)"/><rect x="248.0" y="252.0" width="124.0" height="60.0" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.3"/><text x="310.0" y="286.0" font-size="11.5" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">同一个渲染面</text><text x="310.0" y="306.0" font-size="9" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">不做任何区分</text><text x="48.0" y="340.0" font-size="9.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">样式和内容混在同一条字符串流里，</text><text x="48.0" y="357.0" font-size="9.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">分不清哪个 ESC 是自己人——</text><text x="48.0" y="374.0" font-size="9.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">四家引擎全部没有内容清洗</text><rect x="408.0" y="92.0" width="484.0" height="318.0" rx="10" fill="none" stroke="#3fb950" stroke-width="1.2" stroke-dasharray="6 5"/><text x="420.0" y="112.0" font-size="12" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">方案：结构化分离 · 三层防线</text><rect x="428.0" y="132.0" width="444.0" height="80.0" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.3"/><text x="444.0" y="156.0" font-size="12" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">转义层</text><text x="444.0" y="180.0" font-size="9.5" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">不可信文本进入行数组前，CSI/OSC 全部剥除</text><text x="444.0" y="200.0" font-size="9.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">或可见地转义成 ␛[A，零容忍</text><rect x="428.0" y="224.0" width="444.0" height="80.0" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.3"/><text x="444.0" y="248.0" font-size="12" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">溯源层</text><text x="444.0" y="272.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">三种信任级别视觉分区：折叠框、边框、颜色语义</text><text x="444.0" y="292.0" font-size="9.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">确认框只渲染结构化字段，不渲染自由文本</text><rect x="428.0" y="316.0" width="444.0" height="80.0" rx="8" fill="#161b22" stroke="#bc8cff" stroke-width="1.3"/><text x="444.0" y="340.0" font-size="12" fill="#bc8cff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">变更层</text><text x="444.0" y="364.0" font-size="9.5" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">批准时记描述 hash，变了重新询问</text><text x="444.0" y="384.0" font-size="9.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">防 rug pull</text><text x="460.0" y="444.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">浏览器九十年代为同样的问题发明了同源策略与 HTML 转义；转义发生在投影边界，而不是在 ANSI 字符串里做外科手术。</text></svg>