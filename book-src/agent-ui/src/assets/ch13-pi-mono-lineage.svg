<svg xmlns="http://www.w3.org/2000/svg" width="940" height="450" viewBox="0 0 940 450"><defs><marker id="mk1" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#bc8cff"/></marker></defs><rect x="0.0" y="0.0" width="940.0" height="450.0" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="28.0" y="38.0" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">三个头部公司，同一个上游</text><line x1="28" y1="52" x2="912" y2="52" stroke="#30363d" stroke-width="1"/><rect x="270.0" y="78.0" width="400.0" height="84.0" rx="8" fill="#161b22" stroke="#bc8cff" stroke-width="1.8"/><text x="470.0" y="108.0" font-size="16" fill="#bc8cff" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="700">pi-mono</text><text x="470.0" y="130.0" font-size="10.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">Mario Zechner 的个人 monorepo</text><text x="470.0" y="150.0" font-size="8.5" fill="#8b949e" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="400">pi-tui · pi-agent-core · packages/ai（900+ 模型目录）· pi-coding-agent</text><path d="M380,162 C300,200 220,206 175,228" fill="none" stroke="#bc8cff" stroke-width="1.6" marker-end="url(#mk1)"/><path d="M470,162 L470,228" fill="none" stroke="#bc8cff" stroke-width="1.6" marker-end="url(#mk1)"/><path d="M560,162 C640,180 690,178 720,192" fill="none" stroke="#bc8cff" stroke-width="1.6" marker-end="url(#mk1)"/><rect x="676.0" y="190.0" width="112.0" height="30.0" rx="8" fill="#0d1117" stroke="#bc8cff" stroke-width="1.2"/><text x="732.0" y="210.0" font-size="10" fill="#bc8cff" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="400">oh-my-pi</text><path d="M732,220 L765,228" fill="none" stroke="#bc8cff" stroke-width="1.6" marker-end="url(#mk1)"/><rect x="236.0" y="181.0" width="92.6" height="20.0" rx="10" fill="#bc8cff" opacity="0.14"/><rect x="236.0" y="181.0" width="92.6" height="20.0" rx="10" fill="none" stroke="#bc8cff" stroke-width="1"/><text x="244.0" y="192.0" font-size="9.5" fill="#bc8cff" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">vendored fork</text><rect x="414.0" y="181.0" width="36.0" height="20.0" rx="10" fill="#bc8cff" opacity="0.14"/><rect x="414.0" y="181.0" width="36.0" height="20.0" rx="10" fill="none" stroke="#bc8cff" stroke-width="1"/><text x="422.0" y="192.0" font-size="9.5" fill="#bc8cff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">打包</text><rect x="600.0" y="161.0" width="62.2" height="20.0" rx="10" fill="#bc8cff" opacity="0.14"/><rect x="600.0" y="161.0" width="62.2" height="20.0" rx="10" fill="none" stroke="#bc8cff" stroke-width="1"/><text x="608.0" y="172.0" font-size="9.5" fill="#bc8cff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">Swift 移植</text><rect x="40.0" y="230.0" width="270.0" height="150.0" rx="8" fill="#161b22" stroke="#bc8cff" stroke-width="1.4"/><text x="56.0" y="258.0" font-size="14" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="700">kimi-code</text><text x="150.0" y="258.0" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">（月之暗面）</text><text x="56.0" y="286.0" font-size="10.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">8 条分歧 + 守护测试</text><text x="56.0" y="304.0" font-size="10.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">每次同步逐条重验</text><text x="56.0" y="322.0" font-size="10.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400"></text><text x="56.0" y="340.0" font-size="10.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">分歧里 2 条是 CJK 修复</text><rect x="335.0" y="230.0" width="270.0" height="168.0" rx="8" fill="#161b22" stroke="#bc8cff" stroke-width="1.4"/><text x="351.0" y="258.0" font-size="14" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="700">mcode</text><text x="410.0" y="258.0" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">（MiniMax）</text><text x="351.0" y="286.0" font-size="10.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">bundle 出厂；证据（cli.js）：</text><text x="351.0" y="312.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">pi-agent 出现 37 次</text><text x="351.0" y="330.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">@mariozechner 4 次</text><text x="351.0" y="348.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">kimi 加的 previousRawLines 0 次</text><text x="351.0" y="366.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">（反证：用的是上游原版老快照）</text><rect x="630.0" y="230.0" width="270.0" height="150.0" rx="8" fill="#161b22" stroke="#bc8cff" stroke-width="1.4"/><text x="646.0" y="258.0" font-size="14" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="700">kwwk</text><text x="646.0" y="286.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">KWWKAgent 逐文件镜像 pi-agent-core</text><text x="646.0" y="304.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">（注释即供词）</text><text x="646.0" y="322.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">ModelsCatalog 由上游模型目录生成</text><text x="470.0" y="434.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">第 11 篇对照表里的五个样本，三个共享这个上游——「行业共识」的三个数据点，投的可能是同一张票。</text></svg>