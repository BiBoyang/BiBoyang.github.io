<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520"><defs></defs><rect x="0.0" y="0.0" width="960.0" height="520.0" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="28.0" y="38.0" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">一条消息的生命线：六个站点，同一个问题</text><line x1="28" y1="52" x2="932" y2="52" stroke="#30363d" stroke-width="1"/><line x1="50.0" y1="268.0" x2="910.0" y2="268.0" stroke="#8b949e" stroke-width="1.6"/><circle cx="78.0" cy="268.0" r="9.0" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/><text x="78.0" y="272.0" font-size="9" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">1</text><rect x="14.0" y="128.0" width="128.0" height="126.0" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.3"/><text x="78.0" y="154.0" font-size="9" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">用户在这里断掉</text><text x="78.0" y="176.0" font-size="10" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">输入中就切走</text><text x="78.0" y="198.0" font-size="8.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">打了 200 字，</text><text x="78.0" y="212.0" font-size="8.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">微信弹窗 / 持续写</text><rect x="14.0" y="290.0" width="128.0" height="128.0" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.3"/><text x="78.0" y="312.0" font-size="9" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">对策</text><text x="78.0" y="332.0" font-size="9" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">草稿每次变化就落盘</text><text x="78.0" y="352.0" font-size="8" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">1 秒防抖，最多丢 1 秒</text><text x="78.0" y="365.0" font-size="8" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">自觉的交易</text><circle cx="221.0" cy="268.0" r="9.0" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/><text x="221.0" y="272.0" font-size="9" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">2</text><rect x="157.0" y="128.0" width="128.0" height="126.0" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.3"/><text x="221.0" y="154.0" font-size="9" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">用户在这里断掉</text><text x="221.0" y="176.0" font-size="10" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">按下发送瞬间切走</text><text x="221.0" y="198.0" font-size="8.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">消息到底</text><text x="221.0" y="212.0" font-size="8.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">发出去没有</text><rect x="157.0" y="290.0" width="128.0" height="128.0" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.3"/><text x="221.0" y="312.0" font-size="9" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">对策</text><text x="221.0" y="332.0" font-size="9" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">发件箱模式</text><text x="221.0" y="352.0" font-size="8" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">本地事务先于网络事务</text><text x="221.0" y="365.0" font-size="8" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">+ 幂等 request id</text><text x="221.0" y="378.0" font-size="8" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">宽限期只用于清空发件箱</text><circle cx="364.0" cy="268.0" r="9.0" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/><text x="364.0" y="272.0" font-size="9" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">3</text><rect x="300.0" y="128.0" width="128.0" height="126.0" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.3"/><text x="364.0" y="154.0" font-size="9" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">用户在这里断掉</text><text x="364.0" y="176.0" font-size="10" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">发出还没开始流式</text><text x="364.0" y="198.0" font-size="8.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">在排队或预处理</text><rect x="300.0" y="290.0" width="128.0" height="128.0" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.3"/><text x="364.0" y="312.0" font-size="9" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">对策</text><text x="364.0" y="332.0" font-size="9" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="400">服务端 ack</text><text x="364.0" y="346.0" font-size="9" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">必须落过盘</text><text x="364.0" y="366.0" font-size="8" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">硬前提：ack 落盘后</text><text x="364.0" y="379.0" font-size="8" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">完整性责任移交服务端</text><circle cx="507.0" cy="268.0" r="9.0" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/><text x="507.0" y="272.0" font-size="9" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">4</text><rect x="443.0" y="128.0" width="128.0" height="126.0" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.3"/><text x="507.0" y="154.0" font-size="9" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">用户在这里断掉</text><text x="507.0" y="176.0" font-size="10" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">流式到一半切走</text><text x="507.0" y="198.0" font-size="8.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">看着半个表格</text><text x="507.0" y="212.0" font-size="8.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">进电梯</text><rect x="443.0" y="290.0" width="128.0" height="128.0" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.3"/><text x="507.0" y="312.0" font-size="9" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">对策</text><text x="507.0" y="332.0" font-size="9" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">客户端只欠一个游标</text><text x="507.0" y="352.0" font-size="8" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">确定事件，当日程处理</text><text x="507.0" y="365.0" font-size="8" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">记住最后收到的事件位置</text><circle cx="650.0" cy="268.0" r="9.0" fill="#0d1117" stroke="#d29922" stroke-width="2"/><text x="650.0" y="272.0" font-size="9" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">5</text><rect x="586.0" y="128.0" width="128.0" height="126.0" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.8"/><rect x="586.0" y="128.0" width="128.0" height="126.0" rx="8" fill="#d29922" opacity="0.08"/><text x="650.0" y="154.0" font-size="9" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">用户在这里断掉</text><text x="650.0" y="176.0" font-size="10" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">流式中回来看</text><text x="650.0" y="198.0" font-size="8.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">可能过了三分钟</text><text x="650.0" y="212.0" font-size="8.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">也可能三小时</text><rect x="606.0" y="229.0" width="60.6" height="18.0" rx="10" fill="#d29922" opacity="0.14"/><rect x="606.0" y="229.0" width="60.6" height="18.0" rx="10" fill="none" stroke="#d29922" stroke-width="1"/><text x="614.0" y="238.0" font-size="8.5" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">最痛的一站</text><rect x="586.0" y="290.0" width="128.0" height="128.0" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.3"/><text x="650.0" y="312.0" font-size="9" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">对策</text><text x="650.0" y="332.0" font-size="9" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">追平 = 快照</text><text x="650.0" y="346.0" font-size="9" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">+ 尾部增量</text><text x="650.0" y="366.0" font-size="8" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">最痛的一站：</text><text x="650.0" y="379.0" font-size="8" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">落后 vs 最新的事实</text><text x="650.0" y="392.0" font-size="8" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">弱网下降级背压</text><circle cx="793.0" cy="268.0" r="9.0" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/><text x="793.0" y="272.0" font-size="9" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">6</text><rect x="729.0" y="128.0" width="128.0" height="126.0" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.3"/><text x="793.0" y="154.0" font-size="9" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">用户在这里断掉</text><text x="793.0" y="176.0" font-size="10" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">完成之后回看</text><text x="793.0" y="198.0" font-size="8.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">读到的是档案</text><text x="793.0" y="212.0" font-size="8.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">而不是直播</text><rect x="729.0" y="290.0" width="128.0" height="128.0" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.3"/><text x="793.0" y="312.0" font-size="9" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">对策</text><text x="793.0" y="332.0" font-size="9" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">几乎是免费的</text><text x="793.0" y="352.0" font-size="8" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">档案读取</text><text x="793.0" y="365.0" font-size="8" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">不再依赖直播连接</text><text x="480.0" y="504.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">把「必须记住的事」从连接和进程里搬出来，搬进比它们活得久的东西。</text></svg>