<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460">
<defs>

</defs>
<rect x="0" y="0" width="960" height="460" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<text x="28" y="38" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">零误判，也撑不起太小的样本</text>
<line x1="28" y1="52" x2="932" y2="52" stroke="#30363d" stroke-width="1"/>
<line x1="120" y1="380.0" x2="640" y2="380.0" stroke="#30363d" stroke-width="1" stroke-dasharray="3 4"/>
<text x="110" y="384.0" font-size="10.5" fill="#8b949e" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="end" font-weight="400">0%</text>
<line x1="120" y1="307.5" x2="640" y2="307.5" stroke="#30363d" stroke-width="1" stroke-dasharray="3 4"/>
<text x="110" y="311.5" font-size="10.5" fill="#8b949e" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="end" font-weight="400">5%</text>
<line x1="120" y1="235.0" x2="640" y2="235.0" stroke="#30363d" stroke-width="1" stroke-dasharray="3 4"/>
<text x="110" y="239.0" font-size="10.5" fill="#8b949e" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="end" font-weight="400">10%</text>
<line x1="120" y1="162.5" x2="640" y2="162.5" stroke="#30363d" stroke-width="1" stroke-dasharray="3 4"/>
<text x="110" y="166.5" font-size="10.5" fill="#8b949e" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="end" font-weight="400">15%</text>
<line x1="120" y1="90.0" x2="640" y2="90.0" stroke="#30363d" stroke-width="1" stroke-dasharray="3 4"/>
<text x="110" y="94.0" font-size="10.5" fill="#8b949e" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="end" font-weight="400">20%</text>
<line x1="120" y1="380" x2="640" y2="380" stroke="#6e7681" stroke-width="1.2"/>
<rect x="160" y="108.125" width="70" height="271.875" rx="3" fill="#f85149" fill-opacity="0.3" stroke="#f85149" stroke-width="1"/>
<text x="195.0" y="100.125" font-size="12" fill="#f85149" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="700">18.8%</text>
<text x="195.0" y="402" font-size="11.5" fill="#c9d1d9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="400">n = 16</text>
<rect x="280" y="162.5" width="70" height="217.5" rx="3" fill="#f85149" fill-opacity="0.3" stroke="#f85149" stroke-width="1"/>
<text x="315.0" y="154.5" font-size="12" fill="#f85149" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="700">15%</text>
<text x="315.0" y="402" font-size="11.5" fill="#c9d1d9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="400">n = 20</text>
<rect x="400" y="235.0" width="70" height="145.0" rx="3" fill="#3fb950" fill-opacity="0.3" stroke="#3fb950" stroke-width="1"/>
<text x="435.0" y="227.0" font-size="12" fill="#3fb950" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="700">10%</text>
<text x="435.0" y="402" font-size="11.5" fill="#c9d1d9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="400">n = 30</text>
<rect x="520" y="307.5" width="70" height="72.5" rx="3" fill="#3fb950" fill-opacity="0.3" stroke="#3fb950" stroke-width="1"/>
<text x="555.0" y="299.5" font-size="12" fill="#3fb950" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="700">5%</text>
<text x="555.0" y="402" font-size="11.5" fill="#c9d1d9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="400">n = 60</text>
<line x1="120" y1="235.0" x2="640" y2="235.0" stroke="#d29922" stroke-width="1.4" stroke-dasharray="7 4"/>
<text x="636" y="228.0" font-size="11" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="700">想说误判率低于 10%</text>
<text x="120" y="426" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">柱高：n 条好样本上一次误判都没有时，误判率的 95% 置信上界</text>
<rect x="700" y="100" width="232" height="210" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
<text x="718" y="128" font-size="13.5" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">三的法则</text>
<text x="718" y="160" font-size="15" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="700">上界 ≈ 3 / n</text>
<text x="718" y="192" font-size="11.5" fill="#c9d1d9" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">16 条全对，上界仍有 18.8%</text>
<text x="718" y="213" font-size="11.5" fill="#c9d1d9" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">想说低于 10%，</text>
<text x="718" y="234" font-size="11.5" fill="#c9d1d9" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">至少要 30 条全对</text>
<text x="718" y="255" font-size="11.5" fill="#c9d1d9" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">门槛写成区间，</text>
<text x="718" y="276" font-size="11.5" fill="#c9d1d9" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">报告里写明样本量</text>
<text x="700" y="446" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">上界由作者按公式计算</text>
</svg>
