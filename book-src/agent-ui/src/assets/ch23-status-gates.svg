<svg xmlns="http://www.w3.org/2000/svg" width="940" height="460" viewBox="0 0 940 460"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#8b949e"/></marker></defs><rect x="0" y="0" width="940" height="460" fill="#0d1117" rx="12" stroke="#30363d" stroke-width="1"/><text x="28" y="38" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="700">状态行的防闪烁三闸门</text><line x1="28" y1="52" x2="912" y2="52" stroke="#30363d" stroke-width="1"/><text x="40" y="84" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">状态指示器属于整个 turn；流式内容与状态行互斥</text><rect x="40" y="108" width="560" height="88" fill="#161b22" rx="10" stroke="#58a6ff" stroke-width="1"/><text x="64" y="138" font-size="12.5" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">闸门一 · 放行即隐藏</text><text x="64" y="160" font-size="11" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">commit tick 放行内容 → 立即隐藏状态行</text><text x="64" y="180" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">一帧里不许既有新内容又有“正在工作”</text><rect x="40" y="212" width="560" height="88" fill="#161b22" rx="10" stroke="#d2a8ff" stroke-width="1"/><text x="64" y="242" font-size="12.5" fill="#d2a8ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">闸门二 · 恢复看空闲</text><text x="64" y="264" font-size="11" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">前言结束 → 置“待恢复”标记</text><text x="64" y="284" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">turn 在运行 且 两个流队列全 idle 才恢复</text><rect x="40" y="316" width="560" height="88" fill="#161b22" rx="10" stroke="#ffa657" stroke-width="1"/><text x="64" y="346" font-size="12.5" fill="#ffa657" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">闸门三 · 收尾看队列</text><text x="64" y="368" font-size="11" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">最终回答完成 → 查输入队列</text><text x="64" y="388" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">有 steer 排队就不恢复——马上又要忙</text><text x="640" y="160" font-size="12.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">判断标准</text><text x="640" y="186" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">每次显隐都对应用户心智里</text><text x="640" y="206" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">一次真实的状态切换；</text><text x="640" y="226" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">技术正确但感知是噪声的</text><text x="640" y="246" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">显隐，全被闸门吃掉。</text><text x="640" y="300" font-size="11" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">一帧里出现两个状态，</text><text x="640" y="320" font-size="11" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">或一个状态出现两帧，</text><text x="640" y="340" font-size="11" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">都是 bug。</text></svg>