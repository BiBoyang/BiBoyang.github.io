<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#8b949e"/></marker></defs><rect x="0" y="0" width="940" height="470" fill="#0d1117" rx="12" stroke="#30363d" stroke-width="1"/><text x="28" y="38" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="700">把带状态的字节流逐层翻译成可断言的</text><line x1="28" y1="52" x2="912" y2="52" stroke="#30363d" stroke-width="1"/><rect x="40" y="84" width="860" height="72" fill="#161b22" rx="10" stroke="#f85149" stroke-width="1"/><text x="64" y="114" font-size="12.5" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">守护：钉纪律</text><text x="64" y="136" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">guard.rs 扫源码禁标识符；架构退化挂了就算构建失败</text><rect x="80" y="172" width="780" height="72" fill="#161b22" rx="10" stroke="#ffa657" stroke-width="1"/><text x="104" y="202" font-size="12.5" fill="#ffa657" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">等价性：钉不变量</text><text x="104" y="224" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">任意 delta 切分下，「已上屏 + tail」恒等于全量渲染</text><rect x="120" y="260" width="700" height="72" fill="#161b22" rx="10" stroke="#d2a8ff" stroke-width="1"/><text x="144" y="290" font-size="12.5" fill="#d2a8ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">快照：钉形态</text><text x="144" y="312" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">insta 快照库 800+；动态值归一化，只固化结构形状</text><rect x="160" y="348" width="620" height="72" fill="#161b22" rx="10" stroke="#58a6ff" stroke-width="1"/><text x="184" y="378" font-size="12.5" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">字节：钉契约</text><text x="184" y="400" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">VT100 模拟终端接住字节；断言 scrollback 行为</text><text x="470" y="452" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle">一层比一层抽象，一层比一层便宜；守护测试防的不是 bug，是架构退化</text></svg>