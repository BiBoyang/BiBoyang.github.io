<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440"><defs><marker id="mk1" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#8b949e"/></marker></defs><rect x="0.0" y="0.0" width="900.0" height="440.0" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="28.0" y="38.0" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">一个 vendored fork，两个渲染器</text><line x1="28" y1="52" x2="872" y2="52" stroke="#30363d" stroke-width="1"/><text x="450.0" y="80.0" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">同一棵组件树、同一份组件代码，运行时二选一——前所未有的对照机会</text><rect x="310.0" y="96.0" width="280.0" height="64.0" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.3"/><text x="450.0" y="124.0" font-size="14" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="700">TuiBase</text><text x="450.0" y="146.0" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">共享组件树 · overlay 合成 · 光标提取</text><line x1="450.0" y1="162.0" x2="450.0" y2="190.0" stroke="#8b949e" stroke-width="1.5" marker-end="url(#mk1)"/><rect x="360.0" y="192.0" width="180.0" height="44.0" rx="8" fill="#161b22"/><text x="450.0" y="220.0" font-size="12" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">TUI（接口）</text><rect x="330.0" y="244.0" width="240.0" height="46.0" rx="8" fill="#0d1117" stroke="#d29922" stroke-width="1"/><text x="450.0" y="263.0" font-size="9.5" fill="#d29922" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="400">KIMI_CODE_TUI_FULL_SCREEN === &#x27;1&#x27;</text><text x="450.0" y="281.0" font-size="8.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">（后升格为正式配置项 tuiMode）</text><path d="M450,290 L450,312 L250,312 L250,330" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#mk1)"/><path d="M450,290 L450,312 L650,312 L650,330" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#mk1)"/><rect x="70.0" y="332.0" width="360.0" height="84.0" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.6"/><text x="250.0" y="362.0" font-size="14" fill="#58a6ff" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="700">TuiMainScreen</text><rect x="330.0" y="345.0" width="77.7" height="20.0" rx="10" fill="#58a6ff" opacity="0.14"/><rect x="330.0" y="345.0" width="77.7" height="20.0" rx="10" fill="none" stroke="#58a6ff" stroke-width="1"/><text x="338.0" y="356.0" font-size="9.5" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">629 行 · 默认</text><text x="250.0" y="388.0" font-size="10.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">渲染进主屏 + scrollback</text><text x="250.0" y="408.0" font-size="10.5" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">inline 派 · 差分变种</text><rect x="470.0" y="332.0" width="360.0" height="84.0" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.6"/><text x="650.0" y="362.0" font-size="14" fill="#3fb950" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="700">TuiAltScreen</text><rect x="730.0" y="345.0" width="83.2" height="20.0" rx="10" fill="#3fb950" opacity="0.14"/><rect x="730.0" y="345.0" width="83.2" height="20.0" rx="10" fill="none" stroke="#3fb950" stroke-width="1"/><text x="738.0" y="356.0" font-size="9.5" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">1302 行 · 实验</text><text x="650.0" y="388.0" font-size="10.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">alt screen 全屏，应用自管视口</text><text x="650.0" y="408.0" font-size="10.5" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">全屏自管派 · 工业级形态</text><text x="450.0" y="424.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">分界线在同一个 if 的两个分支里。</text></svg>