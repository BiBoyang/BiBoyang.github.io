-serif" text-anchor="middle" font-weight="400">引擎（像素+数据）</text><rect x="370.0" y="198.0" width="178.0" height="68.0" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1"/><text x="459.0" y="236.0" font-size="10" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">无结算，持续记账</text><rect x="556.0" y="198.0" width="178.0" height="68.0" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1"/><text x="645.0" y="236.0" font-size="10" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">无干净归档</text><rect x="742.0" y="198.0" width="178.0" height="68.0" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1"/><text x="831.0" y="236.0" font-size="10" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">无</text><text x="40.0" y="312.0" font-size="11.5" fill="#bc8cff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">终端混合（第 14 篇）</text><rect x="184.0" y="274.0" width="178.0" height="68.0" rx="6" fill="#161b22" stroke="#bc8cff" stroke-width="1"/><text x="273.0" y="304.0" font-size="10" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="400">稳定行→scrollback</text><text x="273.0" y="320.0" font-size="10" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">未稳定→引擎</text><rect x="370.0" y="274.0" width="178.0" height="68.0" rx="6" fill="#161b22" stroke="#bc8cff" stroke-width="1"/><text x="459.0" y="304.0" font-size="10" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">行级：</text><text x="459.0" y="320.0" font-size="10" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">认证稳定即归还</text><rect x="556.0" y="274.0" width="178.0" height="68.0" rx="6" fill="#161b22" stroke="#bc8cff" stroke-width="1"/><text x="645.0" y="312.0" font-size="10" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="400">已在 scrollback</text><rect x="742.0" y="274.0" width="178.0" height="68.0" rx="6" fill="#161b22" stroke="#bc8cff" stroke-width="1"/><text x="831.0" y="312.0" font-size="10" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="400">scrollback（部分）</text><rect x="28.0" y="346.0" width="896.0" height="76.0" rx="8" fill="#d29922" opacity="0.08"/><text x="40.0" y="388.0" font-size="11.5" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">移动 GUI（本篇）</text><rect x="184.0" y="350.0" width="178.0" height="68.0" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1"/><text x="273.0" y="380.0" font-size="10" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">数据库（数据）</text><text x="273.0" y="396.0" font-size="10" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">像素仅租借</text><rect x="370.0" y="350.0" width="178.0" height="68.0" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1"/><text x="459.0" y="388.0" font-size="10" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">生命周期节点落盘</text><rect x="556.0" y="350.0" width="178.0" height="68.0" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1"/><text x="645.0" y="388.0" font-size="10" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">磁盘是唯一长寿介质</text><rect x="742.0" y="350.0" width="178.0" height="68.0" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1"/><text x="831.0" y="380.0" font-size="10" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">无——</text><text x="831.0" y="396.0" font-size="10" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="400">UIKit 回收还收费</text><text x="480.0" y="464.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">终端之争争的是「要不要替介质记账」；GUI 的题目直接写在数据层——什么算定型、什么时候落盘、被杀时账本完不完整。</text></svg>