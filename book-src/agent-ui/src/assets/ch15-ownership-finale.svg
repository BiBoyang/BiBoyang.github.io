<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480"><defs></defs><rect x="0.0" y="0.0" width="960.0" height="480.0" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="28.0" y="38.0" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">渲染所有权的尽头是数据所有权</text><line x1="28" y1="52" x2="932" y2="52" stroke="#30363d" stroke-width="1"/><text x="40.0" y="108.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">路线</text><text x="273.0" y="108.0" font-size="11.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">历史存于</text><text x="459.0" y="108.0" font-size="11.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">结算时机</text><text x="645.0" y="108.0" font-size="11.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">退出或被杀时</text><text x="831.0" y="108.0" font-size="11.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">免费基础设施</text><line x1="28.0" y1="120.0" x2="924.0" y2="120.0" stroke="#30363d" stroke-width="1"/><text x="40.0" y="160.0" font-size="11.5" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">终端 inline 派</text><rect x="184.0" y="122.0" width="178.0" height="68.0" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1"/><text x="273.0" y="152.0" font-size="10" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anc