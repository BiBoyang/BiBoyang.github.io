<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560">
  <rect x="0" y="0" width="940" height="560" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="28" y="38" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">故障注入三件套——让静默没有藏身之处</text>
  <line x1="28" y1="52" x2="912" y2="52" stroke="#30363d" stroke-width="1"/>

  <!-- Panel 1 -->
  <rect x="28" y="72" width="284" height="396" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.6"/>
  <text x="170" y="100" font-size="12.5" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">① 杀掉对端</text>
  <text x="170" y="120" font-size="9" fill="#8b949e" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">kill daemon，启动 TUI</text>
  <line x1="48" y1="134" x2="292" y2="134" stroke="#30363d" stroke-width="1"/>
  <text x="48" y="156" font-size="9.5" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">断言</text>
  <text x="48" y="176" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">存在用户可见的信号</text>
  <text x="48" y="194" font-size="8.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">——是界面里的一行，不是 debug 日志</text>
  <text x="48" y="220" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">线程列表与 daemon 存储对账一致</text>
  <text x="48" y="238" font-size="8.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">——降级之后，昨天的线程还在</text>
  <line x1="48" y1="258" x2="292" y2="258" stroke="#30363d" stroke-width="1"/>
  <text x="48" y="280" font-size="9.5" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">漏检形态</text>
  <text x="48" y="300" font-size="9.5" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">界面一切正常，历史悄悄少一块</text>
  <text x="48" y="318" font-size="8.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">state_db 被重初始化，对账直接对不上</text>
  <text x="48" y="336" font-size="8.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">（今天的 Codex 会在第二条上红）</text>

  <!-- Panel 2 -->
  <rect x="328" y="72" width="284" height="396" rx="8" fill="#161b22" stroke="#bc8cff" stroke-width="1.6"/>
  <text x="470" y="100" font-size="12.5" fill="#bc8cff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">② 病态对端</text>
  <text x="470" y="120" font-size="9" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle">连不上是善良的；连得上但不对劲才阴险</text>
  <line x1="348" y1="134" x2="592" y2="134" stroke="#30363d" stroke-width="1"/>
  <text x="348" y="156" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">握手卡住 · 永不关闭 · 只发 keepalive</text>
  <text x="348" y="174" font-size="8.5" fill="#8b949e" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start">WebSocketTestServer / StreamingSseServer</text>
  <text x="348" y="190" font-size="8.5" fill="#8b949e" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start">逐 chunk oneshot 门控</text>
  <text x="348" y="216" font-size="9.5" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">断言</text>
  <text x="348" y="236" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">UI 显示「等待」，不显示「在工作」</text>
  <text x="348" y="256" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">故障归类：连接死 / 静默 / 主动打断</text>
  <text x="348" y="274" font-size="8.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">三个世界必须产出三句不同的文案</text>
  <line x1="348" y1="294" x2="592" y2="294" stroke="#30363d" stroke-width="1"/>
  <text x="348" y="316" font-size="9.5" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">漏检形态</text>
  <text x="348" y="336" font-size="9.5" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">keepalive 是传输层的心跳，</text>
  <text x="348" y="354" font-size="9.5" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">不是进展层的心跳</text>
  <text x="348" y="374" font-size="8.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">——比断连的静默更难发现，</text>
  <text x="348" y="390" font-size="8.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">因为它看起来那么像活着</text>

  <!-- Panel 3 -->
  <rect x="628" y="72" width="284" height="396" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.6"/>
  <text x="770" y="100" font-size="12.5" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">③ 状态可达性</text>
  <text x="770" y="120" font-size="9" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle">降级/切换发生后，回读旧存储</text>
  <line x1="648" y1="134" x2="892" y2="134" stroke="#30363d" stroke-width="1"/>
  <text x="648" y="156" font-size="9.5" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">断言</text>
  <text x="648" y="176" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">昨天的线程今天在列表里</text>
  <text x="648" y="196" font-size="8.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">——断言方向是「旧世界遗产还在」</text>
  <text x="648" y="220" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">不测「新存储能写」</text>
  <text x="648" y="238" font-size="8.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">——那个断言永远绿，什么都不证明</text>
  <line x1="648" y1="258" x2="892" y2="258" stroke="#30363d" stroke-width="1"/>
  <text x="648" y="280" font-size="9.5" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">漏检形态</text>
  <text x="648" y="300" font-size="9.5" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">换了一间空房子，</text>
  <text x="648" y="318" font-size="9.5" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">功能测试一条都不红</text>
  <text x="648" y="338" font-size="8.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">——只有对账抓得住它</text>

  <rect x="28" y="496" width="884" height="34" rx="8" fill="#d29922" opacity="0.12"/>
  <rect x="28" y="496" width="884" height="34" rx="8" fill="none" stroke="#d29922" stroke-width="1.4"/>
  <text x="470" y="518" font-size="12" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">杀掉一个进程，就知道你的界面有没有能力诚实。</text>
</svg>
