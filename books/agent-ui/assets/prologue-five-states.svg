<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380"><defs><marker id="mk1" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#8b949e"/></marker><marker id="mk2" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#3fb950"/></marker></defs><rect x="0.0" y="0.0" width="900.0" height="380.0" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="28.0" y="38.0" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">complete 不是默认值，是兜底</text><line x1="28" y1="52" x2="872" y2="52" stroke="#30363d" stroke-width="1"/><text x="30.0" y="108.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">多数实现的防御只覆盖第一层，后三层全是裸的</text><rect x="30.0" y="140.0" width="150.0" height="120.0" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.3"/><text x="105.0" y="192.0" font-size="12.5" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="700">transport_error</text><text x="105.0" y="240.0" font-size="11.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">连接层</text><line x1="182.0" y1="200.0" x2="192.0" y2="200.0" stroke="#8b949e" stroke-width="1.6" marker-end="url(#mk1)"/><rect x="194.0" y="140.0" width="150.0" height="120.0" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.3"/><text x="269.0" y="192.0" font-size="12.5" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="700">no_end_marker</text><text x="269.0" y="240.0" font-size="11.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">流层</text><line x1="346.0" y1="200.0" x2="356.0" y2="200.0" stroke="#8b949e" stroke-width="1.6" marker-end="url(#mk1)"/><rect x="358.0" y="140.0" width="150.0" height="120.0" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.3"/><text x="433.0" y="192.0" font-size="12.5" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="700">buffer_residual</text><text x="433.0" y="240.0" font-size="11.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">事件层</text><line x1="510.0" y1="200.0" x2="520.0" y2="200.0" stroke="#8b949e" stroke-width="1.6" marker-end="url(#mk1)"/><rect x="522.0" y="140.0" width="150.0" height="120.0" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.3"/><text x="597.0" y="192.0" font-size="12.5" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="700">missing_finish</text><text x="597.0" y="210.0" font-size="12.5" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="700">_reason</text><text x="597.0" y="240.0" font-size="11.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">信号层</text><rect x="686.0" y="128.0" width="184.0" height="144.0" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.8"/><line x1="674.0" y1="200.0" x2="684.0" y2="200.0" stroke="#3fb950" stroke-width="1.8" marker-end="url(#mk2)"/><text x="778.0" y="196.0" font-size="18" fill="#3fb950" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="700">complete</text><text x="778.0" y="226.0" font-size="11" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">以上全部排除，才轮到我</text><text x="778.0" y="244.0" font-size="11" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">兜底，非默认</text><text x="450.0" y="364.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">「没证据说坏了」不等于「证据说没坏」——结束是一个需要证明的事件。</text></svg>