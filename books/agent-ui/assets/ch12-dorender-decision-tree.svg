<svg xmlns="http://www.w3.org/2000/svg" width="900" height="556" viewBox="0 0 900 556"><defs><marker id="mk1" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#8b949e"/></marker><marker id="mk2" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#f85149"/></marker><marker id="mk3" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#d29922"/></marker><marker id="mk4" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#3fb950"/></marker></defs><rect x="0.0" y="0.0" width="900.0" height="556.0" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="28.0" y="38.0" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">doRender()：一串快速失败路径</text><line x1="28" y1="52" x2="872" y2="52" stroke="#30363d" stroke-width="1"/><rect x="230.0" y="72.0" width="440.0" height="44.0" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.2"/><text x="450.0" y="99.0" font-size="11" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="400">每帧：整棵树渲染成 newLines，与 previousLines 比较</text><path d="M450,116 L450,128 L20,128" fill="none" stroke="#8b949e" stroke-width="1.3"/><line x1="20.0" y1="128.0" x2="20.0" y2="440.0" stroke="#8b949e" stroke-width="1.3"/><line x1="20.0" y1="160.0" x2="38.0" y2="160.0" stroke="#8b949e" stroke-width="1.1" marker-end="url(#mk1)"/><rect x="40.0" y="140.0" width="280.0" height="40.0" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.2"/><circle cx="62.0" cy="160.0" r="10.0" fill="#f85149"/><text x="62.0" y="163.6" font-size="10" fill="#0d1117" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">1</text><text x="82.0" y="165.0" font-size="11" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">首帧？</text><line x1="322.0" y1="160.0" x2="356.0" y2="160.0" stroke="#f85149" stroke-width="1.3" marker-end="url(#mk2)"/><rect x="358.0" y="140.0" width="410.0" height="40.0" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1"/><text x="370.0" y="165.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">fullRender(false)：不清屏直接写（假设屏幕干净）</text><line x1="20.0" y1="216.0" x2="38.0" y2="216.0" stroke="#8b949e" stroke-width="1.1" marker-end="url(#mk1)"/><rect x="40.0" y="196.0" width="280.0" height="40.0" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.2"/><circle cx="62.0" cy="216.0" r="10.0" fill="#f85149"/><text x="62.0" y="219.6" font-size="10" fill="#0d1117" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">2</text><text x="82.0" y="221.0" font-size="11" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">宽度变化？</text><line x1="322.0" y1="216.0" x2="356.0" y2="216.0" stroke="#f85149" stroke-width="1.3" marker-end="url(#mk2)"/><rect x="358.0" y="196.0" width="410.0" height="40.0" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1"/><text x="370.0" y="221.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">核平重印（换行全变，没有局部解）</text><line x1="20.0" y1="272.0" x2="38.0" y2="272.0" stroke="#8b949e" stroke-width="1.1" marker-end="url(#mk1)"/><rect x="40.0" y="252.0" width="280.0" height="40.0" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.2"/><circle cx="62.0" cy="272.0" r="10.0" fill="#d29922"/><text x="62.0" y="275.6" font-size="10" fill="#0d1117" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">3</text><text x="82.0" y="277.0" font-size="11" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">高度变化？</text><line x1="322.0" y1="272.0" x2="356.0" y2="272.0" stroke="#d29922" stroke-width="1.3" marker-end="url(#mk3)"/><rect x="358.0" y="252.0" width="410.0" height="40.0" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1"/><text x="370.0" y="270.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">核平——但 Termux 除外</text><text x="370.0" y="284.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">软键盘弹收改高度，每次核平 = 重播整个历史</text><line x1="20.0" y1="328.0" x2="38.0" y2="328.0" stroke="#8b949e" stroke-width="1.1" marker-end="url(#mk1)"/><rect x="40.0" y="308.0" width="280.0" height="40.0" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.2"/><circle cx="62.0" cy="328.0" r="10.0" fill="#f85149"/><text x="62.0" y="331.6" font-size="10" fill="#0d1117" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">4</text><text x="82.0" y="333.0" font-size="11" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">内容收缩到历史峰值以下？</text><line x1="322.0" y1="328.0" x2="356.0" y2="328.0" stroke="#f85149" stroke-width="1.3" marker-end="url(#mk2)"/><rect x="358.0" y="308.0" width="410.0" height="40.0" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1"/><text x="370.0" y="333.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">核平（否则残留空行清不掉）</text><line x1="20.0" y1="384.0" x2="38.0" y2="384.0" stroke="#8b949e" stroke-width="1.1" marker-end="url(#mk1)"/><rect x="40.0" y="364.0" width="280.0" height="40.0" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.2"/><circle cx="62.0" cy="384.0" r="10.0" fill="#3fb950"/><text x="62.0" y="387.6" font-size="10" fill="#0d1117" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">5</text><text x="82.0" y="389.0" font-size="11" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">以上都不命中</text><line x1="322.0" y1="384.0" x2="356.0" y2="384.0" stroke="#3fb950" stroke-width="1.3" marker-end="url(#mk4)"/><rect x="358.0" y="364.0" width="410.0" height="40.0" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1"/><text x="370.0" y="389.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">差分主路：只重绘变化区间（单行变化减少闪烁，如 spinner）</text><line x1="20.0" y1="440.0" x2="38.0" y2="440.0" stroke="#8b949e" stroke-width="1.1" marker-end="url(#mk1)"/><rect x="40.0" y="420.0" width="280.0" height="40.0" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.2"/><circle cx="62.0" cy="440.0" r="10.0" fill="#3fb950"/><text x="62.0" y="443.6" font-size="10" fill="#0d1117" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">6</text><text x="82.0" y="445.0" font-size="11" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">纯追加（流式常态）</text><line x1="322.0" y1="440.0" x2="356.0" y2="440.0" stroke="#3fb950" stroke-width="1.3" marker-end="url(#mk4)"/><rect x="358.0" y="420.0" width="410.0" height="40.0" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1"/><text x="370.0" y="445.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">append 快速路径：光标滚到底直接写</text><rect x="358.0" y="484.0" width="410.0" height="34.0" rx="8" fill="#0d1117" stroke="#bc8cff" stroke-width="1"/><text x="368.0" y="506.0" font-size="9" fill="#bc8cff" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">所有写包在同步输出 \x1b[?2026h/l 里（原子帧，防撕裂）</text><text x="450.0" y="540.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">全量渲染，增量落地——稳态帧只为真正变化的行付处理费。</text></svg>