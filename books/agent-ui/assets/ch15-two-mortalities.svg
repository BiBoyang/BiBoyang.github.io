<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420"><defs><marker id="mk1" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#8b949e"/></marker></defs><rect x="0.0" y="0.0" width="920.0" height="420.0" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="28.0" y="38.0" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">像素与数据：两种速朽，两种不朽</text><line x1="28" y1="52" x2="892" y2="52" stroke="#30363d" stroke-width="1"/><rect x="30.0" y="84.0" width="420.0" height="40.0" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.2"/><text x="240.0" y="110.0" font-size="14" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">终端</text><rect x="490.0" y="84.0" width="420.0" height="40.0" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.2"/><text x="700.0" y="110.0" font-size="14" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="700">GUI</text><rect x="30.0" y="150.0" width="420.0" height="108.0" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.4"/><text x="50.0" y="182.0" font-size="14" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">像素不朽</text><text x="50.0" y="210.0" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">内容发射进 scrollback，终端模拟器</text><text x="50.0" y="228.0" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">替你保管像素直到清屏</text><rect x="30.0" y="272.0" width="420.0" height="108.0" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.4"/><text x="50.0" y="304.0" font-size="14" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">数据易逝</text><text x="50.0" y="332.0" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">引擎内存里的数据模型，</text><text x="50.0" y="350.0" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">进程一退就蒸发</text><rect x="490.0" y="150.0" width="420.0" height="108.0" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.4"/><text x="510.0" y="182.0" font-size="14" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">像素速朽</text><text x="510.0" y="210.0" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">屏幕外 cell 被回收、视图层级随时重建</text><text x="510.0" y="228.0" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">任何一次转场都可能让像素归零</text><rect x="490.0" y="272.0" width="420.0" height="108.0" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.4"/><text x="510.0" y="304.0" font-size="14" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">数据必须不朽</text><text x="510.0" y="332.0" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">没有任何介质替你保管，</text><text x="510.0" y="350.0" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">一条对话不落盘就等于没发生过</text><line x1="454.0" y1="204.0" x2="486.0" y2="204.0" stroke="#8b949e" stroke-width="1.4" marker-end="url(#mk1)" marker-start="url(#mk1)"/><line x1="454.0" y1="326.0" x2="486.0" y2="326.0" stroke="#8b949e" stroke-width="1.4" marker-end="url(#mk1)" marker-start="url(#mk1)"/><text x="470.0" y="240.0" font-size="11" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">精</text><text x="470.0" y="256.0" font-size="11" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">确</text><text x="470.0" y="272.0" font-size="11" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">镜</text><text x="470.0" y="288.0" font-size="11" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">像</text><text x="460.0" y="404.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">「谁继续记账」在 GUI 上被改写成「存到哪、什么时候存」——所有权从像素层下沉到数据层；Event Sourcing 从好架构升级为生存必需。</text></svg>