<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470"><defs><marker id="mk1" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#8b949e"/></marker></defs><rect x="0.0" y="0.0" width="920.0" height="470.0" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="28.0" y="38.0" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">推送是门铃，不是管道</text><line x1="28" y1="52" x2="892" y2="52" stroke="#30363d" stroke-width="1"/><rect x="28.0" y="92.0" width="864.0" height="40.0" rx="8" fill="#d29922" opacity="0.12"/><rect x="28.0" y="92.0" width="864.0" height="40.0" rx="8" fill="none" stroke="#d29922" stroke-width="1.4"/><text x="460.0" y="118.0" font-size="12.5" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">不连接才是常态，连接只是加速器；推送才是唯一常开的通道。</text><rect x="28.0" y="150.0" width="330.0" height="220.0" rx="8" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/><text x="193.0" y="180.0" font-size="11" fill="#bc8cff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">APNs / 厂商推送通道</text><circle cx="193.0" cy="236.0" r="34.0" fill="#0d1117" stroke="#bc8cff" stroke-width="2.2"/><circle cx="193.0" cy="236.0" r="22.0" fill="#bc8cff" opacity="0.25"/><text x="193.0" y="242.0" font-size="18" fill="#bc8cff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">铃</text><text x="193.0" y="292.0" font-size="10.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">只说一句话：「该同步了」</text><text x="48.0" y="312.0" font-size="9" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· payload 数千字节上限</text><text x="48.0" y="327.0" font-size="9" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 不保证顺序、不保证送达</text><text x="48.0" y="342.0" font-size="9" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 静默推送被系统性限流</text><text x="48.0" y="357.0" font-size="9" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">  （低电量更狠）</text><rect x="374.0" y="150.0" width="172.0" height="220.0" rx="8" fill="#0d1117" stroke="#f85149" stroke-width="1.4" stroke-dasharray="5 4"/><text x="460.0" y="182.0" font-size="12" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">反例 ✕</text><text x="460.0" y="214.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">把审批完整上下文</text><text x="460.0" y="230.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">塞进推送 payload</text><line x1="394.0" y1="244.0" x2="526.0" y2="244.0" stroke="#30363d" stroke-width="1"/><text x="392.0" y="270.0" font-size="9" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">在不可靠信道上</text><text x="392.0" y="286.0" font-size="9" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">假装可靠：</text><text x="392.0" y="302.0" font-size="9" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400"></text><text x="392.0" y="318.0" font-size="9" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">用户在地铁里点开</text><text x="392.0" y="334.0" font-size="9" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">一条早已过时的审批</text><line x1="360.0" y1="260.0" x2="372.0" y2="260.0" stroke="#8b949e" stroke-width="1.6" marker-end="url(#mk1)"/><line x1="548.0" y1="260.0" x2="560.0" y2="260.0" stroke="#8b949e" stroke-width="1.6" marker-end="url(#mk1)"/><rect x="562.0" y="150.0" width="330.0" height="220.0" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/><text x="727.0" y="180.0" font-size="11" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">手机亮起后的连接窗口</text><text x="582.0" y="208.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">打开应用那几十秒里才存在的</text><text x="582.0" y="225.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">临时窗口——</text><text x="582.0" y="242.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400"></text><text x="582.0" y="259.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">主动建连，凭游标</text><text x="582.0" y="276.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">从服务端 log 里取内容：</text><text x="582.0" y="293.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400"></text><text x="582.0" y="310.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">内容永远回连接里拿</text><text x="460.0" y="396.0" font-size="10" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">推送负责叫人 → 内容回连接里拿</text><text x="460.0" y="454.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">事件流可以很密，打扰必须很稀——通知也要背压。</text></svg>