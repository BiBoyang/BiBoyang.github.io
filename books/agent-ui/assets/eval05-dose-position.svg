<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520"><rect x="0" y="0" width="920" height="520" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="28" y="38" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">剂量-位置效应：挡不挡路，比伤多重更决定性</text><line x1="28" y1="52" x2="892" y2="52" stroke="#30363d" stroke-width="1"/><text x="104" y="116" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">检出 ↑</text><line x1="100" y1="400" x2="560" y2="400" stroke="#30363d" stroke-width="1.2"/><rect x="170" y="120" width="130" height="280" rx="6" fill="#3fb950" fill-opacity="0.22" stroke="#3fb950" stroke-width="1.5"/><text x="235" y="106" font-size="16" fill="#3fb950" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="700">8 / 8</text><text x="235" y="428" font-size="12" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">挡路的伤</text><rect x="380" y="330" width="130" height="70" rx="6" fill="#f85149" fill-opacity="0.22" stroke="#f85149" stroke-width="1.5"/><text x="445" y="316" font-size="16" fill="#f85149" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="700">2 / 8</text><text x="445" y="428" font-size="12" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">不挡路的伤</text><rect x="600" y="110" width="290" height="290" rx="10" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="6 5"/><text x="620" y="140" font-size="11.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">剂量梯度（同一伤型）</text><rect x="620" y="158" width="120" height="30" rx="5" fill="#3fb950" fill-opacity="0.25" stroke="#3fb950" stroke-width="1"/><text x="680" y="178" font-size="10" fill="#3fb950" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="400">100% 删除</text><rect x="750" y="158" width="120" height="30" rx="5" fill="#21262d" stroke="#30363d" stroke-width="1"/><text x="810" y="178" font-size="10" fill="#6e7681" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="400">截到 85%</text><text x="680" y="206" font-size="9.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">检出高</text><text x="810" y="206" font-size="9.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">检出骤降</text><line x1="620" y1="230" x2="870" y2="230" stroke="#30363d" stroke-width="1"/><text x="620" y="260" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">检出差异主要来自</text><text x="620" y="282" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">「伤在不在路上」，</text><text x="620" y="304" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">而不在剂量本身——</text><text x="620" y="326" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">85% 的剂量档照样</text><text x="620" y="348" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">大面积无声。</text><text x="460" y="486" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">手绘示意，柱高不按精确比例；数字见正文实验表。</text></svg>