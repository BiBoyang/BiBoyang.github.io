<text x="40" y="592" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">写不出预期输出时，就断言「怎么切都相等」——断言关系，而不是断言值。</text>
