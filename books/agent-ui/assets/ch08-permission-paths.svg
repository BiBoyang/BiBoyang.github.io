<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440"><defs><marker id="mk1" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#58a6ff"/></marker><marker id="mk2" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#3fb950"/></marker></defs><rect x="0.0" y="0.0" width="900.0" height="440.0" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="28.0" y="38.0" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">同一个权限请求，两种界面的操作路径</text><line x1="28" y1="52" x2="872" y2="52" stroke="#30363d" stroke-width="1"/><rect x="28.0" y="77.0" width="233.2" height="20.0" rx="10" fill="#58a6ff" opacity="0.14"/><rect x="28.0" y="77.0" width="233.2" height="20.0" rx="10" fill="none" stroke="#58a6ff" stroke-width="1"/><text x="36.0" y="88.0" font-size="11" fill="#58a6ff" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">场景：Agent 请求读取 ~/.ssh/config</text><text x="28.0" y="128.0" font-size="12" fill="#58a6ff" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="700">TUI</text><rect x="96.0" y="108.0" width="200.0" height="52.0" rx="8" fill="#161b22"/><text x="196.0" y="140.0" font-size="11.5" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="400">一行 [y/n] 提示</text><line x1="298.0" y1="134.0" x2="342.0" y2="134.0" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#mk1)"/><rect x="346.0" y="108.0" width="200.0" height="52.0" rx="8" fill="#161b22"/><text x="446.0" y="140.0" font-size="11.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">读文本判断风险</text><line x1="548.0" y1="134.0" x2="592.0" y2="134.0" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#mk1)"/><rect x="596.0" y="108.0" width="200.0" height="52.0" rx="8" fill="#161b22"/><text x="696.0" y="140.0" font-size="11.5" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="400">输入 y 回车</text><text x="96.0" y="184.0" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">3 步，信息密度低但零 friction</text><text x="28.0" y="220.0" font-size="12" fill="#3fb950" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="700">GUI</text><rect x="96.0" y="192.0" width="460.0" height="150.0" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.4"/><text x="116.0" y="222.0" font-size="12" fill="#3fb950" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="700">read_file</text><rect x="220.0" y="207.0" width="110.5" height="20.0" rx="10" fill="#d29922" opacity="0.14"/><rect x="220.0" y="207.0" width="110.5" height="20.0" rx="10" fill="none" stroke="#d29922" stroke-width="1"/><text x="228.0" y="218.0" font-size="10" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">风险等级：敏感路径</text><text x="116.0" y="252.0" font-size="11.5" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">路径：~/.ssh/config</text><text x="116.0" y="276.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">原因：检查 SSH 配置以排查连接问题</text><rect x="596.0" y="238.0" width="130.0" height="58.0" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.4"/><text x="661.0" y="273.0" font-size="13" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">本次允许</text><line x1="558.0" y1="267.0" x2="594.0" y2="267.0" stroke="#3fb950" stroke-width="1.8" marker-end="url(#mk2)"/><text x="744.0" y="250.0" font-size="11.5" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">1 步操作</text><text x="744.0" y="272.0" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">扫一眼颜色 → 点击</text><text x="744.0" y="290.0" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">前置信息摄入</text><text x="96.0" y="372.0" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">线性操作（顺序读完才能判断）  →  空间决策（颜色 / 图标 / 按钮位置同时进入视野）</text><text x="450.0" y="424.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">差距不是「GUI 展示更多信息」，而是 GUI 把线性操作变成空间决策——颜色、图标、按钮位置同时进入视野，用户可以跳读。</text></svg>