<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620">
<rect x="0" y="0" width="960" height="620" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<text x="28" y="38" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">2×2 配对表：信息只在 b 与 c 两格</text>
<line x1="28" y1="52" x2="932" y2="52" stroke="#30363d" stroke-width="1"/>

<!-- 表头 -->
<text x="350" y="100" font-size="12" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">对照臂：成功</text>
<text x="680" y="100" font-size="12" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">对照臂：失败</text>
<text x="96" y="205" font-size="12" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">treatment</text>
<text x="96" y="222" font-size="12" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">成功</text>
<text x="96" y="365" font-size="12" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">treatment</text>
<text x="96" y="382" font-size="12" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">失败</text>

<!-- a 格：都成（灰显） -->
<rect x="170" y="120" width="330" height="140" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" opacity="0.55"/>
<text x="335" y="180" font-size="11" fill="#6e7681" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="700">a</text>
<text x="335" y="205" font-size="12.5" fill="#6e7681" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">都成：无信息</text>
<!-- b 格：对照失败 treatment 赢（绿） -->
<rect x="530" y="120" width="330" height="140" rx="8" fill="#3fb950" fill-opacity="0.13" stroke="#3fb950" stroke-width="2"/>
<text x="695" y="172" font-size="11" fill="#3fb950" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="700">b</text>
<text x="695" y="200" font-size="13.5" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">treatment 赢</text>
<text x="695" y="224" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">分歧对：treatment 成、对照败</text>
<!-- c 格：对照赢（红） -->
<rect x="170" y="290" width="330" height="140" rx="8" fill="#f85149" fill-opacity="0.13" stroke="#f85149" stroke-width="2"/>
<text x="335" y="342" font-size="11" fill="#f85149" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="700">c</text>
<text x="335" y="370" font-size="13.5" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">对照赢</text>
<text x="335" y="394" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">分歧对：对照成、treatment 败</text>
<!-- d 格：都败（灰显） -->
<rect x="530" y="290" width="330" height="140" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" opacity="0.55"/>
<text x="695" y="350" font-size="11" fill="#6e7681" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="700">d</text>
<text x="695" y="375" font-size="12.5" fill="#6e7681" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">都败：无信息</text>

<!-- 天平 -->
<line x1="515" y1="262" x2="515" y2="308" stroke="#d29922" stroke-width="2"/>
<line x1="480" y1="266" x2="550" y2="266" stroke="#d29922" stroke-width="2"/>
<path d="M474,266 l-8,18 h16 z" fill="#3fb950" fill-opacity="0.3" stroke="#3fb950" stroke-width="1.2"/>
<path d="M556,266 l-8,18 h16 z" fill="#f85149" fill-opacity="0.3" stroke="#f85149" stroke-width="1.2"/>
<circle cx="515" cy="260" r="4" fill="#d29922"/>
<line x1="505" y1="308" x2="525" y2="308" stroke="#d29922" stroke-width="2"/>

<!-- 说明条 -->
<rect x="140" y="466" width="680" height="44" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.1"/>
<text x="480" y="493" font-size="11.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">b vs c：零假设下等于抛硬币（exact 二项检验）</text>

<text x="40" y="592" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">p 值只看 b+c；样本量按预期分歧对数倒推，不按总样本量。</text>
</svg>
