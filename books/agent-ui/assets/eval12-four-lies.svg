<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520">
<defs>

</defs>
<rect x="0" y="0" width="960" height="520" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<text x="28" y="38" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">分数说谎的四种方式，各配一个问题</text>
<line x1="28" y1="52" x2="932" y2="52" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="72" width="446" height="204" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1"/>
<rect x="28" y="72" width="446" height="46" rx="6" fill="#f85149" fill-opacity="0.12" stroke="#f85149" stroke-width="1"/>
<text x="46" y="102" font-size="16" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">空跑</text>
<text x="100" y="102" font-size="13.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">什么都不做，能拿几分？</text>
<text x="46" y="148" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">病例</text>
<text x="46" y="168" font-size="11.5" fill="#c9d1d9" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">τ-bench airline：空跑 agent 38 分，GPT-4o agent 35 分</text>
<text x="46" y="218" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">检查</text>
<text x="46" y="238" font-size="11.5" fill="#c9d1d9" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">空跑必须失败、oracle 必须满分；每条检查标「空跑会不会过」</text>
<rect x="486" y="72" width="446" height="204" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1"/>
<rect x="486" y="72" width="446" height="46" rx="6" fill="#d29922" fill-opacity="0.12" stroke="#d29922" stroke-width="1"/>
<text x="504" y="102" font-size="16" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">总分</text>
<text x="558" y="102" font-size="13.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">拆开看，哪里变了？</text>
<text x="504" y="148" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">病例</text>
<text x="504" y="168" font-size="11.5" fill="#c9d1d9" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">办公总分 79.60 对 79.57；「多文件抽取」87.7 掉到 70.5</text>
<text x="504" y="218" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">检查</text>
<text x="504" y="238" font-size="11.5" fill="#c9d1d9" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">按切片报；判定用二元；非要一个数就用 pass-all rate</text>
<rect x="28" y="290" width="446" height="204" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
<rect x="28" y="290" width="446" height="46" rx="6" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff" stroke-width="1"/>
<text x="46" y="320" font-size="16" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">分母</text>
<text x="100" y="320" font-size="13.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">分母里少了谁？</text>
<text x="46" y="366" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">病例</text>
<text x="46" y="386" font-size="11.5" fill="#c9d1d9" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">评分器越早崩分越高；剔掉一次失败，pass² 从 0.167 到 0.333</text>
<text x="46" y="436" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">检查</text>
<text x="46" y="456" font-size="11.5" fill="#c9d1d9" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">分母用期望清单；按责任归属决定进不进分母，被剔除的单独计数</text>
<rect x="486" y="290" width="446" height="204" rx="6" fill="#161b22" stroke="#bc8cff" stroke-width="1"/>
<rect x="486" y="290" width="446" height="46" rx="6" fill="#bc8cff" fill-opacity="0.12" stroke="#bc8cff" stroke-width="1"/>
<text x="504" y="320" font-size="16" fill="#bc8cff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">终态</text>
<text x="558" y="320" font-size="13.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">终态之外，发生过什么？</text>
<text x="504" y="366" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">病例</text>
<text x="504" y="386" font-size="11.5" fill="#c9d1d9" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">新增与删除按内容哈希配对抵消，撤销了的破坏看不见</text>
<text x="504" y="436" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">检查</text>
<text x="504" y="456" font-size="11.5" fill="#c9d1d9" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">不可撤销的调用单独判；豁免随任务声明，每次评分列出</text>
<text x="28" y="508" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">四种都不报错，而且大多让分数更好看</text>
</svg>
