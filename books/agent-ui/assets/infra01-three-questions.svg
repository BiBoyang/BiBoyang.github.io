<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430"><defs><marker id="mk1" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#d29922"/></marker><marker id="mk2" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#f85149"/></marker></defs><rect x="0.0" y="0.0" width="920.0" height="430.0" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="28.0" y="38.0" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">停在半行字上的界面</text><line x1="28" y1="52" x2="892" y2="52" stroke="#30363d" stroke-width="1"/><rect x="40.0" y="92.0" width="540.0" height="290.0" rx="10" fill="#0d1117" stroke="#8b949e" stroke-width="1.5"/><rect x="40.0" y="92.0" width="540.0" height="34.0" rx="10" fill="#161b22" stroke="none" stroke-width="1"/><rect x="40.0" y="110.0" width="540.0" height="16.0" rx="0" fill="#161b22" stroke="none" stroke-width="1"/><circle cx="60.0" cy="109.0" r="5.0" fill="#f85149"/><circle cx="76.0" cy="109.0" r="5.0" fill="#d29922"/><circle cx="92.0" cy="109.0" r="5.0" fill="#3fb950"/><rect x="420.0" y="100.0" width="146.0" height="20.0" rx="10" fill="#f85149" opacity="0.18"/><rect x="420.0" y="100.0" width="146.0" height="20.0" rx="10" fill="none" stroke="#f85149" stroke-width="1"/><text x="493.0" y="114.0" font-size="9.5" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">网络已断开 8 秒</text><rect x="64.0" y="146.0" width="220.0" height="30.0" rx="8" fill="#58a6ff" opacity="0.25"/><text x="78.0" y="166.0" font-size="10" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">把上周的会议记录整理成表格</text><rect x="64.0" y="190.0" width="460.0" height="170.0" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="80.0" y="216.0" font-size="10.5" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">| 日期 | 会议 | 结论 |</text><text x="80.0" y="236.0" font-size="10.5" fill="#8b949e" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">|------|------|------|</text><text x="80.0" y="256.0" font-size="10.5" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">| 09-24 | 架构评审 | 通过 |</text><text x="80.0" y="276.0" font-size="10.5" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">| 09-26 | 产品周会 | 待定 |</text><text x="80.0" y="296.0" font-size="10.5" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" font-weight="400">| 09-28 | 预算复盘 | 削减 </text><rect x="196.0" y="286.0" width="2.0" height="14.0" rx="8" fill="#3fb950"/><line x1="80.0" y1="312.0" x2="300.0" y2="312.0" stroke="#30363d" stroke-width="1" stroke-dasharray="2 4"/><path d="M500,290 a8,8 0 1,1 -8,-8" fill="none" stroke="#3fb950" stroke-width="1.6"/><text x="80.0" y="344.0" font-size="9" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">光标还在闪、加载动画还在转——界面一切如常</text><rect x="620.0" y="104.0" width="230.0" height="52.0" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.4"/><text x="735.0" y="136.0" font-size="13" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">还连着吗？</text><line x1="580.0" y1="130.0" x2="616.0" y2="130.0" stroke="#d29922" stroke-width="1.5" marker-end="url(#mk1)"/><line x1="852.0" y1="130.0" x2="892.0" y2="130.0" stroke="#f85149" 