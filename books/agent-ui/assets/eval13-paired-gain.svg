<text x="258" y="266" font-size="12.5" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">每个实例前清空（stateless）</text>
