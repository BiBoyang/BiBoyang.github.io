" font-size="11" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">加熔断器之前：</text><text x="48.0" y="370.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">1,279 个会话出现 50+ 次连续失败，每天浪费约 25 万次 API 调用。</text><text x="48.0" y="387.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">压缩要调模型，模型失败触发重试，重试带着更大的上下文——</text><text x="48.0" y="404.0" font-size="9.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">垃圾回收器自己成了内存泄漏。</text><rect x="648.0" y="322.0" width="262.0" height="96.0" rx="8" fill="#f85149" opacity="0.1"/><rect x="648.0" y="322.0" width="262.0" height="96.0" rx="8" fill="none" stroke="#f85149" stroke-width="1.6"/><text x="779.0" y="350.0" font-size="13" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">熔断器</text><text x="779.0" y="374.0" font-size="10.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">连续失败 3 次自动放弃</text><text x="779.0" y="396.0" font-size="8.5" fill="#8b949e" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="400">MAX_CONSECUTIVE_AUTOCOMPACT_FAILURES = 3</text><line x1="779.0" y1="322.0" x2="810.0" y2="298.0" stroke="#f85149" stroke-width="1.4" marker-end="url(#mk2)"/><text x="470.0" y="454.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">确定性便宜的先上，概率性昂贵的兜底——和渲染侧 stable prefix / 沉降分级同一个设计哲学。</text></svg>