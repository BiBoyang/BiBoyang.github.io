<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440"><defs></defs><rect x="0.0" y="0.0" width="900.0" height="440.0" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="28.0" y="38.0" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">agent loop 不能拥有 socket</text><line x1="28" y1="52" x2="872" y2="52" stroke="#30363d" stroke-width="1"/><rect x="30.0" y="96.0" width="410.0" height="130.0" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.6"/><text x="54.0" y="140.0" font-size="15" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">执行不拥有连接</text><line x1="54.0" y1="154.0" x2="416.0" y2="154.0" stroke="#30363d" stroke-width="1"/><text x="54.0" y="186.0" font-size="11" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">挂起、杀进程、换服务器，会话继续</text><rect x="464.0" y="96.0" width="410.0" height="130.0" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.6"/><text x="488.0" y="140.0" font-size="15" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">连接不携带事实</text><line x1="488.0" y1="154.0" x2="850.0" y2="154.0" stroke="#30363d" stroke-width="1"/><text x="488.0" y="186.0" font-size="11" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">断了，游标和 log 还在</text><rect x="30.0" y="244.0" width="410.0" height="130.0" rx="8" fill="#161b22" stroke="#bc8cff" stroke-width="1.6"/><text x="54.0" y="288.0" font-size="15" fill="#bc8cff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">推送不携带内容</text><line x1="54.0" y1="302.0" x2="416.0" y2="302.0" stroke="#30363d" stroke-width="1"/><text x="54.0" y="334.0" font-size="11" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">门铃只负责叫人</text><rect x="464.0" y="244.0" width="410.0" height="130.0" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.6"/><text x="488.0" y="288.0" font-size="15" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">客户端不携带状态</text><line x1="488.0" y1="302.0" x2="850.0" y2="302.0" stroke="#30363d" stroke-width="1"/><text x="488.0" y="334.0" font-size="11" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">它的每样记忆都有磁盘或服务端的备份</text><circle cx="450.0" cy="257.0" r="30.0" fill="#0d1117" stroke="#8b949e" stroke-width="1.5"/><text x="450.0" y="252.0" font-size="11" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">四</text><text x="450.0" y="268.0" font-size="11" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">分离</text><text x="450.0" y="424.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">移动端不是这套原则的应用场景，是它最苛刻的证明环境——桌面端能蒙混过关的架构，在手机上四秒内露馅。</text></svg>