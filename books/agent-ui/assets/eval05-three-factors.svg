<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560"><defs><marker id="mk-3fb950" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#3fb950"/></marker><marker id="mk-8b949e" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#8b949e"/></marker><marker id="mk-f85149" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#f85149"/></marker></defs><rect x="0" y="0" width="960" height="560" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="28" y="38" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">检出率的三道闸门：缺一，即未检出</text><line x1="28" y1="52" x2="932" y2="52" stroke="#30363d" stroke-width="1"/><text x="480" y="92" font-size="17" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="700"><tspan fill="#e6edf3">检出率 = </tspan><tspan fill="#58a6ff">读到</tspan><tspan fill="#e6edf3"> × </tspan><tspan fill="#d29922">愿报</tspan><tspan fill="#e6edf3"> × </tspan><tspan fill="#3fb950">挡路</tspan></text><line x1="70" y1="220" x2="868" y2="220" stroke="#8b949e" stroke-width="2" marker-end="url(#mk-8b949e)"/><rect x="175" y="150" width="130" height="140" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.6"/><text x="240" y="182" font-size="14" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">① 读到</text><line x1="199" y1="196" x2="281" y2="196" stroke="#58a6ff" stroke-width="1"/><text x="240" y="316" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">失效形态 T3：</text><text x="240" y="334" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">伤件从未被打开</text><rect x="415" y="150" width="130" height="140" rx="10" fill="#161b22" stroke="#d29922" stroke-width="1.6"/><text x="480" y="182" font-size="14" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">② 愿报</text><line x1="439" y1="196" x2="521" y2="196" stroke="#d29922" stroke-width="1"/><text x="480" y="316" font-size="10" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">「察觉了但没报」</text><text x="480" y="334" font-size="10" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">= 最危险的未检出形态</text><rect x="655" y="150" width="130" height="140" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.6"/><text x="720" y="182" font-size="14" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">③ 挡路</text><line x1="679" y1="196" x2="761" y2="196" stroke="#3fb950" stroke-width="1"/><text x="720" y="316" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">检出 ≠ 止损：</text><text x="720" y="334" font-size="10" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">报了照样跑完</text><path d="M 868,220 C 900,220 890,180 892,166" fill="none" stroke="#3fb950" stroke-width="1.6" marker-end="url(#mk-3fb950)"/><path d="M 868,220 C 900,220 890,280 892,296" fill="none" stroke="#f85149" stroke-width="1.6" marker-end="url(#mk-f85149)"/><rect x="848" y="132" width="88" height="34" rx="17.0" fill="#161b22" stroke="#3fb950" stroke-width="1.2"/><text x="892.0" y="153.68" font-size="13" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">检出</text><rect x="842" y="296" width="100" height="34" rx="17.0" fill="#161b22" stroke="#f85149" stroke-width="1.2"/><text x="892.0" y="317.68" font-size="13" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">未检出</text><path d="M 892,332 L 892,470 L 116,470 L 116,300" fill="none" stroke="#f85149" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#mk-f85149)"/><text x="500" y="458" font-size="11" fill="#f85149" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">未检出 → 沿闸门折返，反推断在哪一道</text><text x="500" y="496" font-size="10.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">每一级失效都有自己的名字，所以可归因、可修复。</text></svg>