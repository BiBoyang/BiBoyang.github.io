<svg xmlns="http://www.w3.org/2000/svg" width="940" height="508" viewBox="0 0 940 508"><defs><marker id="mk1" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#bc8cff"/></marker><marker id="mk2" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#58a6ff"/></marker><marker id="mk3" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#3fb950"/></marker></defs><rect x="0.0" y="0.0" width="940.0" height="508.0" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="28.0" y="38.0" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">同一张地图上的三条国境线</text><line x1="28" y1="52" x2="912" y2="52" stroke="#30363d" stroke-width="1"/><circle cx="470.0" cy="250.0" r="52.0" fill="#0d1117" stroke="#e6edf3" stroke-width="2"/><text x="470.0" y="246.0" font-size="14" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="700">agent</text><text x="470.0" y="264.0" font-size="9" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">（节点）</text><rect x="680.0" y="196.0" width="230.0" height="108.0" rx="8" fill="#161b22" stroke="#bc8cff" stroke-width="1.6"/><text x="795.0" y="224.0" font-size="12.5" fill="#bc8cff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">→ 工具（MCP）</text><text x="795.0" y="246.0" font-size="10" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">会话性：无</text><text x="795.0" y="264.0" font-size="8.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">（2026-07 起显式无状态）</text><text x="795.0" y="286.0" font-size="8.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">对面近似纯函数：调用、返回、结束</text><line x1="524.0" y1="250.0" x2="676.0" y2="250.0" stroke="#bc8cff" stroke-width="1.8" marker-end="url(#mk1)"/><text x="600.0" y="240.0" font-size="8.5" fill="#bc8cff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">agent 是主语，征用外界</text><rect x="355.0" y="92.0" width="230.0" height="100.0" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.6"/><text x="470.0" y="118.0" font-size="12.5" fill="#58a6ff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">↑ 编辑器（ACP）</text><text x="470.0" y="138.0" font-size="8.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">会话性：有（会话配置、流式工具调用）</text><text x="470.0" y="156.0" font-size="8.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">对面深度有状态：打开的文件、</text><text x="470.0" y="172.0" font-size="8.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">光标位置、diff 面板展开状态</text><line x1="470.0" y1="198.0" x2="470.0" y2="192.0" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#mk2)"/><rect x="620.0" y="92.0" width="290.0" height="100.0" rx="8" fill="#0d1117" stroke="#58a6ff" stroke-width="1" stroke-dasharray="4 3"/><text x="636.0" y="118.0" font-size="9" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">侧注：AI coding agent 的 LSP 时刻</text><text x="636.0" y="136.0" font-size="9" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">Zed + JetBrains 两个 Registry</text><text x="636.0" y="154.0" font-size="9" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">编辑器是主语，它去征用一个 agent</text><line x1="585.0" y1="142.0" x2="618.0" y2="142.0" stroke="#58a6ff" stroke-width="1" stroke-dasharray="3 3"/><rect x="355.0" y="308.0" width="230.0" height="100.0" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.6"/><text x="470.0" y="334.0" font-size="12.5" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">↓ 前端（AG-UI）</text><text x="470.0" y="354.0" font-size="8.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">会话性：有（事件流 + 状态同步）</text><text x="470.0" y="372.0" font-size="8.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">对面要增量——</text><text x="470.0" y="388.0" font-size="8.5" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">干脆把整个协议做成事件流</text><line x1="470.0" y1="302.0" x2="470.0" y2="308.0" stroke="#3fb950" stroke-width="1.8" marker-end="url(#mk3)"/><text x="300.0" y="360.0" font-size="8.5" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">前端是消费者，订阅事件流</text><rect x="28.0" y="424.0" width="884.0" height="38.0" rx="8" fill="#d29922" opacity="0.12"/><rect x="28.0" y="424.0" width="884.0" height="38.0" rx="8" fill="none" stroke="#d29922" stroke-width="1.4"/><text x="470.0" y="449.0" font-size="12" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">规律：协议的会话性，由边界另一端是否有状态决定。</text><text x="470.0" y="492.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">界面的每一个承诺，往下挖两层都会碰到一条协议的条款。</text></svg>