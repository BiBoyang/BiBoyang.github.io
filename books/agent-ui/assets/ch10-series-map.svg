950" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="700">03</text><text x="486.0" y="162.0" font-size="9" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">Markdown 流式地狱</text><line x1="572.0" y1="148.0" x2="586.0" y2="148.0" stroke="#3fb950" stroke-width="1.5" marker-end="url(#mk1)"/><rect x="588.0" y="110.0" width="168.0" height="76.0" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="672.0" y="140.0" font-size="11" fill="#3fb950" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="700">04</text><text x="672.0" y="162.0" font-size="9" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">事件树展平</text><line x1="758.0" y1="148.0" x2="772.0" y2="148.0" stroke="#3fb950" stroke-width="1.5" marker-end="url(#mk1)"/><rect x="774.0" y="110.0" width="168.0" height="76.0" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="858.0" y="140.0" font-size="11" fill="#3fb950" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="700">05</text><text x="858.0" y="162.0" font-size="9" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">Event Sourcing</text><line x1="858.0" y1="188.0" x2="858.0" y2="304.0" stroke="#3fb950" stroke-width="1.5" marker-end="url(#mk1)"/><rect x="774.0" y="306.0" width="168.0" height="76.0" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="858.0" y="336.0" font-size="11" fill="#3fb950" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="700">06</text><text x="858.0" y="358.0" font-size="9" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">Agent GUI 为什么难</text><line x1="944.0" y1="344.0" x2="586.0" y2="344.0" stroke="#3fb950" stroke-width="1.5" marker-end="url(#mk1)"/><rect x="588.0" y="306.0" width="168.0" height="76.0" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="672.0" y="336.0" font-size="11" fill="#3fb950" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="700">07</text><text x="672.0" y="358.0" font-size="9" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">GUI 流式渲染</text><line x1="758.0" y1="344.0" x2="400.0" y2="344.0" stroke="#3fb950" stroke-width="1.5" marker-end="url(#mk1)"/><rect x="402.0" y="306.0" width="168.0" height="76.0" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="486.0" y="336.0" font-size="11" fill="#3fb950" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="700">08</text><text x="486.0" y="358.0" font-size="9" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">权限与 Diff（信任界面）</text><line x1="572.0" y1="344.0" x2="214.0" y2="344.0" stroke="#3fb950" stroke-width="1.5" marker-end="url(#mk1)"/><rect x="216.0" y="306.0" width="168.0" height="76.0" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="300.0" y="336.0" font-size="11" fill="#3fb950" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="700">09</text><text x="300.0" y="358.0" font-size="9" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">多端投影</text><line x1="386.0" y1="344.0" x2="28.0" y2="344.0" stroke="#3fb950" stroke-width="1.5" marker-end="url(#mk1)"/><rect x="30.0" y="306.0" width="168.0" height="76.0" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.4"/><text x="114.0" y="336.0" font-size="11" fill="#3fb950" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" font-weight="700">10</text><text x="114.0" y="358.0" font-size="9" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">回到人</text><text x="470.0" y="404.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">从 LLM token 到用户看到的画面，中间到底经历了什么——在不同介质里有怎样完全不同的形态。</text></svg>