<svg xmlns="http://www.w3.org/2000/svg" width="940" height="520" viewBox="0 0 940 520"><rect x="0.0" y="0.0" width="940.0" height="520.0" fill="#0d1117" rx="12" stroke="#30363d" stroke-width="1"/><text x="28.0" y="38.0" font-size="15.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">事件三层分类：同一事件，不同响应契约</text><line x1="28.0" y1="52.0" x2="912.0" y2="52.0" stroke="#30363d" stroke-width="1"/><text x="60.0" y="84.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">层级</text><text x="190.0" y="84.0" font-size="11" fill="#8b949e" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start">事件例子</text><text x="440.0" y="84.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">CLI / TUI 投影</text><text x="690.0" y="84.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">GUI 投影</text><line x1="40.0" y1="96.0" x2="900.0" y2="96.0" stroke="#30363d" stroke-width="1"/><rect x="48.0" y="110.0" width="852.0" height="112.0" fill="#161b22" rx="8" stroke="#3fb950" stroke-width="1"/><rect x="48.0" y="110.0" width="4.0" height="112.0" fill="#3fb950" rx="2"/><text x="64.0" y="144.0" font-size="13" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">执行流</text><text x="64.0" y="166.0" font-size="10" fill="#3fb950" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">所有 UI 的基线</text><text x="190.0" y="144.0" font-size="10" fill="#8b949e" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start">tool.started / tool.finished</text><text x="190.0" y="164.0" font-size="10" fill="#8b949e" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start">validation.* / plan.updated</text><text x="440.0" y="156.0" font-size="11.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">展平为线性文本行</text><text x="690.0" y="156.0" font-size="11.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">卡片 + 状态动画</text><rect x="48.0" y="240.0" width="852.0" height="112.0" fill="#161b22" rx="8" stroke="#bc8cff" stroke-width="1"/><rect x="48.0" y="240.0" width="4.0" height="112.0" fill="#bc8cff" rx="2"/><text x="64.0" y="274.0" font-size="13" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">副作用流</text><text x="64.0" y="296.0" font-size="10" fill="#bc8cff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">投影成本差最大</text><text x="190.0" y="274.0" font-size="10" fill="#8b949e" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start">file.changed</text><text x="190.0" y="294.0" font-size="10" fill="#8b949e" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start">tool.output</text><text x="440.0" y="286.0" font-size="11.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">一行路径字符串</text><text x="690.0" y="286.0" font-size="11.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">diff 审查面板：并排对比、行级采纳</text><text x="690.0" y="312.0" font-size="10" fill="#bc8cff" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">成本差 1 个数量级</text><rect x="48.0" y="370.0" width="852.0" height="112.0" fill="#161b22" rx="8" stroke="#d29922" stroke-width="1.2"/><rect x="48.0" y="370.0" width="4.0" height="112.0" fill="#d29922" rx="2"/><text x="64.0" y="404.0" font-size="13" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">交互流</text><text x="64.0" y="426.0" font-size="10" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">阻塞 vs 非阻塞</text><text x="190.0" y="404.0" font-size="10" fill="#8b949e" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start">permission.requested</text><text x="190.0" y="424.0" font-size="10" fill="#8b949e" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start">permission.resolved</text><text x="440.0" y="416.0" font-size="11.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">阻塞式 [y/n]：进程停在 stdin</text><text x="690.0" y="416.0" font-size="11.5" fill="#e6edf3" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">非阻塞 toast + badge，稍后处理</text><text x="690.0" y="442.0" font-size="10" fill="#d29922" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="start">事件类型相同，响应契约完全不同</text><text x="470.0" y="502.0" font-size="11" fill="#8b949e" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle">先稳定事件协议，再谈 GUI 复杂交互——否则交互流的优势无从发挥</text></svg>